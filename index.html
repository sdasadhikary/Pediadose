lacenta, can theoretically be removed from the neonatal circulation by these means, but limited experience has not shown that such removal is central to the treatment of these infants.","Safety and effectiveness in pediatric patients have not been established."]},{"n":"ranitidine","a":"","c":"GI","b":"Ranitidine","s":"fb67e8c7-b817-4253-a1a1-5ecdcee694cf","d":"20211124","p":["Pediatric Use The safety and effectiveness of ranitidine has been established in the age-group of 1 month to 16 years.","There is insufficient information about the pharmacokinetics of ranitidine in neonatal patients (less than 1 month of age) to make dosing recommendations.","The following 3 subsections provide dosing information for each of the pediatric indications."]},{"n":"rasburicase","a":"","c":"Oncology","b":"Elitek","s":"0ae10bc4-6b65-402f-9db5-2d7753054922","d":"20260730","p":["2 DOSAGE AND ADMINISTRATION Administer at 0.2 mg/kg as an intravenous infusion over 30 minutes daily for up to 5 days. ( 2.1 )","2.1 Dosage The recommended dose of Elitek is 0.2 mg/kg as a 30-minute intravenous infusion daily for up to 5 days.","8.4 Pediatric Use The safety and effectiveness of Elitek have been established in pediatric patients ages 1 month to 17 years for initial management of plasma uric acid levels in patients with leukemia, lymphoma, and solid tumor malignancies who are receiving anticancer therapy expected to result in"]},{"n":"remdesivir","a":"","c":"Antiviral","b":"Veklury","s":"c0978fa8-53ff-4ca2-82a7-567fd3e958ca","d":"20260729","p":["Recommended dosage: Adults and pediatric patients weighing at least 40 kg: a single loading dose of VEKLURY 200 mg on Day 1 followed by once-daily maintenance doses of VEKLURY 100 mg from Day 2 via intravenous infusion. ( 2.3 )","Pediatric patients (birth to less than 18 years of age) weighing 1.5 kg to less than 40 kg: Recommended dosage is based on weight.","Refer to Table 1 of the full prescribing information for specific dosing guidelines based on body weight. ( 2.3 )"]},{"n":"remifentanil","a":"","c":"Analgesic/opioid","b":"Ultiva","s":"4dbcb8f9-1987-4b66-bd2f-d251fda0be10","d":"20251215","p":["2 DOSAGE AND ADMINISTRATION \u2022 Monitor patients closely for respiratory depression when initiating therapy and following dosage increases and adjust the dosage accordingly. ( 2.1 ) \u2022 Administration : Continuous infusions of ULTIVA should be administered only by an infusion device. ( 2.1 ) \u2022 Initial D","Induction of Anesthesia ULTIVA should be administered at an infusion rate of 0.5 to 1 mcg/kg/min with a hypnotic or volatile agent for the induction of anesthesia.","If endotracheal intubation is to occur less than 8 minutes after the start of the infusion of ULTIVA, then an initial dose of 1 mcg/kg may be administered over 30 to 60 seconds."]},{"n":"ribavirin","a":"","c":"Antiviral","b":"Ribavirin","s":"35f99f76-f2ef-4a81-91ff-285419664be3","d":"20240206","p":["2 DOSAGE AND ADMINISTRATION Ribavirin capsules are administered according to body weight. ( 2.1 , 2.2 , 2.3 )","2.2 Ribavirin capsules/PegIntron Combination Therapy Adult Patients The recommended dose of ribavirin capsules when used in combination with PegIntron is 800 mg to 1,400 mg based on patient body weight in two divided doses (see Table 1).","Table 1: Recommended Adult Dosing for Ribavirin capsules in Combination with PegIntron Body Weight (kg)"]},{"n":"riboflavin","a":"","c":"Nutritional","b":"Photrexa Cross-linking Kit","s":"f82cfe92-1a24-11e3-8ffd-0800200c9a66","d":"20260724","p":["8.4 Pediatric Use The safety and effectiveness of corneal collagen cross-linking has not been established in pediatric patients below the age of 14 years."]},{"n":"rifampin","a":"rifampicin","c":"Antibiotic/TB","b":"RIFAMPIN","s":"0391f1e1-70d4-4b15-8b58-055bb6a385b8","d":"20231220","p":["Tuberculosis Adults 10 mg/kg, in a single daily administration, not to exceed 600 mg/day, orally.","Pediatric Patients 10 to 20 mg/kg, not to exceed 600 mg/day, orally.","Pediatric Patients Pediatric patients 1 month of age or older: 10 mg/kg (not to exceed 600 mg per dose) every 12 hours for two days."]},{"n":"rifapentine","a":"","c":"TB","b":"Priftin","s":"3a64fb70-b85e-43d9-8bcd-7e893f568ae1","d":"20260206","p":["Adults and pediatric patients \u226512 years: PRIFTIN (based on weight, see table below) and isoniazid 15 mg/kg (900 mg maximum). ( 2.2 )","Pediatric patients 2 to 11 years: PRIFTIN (based on weight, see table below) and isoniazid 25 mg/kg (900 mg maximum). ( 2.2 )","Adults and pediatric patients 12 years and older: The recommended dose of PRIFTIN should be determined based on weight of the patient up to a maximum of 900 mg once weekly (see Table 1 )."]},{"n":"rifaximin","a":"","c":"Antibiotic","b":"XIFAXAN","s":"7afafa63-3236-4212-9589-045db6b01c0b","d":"20250827","p":["8.4 Pediatric Use The safety and effectiveness of XIFAXAN has not been established in pediatric patients less than 12 years of age with TD or in patients less than 18 years of age for HE and IBS-D."]},{"n":"rilpivirine","a":"","c":"Antiretroviral","b":"EDURANT","s":"03880372-2c68-45c6-a53a-f420c49541d6","d":"20250828","p":["Pediatric patients 2 years of age and older and weighing at least 14 kg to less than 25 kg: Dosage of EDURANT PED is based on body weight. ( 2.3 )","For pregnant patients who are already on a stable EDURANT regimen prior to pregnancy and who are virologically suppressed (HIV-1 RNA less than 50 copies per mL) the recommended dosage in adults and pediatric patients weighing more than 25 kg is one 25 mg tablet once daily taken orally with a meal. (","2.1 Overview of Different Dosage Forms EDURANT is available in two dosage forms: EDURANT 25 mg film-coated tablets for adults and pediatric patients weighing at least 25 kg."]},{"n":"risperidone","a":"","c":"Psych","b":"RISPERIDONE","s":"03d3b52d-3a7d-4595-84c9-332da6ca9171","d":"20260625","p":["2 to 3 mg 1 mg 1 to 6 mg 1 to 6 mg Bipolar mania: children and adolescents ( 2.2 )","0.25 mg Can increase to 0.5 mg by Day 4: (body weight less than 20 kg)","0.5 mg Can increase to 1 mg by Day 4: (body weight greater than or equal to 20 kg)"]},{"n":"ritonavir","a":"","c":"Antiretroviral","b":"Ritonavir","s":"11f757f1-cf48-47a8-925e-918359cbd2d4","d":"20260917","p":["Pediatrics patients: Do not exceed 600 mg twice daily dose with meals for children greater than one month of age.","2.3 Dosage Recommendations in Pediatric Patients Ritonavir tablets must be used in combination with other antiretroviral agents [see Dosage and Administration (2.1)] .","The recommended dosage of ritonavir tablets in pediatric patients older than 1 month is 350 to 400 mg per m 2 twice daily by mouth to be taken with meals."]},{"n":"rituximab","a":"","c":"Oncology/immunology","b":"Rituxan","s":"b172773b-3905-4a1c-ad95-bab4b6126563","d":"20250106","p":["The dose for adult and pediatric B-cell NHL is 375 mg/m 2 ( 2.2 ).","The induction dose for pediatric patients with GPA and MPA in combination with glucocorticoids is 375 mg/m 2 once weekly for 4 weeks.","The follow up dose for pediatric patients with GPA and MPA who have achieved disease control with induction treatment, in combination with glucocorticoids is two 250 mg/m 2 intravenous infusions separated by two weeks, followed by a 250 mg/m 2 intravenous infusion every 6 months thereafter based on "]},{"n":"rivaroxaban","a":"","c":"Hematology","b":"Xarelto","s":"10db92f9-2300-4a80-836b-673e1ae91610","d":"20260910","p":["Pediatric Patients: See dosing recommendations in the Full Prescribing Information ( 2.2 )","Take with or without food 2.2 Recommended Dosage in Pediatric Patients Treatment of Venous Thromboembolism and Reduction in Risk of Recurrent Venous Thromboembolism in Pediatric Patients Table 2: Recommended Dosage in Pediatric Patients Birth to Less than 18 Years for Treatment of and Reduction in R","Dosage Form Body Weight 1 mg XARELTO = 1 mL Suspension Dosage Total Daily Dose All doses should be taken with feeding or with food since exposures match that of 20 mg daily dose in adults."]},{"n":"rocuronium","a":"","c":"Anesthesia","b":"Rocuronium Bromide","s":"01825411-be08-4402-b101-cb546291c972","d":"20260922","p":["Tracheal intubation : Recommended initial dose is 0.6 mg/kg. ( 2.2 )","Rapid sequence intubation : 0.6 to 1.2 mg/kg. ( 2.3 )","Continuous infusion : Initial rate of 10 to 12 mcg/kg/min."]},{"n":"romiplostim","a":"","c":"Hematology","b":"Nplate","s":"c45f9a58-37c1-4f76-8e36-97d38c577037","d":"20260623","p":["Recommended Initial Dose: 1 mcg/kg once weekly as a subcutaneous injection.","Patients acutely exposed to myelosuppressive doses of radiation Recommended Dose: 10 mcg/kg administered once as a subcutaneous injection.","Discontinue Nplate if the platelet count does not increase to a level sufficient to avoid clinically important bleeding after 4 weeks of Nplate therapy at the maximum weekly dose of 10 mcg/kg [see Warnings and Precautions ( 5.3 )] ."]},{"n":"ropivacaine","a":"","c":"Anesthesia","b":"Ropivacaine Hydrochloride","s":"1fb8e90a-4141-4707-8be6-31f2da5c8fd5","d":"20241107","p":["8.4 Pediatric Use The safety and efficacy of Ropivacaine Hydrochloride in pediatric patients have not been established."]},{"n":"rufinamide","a":"","c":"Neuro/anticonvulsant","b":"Banzel","s":"0a3fa925-1abd-458a-bd57-4ae780a1ef2d","d":"20221215","p":["Pediatric patients 1 year and older: Starting daily dose: 10 mg/kg per day in two equally divided doses ( 2.1 )","Increase by 10 mg/kg increments every other day to maximum dose of 45 mg/kg per day, not to exceed 3200 mg per day, in two divided doses ( 2.1 )","2.1 Dosage Information Pediatric patients ( 1 year to less than 17 years)"]},{"n":"salicylic acid","a":"","c":"Topical","b":"Shailee Psoriasis Treatment","s":"02a71ce4-baf5-4231-afd6-21ef0b22e931","d":"20251105","p":["Directions Adults and children aged 12 and over.","Children under 12 years old."]},{"n":"secnidazole","a":"","c":"Antibiotic","b":"Solosec","s":"056485b6-8bba-4a21-ae00-cdb4e7ae4bfa  1 1/2 teaspoons once a day 1 1/2 teaspoons twice a day Children 2 years to under 6 yeart l/2 - 3/4 teaspoon once a day 3/4 teaspoon twice a "]},{"n":"sertraline","a":"","c":"Psych","b":"Sertraline Hydrochloride","s":"00179766-980b-44b0-99d3-1fee2bb27e37","d":"20191101","p":["Dosage for Pediatric Population (Children and Adolescents)","Obsessive-Compulsive Disorder \u2013 Sertraline hydrochloride treatment should be initiated with a dose of 25 mg once daily in children (ages 6-12) and at a dose of 50 mg once daily in adolescents (ages 13-17).","While a relationship between dose and effect has not been established for OCD, patients were dosed in a range of 25-200 mg/day in the clinical trials demonstrating the effectiveness of Sertraline hydrochloride for pediatric patients (6-17 years) with OCD."]},{"n":"sevelamer","a":"","c":"Nephro","b":"sevelamer hydrochloride","s":"0500034d-458c-42c5-918d-9acd22f0c28b","d":"20260213","p":["8.4 Pediatric Use The safety and efficacy of sevelamer hydrochloride has not been established in pediatric patients."]},{"n":"sevoflurane","a":"","c":"Anesthesia","b":"Sevoflurane","s":"06b9f724-6425-4976-93eb-b9ca343ef5cf","d":"20251106","p":["Induction Sevoflurane has a nonpungent odor and does not cause respiratory irritability; it is suitable for mask induction in pediatrics and adults.","MAC Values for Adults and Pediatric Patients According to Age Age of Patient (years)","Sevoflurane in Oxygen Sevoflurane in 65% N 2 O/35% O 2 0 - 1 months # 3.3% 1 - < 6 months 3.0% 6 months - < 3 years 2.8% 2.0%@ 3 - 12 2.5% 25 2.6% 1.4% 40 2.1% 1.1% 60 1.7% 0.9% 80 1.4% 0.7% # Neonates are full-term gestational age."]},{"n":"sildenafil","a":"","c":"CVS","b":"Sildenafil","s":"083da718-e934-4941-b083-a19b4ebe3935","d":"20240122","p":["Pediatric use information is approved for Viatris Specialty LLC's, REVATIO (sildenafil) for Oral Suspension.","8.4 Pediatric Use The safety and effectiveness of sildenafil have not been established in pediatric patients younger than 1 year of age."]},{"n":"silver sulfadiazine","a":"","c":"Topical","b":"Silver Sulfadiazine","s":"067895f9-a797-4cbd-a3d2-d611d512fe5b","d":"20250617","p":["Safety and effectiveness in children have not been established. (See CONTRAINDICATIONS )"]},{"n":"simethicone","a":"","c":"GI","b":"Maximum Strength Gas Relief","s":"03bc9c99-2871-2604-e063-6394a90a2be5","d":"20240306","p":["Directions adults and children 12 years and older: swallow with water 1 or 2 softgels as needed after meals and at bedtime do not exceed 2 softgels in 24 hours except under the advice and supervision of a physician"]},{"n":"sirolimus","a":"","c":"Immunology","b":"sirolimus","s":"09f24e7a-0bea-4e02-b557-c60eb842d41a","d":"20261027","p":["The starting dose of cyclosporine should be up to 7 mg/kg/day in divided doses and the dose should subsequently be adjusted to achieve target whole blood trough concentrations [ see Dosage and Administration ( 2.5 ) ].","8.4 Pediatric Use Renal Transplant The safety and efficacy of sirolimus in pediatric patients < 13 years have not been established.","The safety and efficacy of sirolimus oral solution and sirolimus tablets have been established for prophylaxis of organ rejection in renal transplantation in children \u2265 13 years judged to be at low- to moderate-immunologic risk."]},{"n":"sitagliptin","a":"","c":"Endocrine","b":"JANUVIA","s":"194c3718-5eb5-4cf5-85d0-2bb1ed8293b8","d":"20260708","p":["8.4 Pediatric Use The safety and effectiveness of JANUVIA have not been established in pediatric patients.","Three 20-week double-blind, placebo-controlled studies each with 34-week extensions were conducted to evaluate the efficacy and safety of sitagliptin in 410 pediatric patients aged 10 to 17 years with inadequately controlled type 2 diabetes, with or without insulin therapy (HbA1c 6.5-10% for patient"]},{"n":"sodium acetate","a":"","c":"Electrolyte","b":"NORMOSOL-M AND DEXTROSE","s":"aba60c84-94d9-46d0-bdbb-25e0c4e8cc41","d":"20251024","p":["As reported in the literature, the dosage and constant infusion rate of intravenous dextrose must be selected with caution in pediatric patients, particularly neonates and low birth weight infants, because of the increased risk of hyperglycemia/hypoglycemia.","The safety and effectiveness in the pediatric population are based on the similarity of the clinical conditions of the pediatric and adult populations.","In neonates and very small infants the volume of fluid may affect fluid and electrolyte balance."]},{"n":"sodium bicarbonate","a":"","c":"Electrolyte","b":"Sodium Bicarbonate","s":"09cf38c2-0b44-eca1-e063-6294a90a72d8","d":"20231110","p":["The amount of bicarbonate to be given to older children and adults over a four-to-eight-hour period is approximately 2 to 5 mEq/kg of body weight - depending upon the severity of the acidosis as judged by the lowering of total CO 2 content, blood pH and clinical condition of the patient.","Initially an infusion of 2 to 5 mEq/kg body weight over a period of 4 to 8 hours will produce a measurable improvement in the abnormal acid-base status of the blood.","Pediatric Rapid injection (10 mL/min) of hypertonic Sodium Bicarbonate Injection, USP solutions into neonates and children under two years of age may produce hypernatremia, a decrease in cerebrospinal fluid pressure and possible intracranial hemorrhage."]},{"n":"sodium bicarbonate oral","a":"","c":"Nephro","b":"Sodium Bicarbonate","s":"09cf38c2-0b44-eca1-e063-6294a90a72d8","d":"20231110","p":["The amount of bicarbonate to be given to older children and adults over a four-to-eight-hour period is approximately 2 to 5 mEq/kg of body weight - depending upon the severity of the acidosis as judged by the lowering of total CO 2 content, blood pH and clinical condition of the patient.","Initially an infusion of 2 to 5 mEq/kg body weight over a period of 4 to 8 hours will produce a measurable improvement in the abnormal acid-base status of the blood.","Pediatric Rapid injection (10 mL/min) of hypertonic Sodium Bicarbonate Injection, USP solutions into neonates and children under two years of age may produce hypernatremia, a decrease in cerebrospinal fluid pressure and possible intracranial hemorrhage."]},{"n":"sodium chloride","a":"","c":"Electrolyte","b":"Ringers","s":"01721071-af03-4894-95c1-10b8bc64b888","d":"20251105","p":["Do not administer Ringer\u2019s Injection simultaneously with ceftriaxone in neonates (28 days of age or younger) due to serious risks. ( 2.4 )","2.4 Drug Incompatibilities Do not administer Ringer\u2019s Injection simultaneously with ceftriaxone in neonates (28 days of age or younger) due to serious risks [see Contraindications (4) and Warnings and Precautions (5.1) ].","8.4 Pediatric Use Ringer\u2019s Injection is contraindicated in neonates (28 days of age or younger) who are receiving ceftriaxone due to reported deaths that occurred when neonates received ceftriaxone and intravenous calcium-containing solutions concomitantly [see Warnings and Precautions (5.1) ]."]},{"n":"sodium chloride 3%","a":"","c":"Critical","b":"3% Sodium Chloride","s":"a8058593-48af-457a-b0f0-166935c7d10c","d":"20210114","p":["Pediatric Use The use of 3% Sodium Chloride Injection in pediatric patients is based on clinical practice (see DOSAGE AND ADMINISTRATION ).","Plasma electrolyte concentrations should be closely monitored in the pediatric population as this population may have impaired ability to regulate fluids and electrolytes."]},{"n":"sodium nitrite","a":"","c":"Toxicology","b":"Sodium Nitrite","s":"52f01c6e-172a-47a9-98a6-9eab7651a032","d":"20260309","p":["Sodium Nitrite - 0.2 mL/kg (6 mg/kg or 6-8 mL/m 2 BSA) of sodium nitrite at the rate of 2.5 to 5 mL/minute not to exceed 10 mL 2.)","Sodium Thiosulfate - 1 mL/kg of body weight (250 mg/kg or approximately 30-40 mL/m 2 of BSA) not to exceed 50 mL total dose immediately following administration of sodium nitrite.","Blood pressure must be monitored during infusion in both adults and children."]},{"n":"sodium nitroprusside","a":"","c":"CVS","b":"Sodium Nitroprusside","s":"01841345-bed3-458f-8e99-911fbd286512","d":"20210722","p":["Avoidance of excessive hypotension: While the average effective rate in adult and pediatric patients is about 3 mcg/kg/min, some patients will become dangerously hypotensive when they receive sodium nitroprusside injection at this rate.","Infusion of sodium nitroprusside should therefore be started at a very low rate (0.3 mcg/kg/min), with upward titration every few minutes until the desired effect is achieved or the maximum recommended infusion rate (10 mcg/kg/min) has been reached.","Table 2 below shows the infusion rates corresponding to the recommended initial and maximal doses (0.3 mcg/kg/min and 10 mcg/kg/min, respectively) for both adult and pediatric patients of various weights."]},{"n":"sodium phenylbutyrate","a":"","c":"Metabolic","b":"PHEBURANE","s":"d15f2cbf-4d22-40b5-8ef9-16b9d323a7f9","d":"20260717","p":["The recommended dosage measured as sodium phenylbutyrate is: Patients weighing < 20 kg: 450\u2013600 mg/kg/day of sodium phenylbutyrate orally. ( 2.1 )","The recommended dosage of PHEBURANE (measured as sodium phenylbutyrate) for patients with urea cycle disorders is: Patients weighing less than 20kg: 450 \u2013 600 mg/kg/day of sodium phenylbutyrate orally.","Swallow the coated oral pellets with a drink (e.g., water, fruit juices, protein-free infant formulas) or sprinkle onto spoonful of apple sauce or carrot puree."]},{"n":"sodium polystyrene sulfonate","a":"","c":"Electrolyte","b":"Sodium Polystyrene Sulfonate","s":"12d48dcf-07bd-4b06-bd6c-7543f1be8357","d":"20210815","p":["In smaller children and infants, lower doses should be employed by using as a guide a rate of 1 mEq of potassium per gram of resin as the basis for calculation.","Pediatric Use The effectiveness of SPS \u00ae Suspension in pediatric patients has not been established.","The use of SPS \u00ae Suspension is contraindicated in neonates and especially in premature infants."]},{"n":"sodium thiosulfate","a":"","c":"Toxicology","b":"Sodium Thiosulfate","s":"82f55408-2de9-463d-85e8-b39c3b259f0b","d":"20260526","p":["Sodium Nitrite - 0.2 mL/kg (6 mg/kg or 6-8 mL/m 2 BSA) of sodium nitrite at the rate of 2.5 to 5 mL/minute not to exceed 10 mL 2.)","Sodium Thiosulfate - 1 mL/kg of body weight (250 mg/kg or approximately 30-40 mL/m 2 of BSA) not to exceed 50 mL total dose immediately following administration of sodium nitrite.","Blood pressure must be monitored during infusion in both adults and children."]},{"n":"sofosbuvir","a":"","c":"Antiviral/HCV","b":"Sovaldi","s":"80beab2c-396e-4a37-a4dc-40fdb62859cf","d":"20241226","p":["Recommended dosage in pediatric patients 3 years of age and older: Recommended dosage of SOVALDI in pediatric patients 3 years of age and older with genotype 2 or 3 HCV using SOVALDI tablets or oral pellets is based on weight.","Refer to Table 3 of the full prescribing information for specific dosing guidelines based on body weight. ( 2.3 )","HCV/HIV-1 coinfection: For adult and pediatric patients with HCV/HIV-1 coinfection, follow the dosage recommendations in the tables below, respectively. ( 2.2 , 2.3 )"]},{"n":"spironolactone","a":"","c":"CVS/diuretic","b":"Spironolactone","s":"08738ad4-1607-4d55-af71-6790477353bd","d":"20261008","p":["8.4 Pediatric Use Safety and effectiveness in pediatric patients have not been established."]},{"n":"streptomycin","a":"","c":"Antibiotic","b":"Streptomycin","s":"abd1f64e-4283-4370-aae8-3666316aa36e","d":"20260121","p":["Children: It is recommended that intramuscular injections be given preferably in the mid-lateral muscles of the thigh.","In infants and small children the periphery of the upper outer quadrant of the gluteal region should be used only when necessary, such as in burn patients, in order to minimize the possibility of damage to the sciatic nerve.","The deltoid area should be used only if well developed, such as in certain adults and older children, and then only with caution to avoid radial nerve injury."]},{"n":"succimer","a":"","c":"Toxicology","b":"Chemet","s":"62035612-9505-3a3f-1ac8-e2dbd711d24e","d":"20250710","p":["Pediatric patients who cannot swallow whole capsules: Sprinkle contents of capsule in food (or on a spoon followed by a drink). ( 2.3 )","Recommended Dosage: 10 mg/kg or 350 mg/m 2 orally every 8 hours for five days followed by 10 mg/kg or 350 mg/m 2 orally every 12 hours for an additional 14 days. ( 2.2 )","2.1 Important Pretreatment Evaluations Identify the source of lead in the pediatric patient's environment and eliminate the source prior to beginning treatment with CHEMET."]},{"n":"succinylcholine","a":"","c":"Anesthesia","b":"Succinylcholine Chloride","s":"017e5ad4-028e-4e34-ac09-d0c8d64c880a","d":"20221223","p":["2.2 Dosage Recommendations for Intravenous Use in Adults For Short Surgical Procedures The average dose required to produce neuromuscular blockade and to facilitate tracheal intubation is 0.6 mg/kg succinylcholine chloride injection given intravenously.","The optimum intravenous dose of succinylcholine chloride injection will vary among patients and may be from 0.3 mg/kg to 1.1 mg/kg for adults.","An intravenous injection of 0.3 mg/kg to 1.1 mg/kg may be given initially, followed, at appropriate intervals, by further intravenous injections of 0.04 mg/kg to 0.07 mg/kg to maintain the degree of relaxation required."]},{"n":"sucralfate","a":"","c":"GI","b":"Sucralfate","s":"0206d7fa-a1d5-35d9-e063-6294a90a5eb3","d":"20250103","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established."]},{"n":"sufentanil","a":"","c":"Analgesic/opioid","b":"Sufentanil Citrate","s":"20293943-46ff-4345-1aa4-929b4e017a25","d":"20260601","p":["2 DOSAGE AND ADMINISTRATION \u2022 Sufentanil Citrate Injection should be administered only by persons specifically trained in the use of intravenous anesthetics and management of the respiratory effects of potent opioids. \u2022 Ensure that an opioid overdose reversal agent, resuscitative and intubation equi","For purposes of administering small volumes of Sufentanil Citrate Injection accurately, the use of a tuberculin syringe or equivalent is recommended. \u2022 Ensure that an opioid overdose reversal agent (e.g., naloxone, nalmefene) , resuscitative and intubation equipment, and oxygen are readily available","Adjunct to general anesthesia: \u2022 Doses of up to 8 mcg/kg (see Table 1) \u2022 Total Dosage Requirements of 1 mcg/kg/hr or less are recommended \u2022 Dosage should be individualized and adjusted to remaining operative time anticipated."]},{"n":"sugammadex","a":"","c":"Anesthesia","b":"Sugammadex","s":"21028965-598b-4cfa-a614-5c28ed40306a","d":"20260702","p":["2 DOSAGE AND ADMINISTRATION Dosing is based on actual body weight ( 2.1 )","For rocuronium and vecuronium: 4 mg/kg is recommended if spontaneous recovery of the twitch response has reached 1 to 2 post-tetanic counts (PTC) and there are no twitch responses to train-of-four (TOF) stimulation. ( 2.2 )","2 mg/kg is recommended if spontaneous recovery has reached the reappearance of the second twitch in response to TOF stimulation. ( 2.2 )"]},{"n":"sulfamethoxazole and trimethoprim","a":"co-trimoxazole","c":"Antibiotic","b":"Sulfamethoxazole and Trimethoprim","s":"079c828c-148f-45b9-966e-d8906043b2a2","d":"20241217","p":["DOSAGE AND ADMINISTRATION Sulfamethoxazole and trimethoprim tablets are contraindicated in pediatric patients less than 2 months of age.","Urinary Tract Infections and Shigellosis in Adults and Pediatric Patients, and Acute Otitis Media in Children Adults The usual adult dosage in the treatment of urinary tract infections is 1 sulfamethoxazole and trimethoprim DS (double strength) tablet or 2 sulfamethoxazole and trimethoprim tablets e","Children The recommended dose for children with urinary tract infections or acute otitis media is 40 mg/kg sulfamethoxazole and 8 mg/kg trimethoprim per 24 hours, given in two divided doses every 12 hours for 10 days."]},{"n":"sulfasalazine","a":"","c":"GI","b":"Sulfasalazine","s":"257cee60-b68f-4c2b-b57d-8e4d73d17e09","d":"20261030","p":["Children, six years of age and older: 40 to 60 mg/kg of body weight in each 24-hour period, divided into 3 to 6 doses.","Children, six years of age and older: 30 mg/kg of body weight in each 24-hour period, divided into 4 doses.","Suggested Dosing Schedule for Adult Rheumatoid Arthritis: Week of Treatment Number of sulfasalazine delayed release tablets Morning Evening 1 - One 2 One One 3 One Two 4 Two Two Juvenile Rheumatoid Arthritis - polyarticular course Children, six years of age and older: 30 to 50 mg/kg of body weight d"]},{"n":"sumatriptan","a":"","c":"Neuro","b":"Sumatriptan","s":"01293e09-d49a-411d-9647-6f23318ac201","d":"20240928","p":["8.4 Pediatric Use Safety and effectiveness in pediatric patients have not been established. sumatriptan injection is not recommended for use in patients younger than 18 years of age.","Two controlled clinical trials evaluated sumatriptan nasal spray (5 to 20 mg) in 1,248 pediatric migraineurs aged 12 to 17 years who treated a single attack.","The trials did not establish the efficacy of sumatriptan nasal spray compared with placebo in the treatment of migraine in pediatric patients."]},{"n":"tacrolimus","a":"","c":"Immunology","b":"Tacrolimus","s":"0a557ca9-b1a1-cf8f-a317-e4d8d4d6e60f","d":"20260904","p":["Whole Blood Trough Concentration Range Kidney Transplant With azathioprine 0.2 mg/kg/day capsules, divided in two doses, every 12 hours Month 1 to 3: 7 to 20 ng/mL Month 4 to 12: 5 to 15 ng/mL With MMF/IL-2 receptor antagonist 0.1 mg/kg/day capsules, divided in two doses, every 12 hours Month 1 to 1","Whole Blood Trough Concentration Range Kidney Transplant 0.3 mg/kg/day capsules or oral suspension, divided in two doses, every 12 hours Month 1 to 12: 5 to 20 ng/mL Liver Transplant 0.15 to 0.2 mg/kg/day capsules divided in two doses, every 12 hours Month 1 to 12: 5 to 20 ng/mL Heart Transplant 0.3","Initial Oral Dosage Whole Blood Trough Concentration Range Kidney Transplant With Azathioprine 0.2 mg/kg/day, divided in two doses, administered every 12 hours Month 1 to 3: 7 to 20 ng/mL Month 4 to 12: 5 to 15 ng/mL With MMF/IL-2 receptor antagonist In a second smaller trial, the initial dose of ta"]},{"n":"tacrolimus topical","a":"","c":"Topical","b":"Tacrolimus","s":"0a557ca9-b1a1-cf8f-a317-e4d8d4d6e60f","d":"20260904","p":["Whole Blood Trough Concentration Range Kidney Transplant With azathioprine 0.2 mg/kg/day capsules, divided in two doses, every 12 hours Month 1 to 3: 7 to 20 ng/mL Month 4 to 12: 5 to 15 ng/mL With MMF/IL-2 receptor antagonist 0.1 mg/kg/day capsules, divided in two doses, every 12 hours Month 1 to 1","Whole Blood Trough Concentration Range Kidney Transplant 0.3 mg/kg/day capsules or oral suspension, divided in two doses, every 12 hours Month 1 to 12: 5 to 20 ng/mL Liver Transplant 0.15 to 0.2 mg/kg/day capsules divided in two doses, every 12 hours Month 1 to 12: 5 to 20 ng/mL Heart Transplant 0.3","Initial Oral Dosage Whole Blood Trough Concentration Range Kidney Transplant With Azathioprine 0.2 mg/kg/day, divided in two doses, administered every 12 hours Month 1 to 3: 7 to 20 ng/mL Month 4 to 12: 5 to 15 ng/mL With MMF/IL-2 receptor antagonist In a second smaller trial, the initial dose of ta"]},{"n":"tadalafil","a":"","c":"CVS","b":"tadalafil","s":"00cbc656-768d-4995-bb6d-a0d4b32a248c","d":"20241016","p":["Hepatic Impairment Tadalafil tablets for Use as Needed Mild or moderate (Child Pugh Class A or B): The dose should not exceed 10 mg once per day.","Severe (Child Pugh Class C): The use of tadalafil tablets is not recommended [see Warnings and Precautions ( 5.8 ) and Use in Specific Populations ( 8.6 )] .","Tadalafil tablets for Once Daily Use Mild or moderate (Child Pugh Class A or B): Tadalafil tablets for once daily use has not been extensively evaluated in patients with hepatic impairment."]},{"n":"tafenoquine","a":"","c":"Antimalarial","b":"Arakoda","s":"299e49d8-470f-4779-a010-4a1ee0e0c6cd","d":"20250110","p":["Table 1: Recommended Dosage of ARAKODA in Patients (18 Years of Age and Older)","8.4 Pediatric Use Safety and effectiveness of ARAKODA in pediatric patients have not been established."]},{"n":"tamsulosin","a":"","c":"Urology","b":"tamsulosin hydrochloride","s":"00097e78-9c04-4e62-8260-ddb50e9a6a93","d":"20260101","p":["8.4 Pediatric Use Tamsulosin hydrochloride capsules are not indicated for use in pediatric populations.","Efficacy and positive benefit/risk of tamsulosin hydrochloride was not demonstrated in two studies conducted in patients 2 years to 16 years of age with elevated detrusor leak point pressure (>40 cm H 2 O) associated with known neurological disorder (e.g., spina bifida).","Patients in both studies were treated on a weight-based mg/kg schema (0.025 mg, 0.05 mg, 0.1 mg, 0.2 mg, or 0.4 mg tamsulosin hydrochloride) for the reduction in detrusor leak point pressure below 40 cm H 2 O."]},{"n":"telmisartan","a":"","c":"CVS","b":"telmisartan","s":"09d31eee-cd22-4918-a889-3eb4d2969525","d":"20260605","p":["8.4 Pediatric Use Safety and effectiveness in pediatric patients have not been established [see Clinical Pharmacology (12.3) ].","Neonates with a history of in utero exposure to telmisartan If oliguria or hypotension occurs, support blood pressure and renal perfusion."]},{"n":"tenofovir alafenamide","a":"","c":"Antiretroviral","b":"VEMLIDY","s":"72e6b33c-0351-4070-9172-eeaa186c01d2","d":"20250714","p":["Hepatic Impairment: VEMLIDY is not recommended in patients with decompensated (Child-Pugh B or C) hepatic impairment. ( 2.4 )","2.2 Recommended Dosage in Adults and Pediatric Patients 6 Years of Age and Older and Weighing at Least 25 kg The recommended dosage of VEMLIDY in adults and pediatric patients 6 years of age and older and weighing at least 25 kg is one 25 mg tablet taken orally once daily with food [see Clinical Pha","No data are available to make dose recommendations in pediatric patients with renal impairment."]},{"n":"tenofovir disoproxil","a":"","c":"Antiretroviral","b":"Tenofovir Disoproxil Fumarate","s":"0c7d72d6-bf80-49e0-921c-20169e87e62f","d":"20250211","p":["Recommended tablet dosage in adults and pediatric patients weighing at least 35 kg: One tenofovir disoproxil fumarate 300 mg tablet once daily taken orally without regard to food. ( 2.2 )","Recommended dosage in pediatric patients at least 2 years of age and adults: For patients weighing at least 35 kg who can swallow an intact tablet, one tenofovir disoproxil fumarate tablet (300 mg based on body weight) once daily taken orally without regard to food. ( 2.2 )","2.2 Recommended Tablet Dosage in Adults and Pediatric Patients 2 Years and Older Weighing at Least 35 kg The recommended dosage of tenofovir disoproxil fumarate in adults and pediatric patients weighing at least 35 kg is one 300 mg tablet taken orally once daily without regard to food."]},{"n":"terbinafine","a":"","c":"Antifungal","b":"Good Neighbor Pharmacy","s":"0a9e890c-1eed-4fde-a484-852a4dd135c2","d":"20251017","p":["Directions \u2022 adults and children 12 years and older o use the tip of the cap to break the seal and open the tube o wash the affected skin with soap and water and dry completely before applying o for athlete's foot wear well-fitting, ventilated shoes.","Change shoes and socks at least once daily. \u25aa between the toes only: apply twice a day (morning and night) for 1 week or as directed by a doctor. \u25aa on the bottom or sides of the foot: apply twice a day (morning and night) for 2 weeks or as directed by a doctor. o for jock itch and ringworm: apply on"]},{"n":"terbutaline","a":"","c":"Respiratory","b":"Terbutaline Sulfate","s":"0a95bc4f-34d3-4b5e-841b-6839e1c1e0c7","d":"20220401","p":["Children Terbutaline sulfate is not recommended for use in children below the age of 12 years.","A dosage of 2.5 mg three times daily is recommended for children 12-15 years of age.","Pediatric Use Terbutaline sulfate is not recommended for patients under the age of 12 years because of insufficient clinical data to establish safety and effectiveness (see DOSAGE AND ADMINISTRATION )."]},{"n":"terlipressin","a":"","c":"GI","b":"Terlivaz","s":"3a35b86c-f451-4fac-8499-43019e4da354","d":"20261023","p":["8.4 Pediatric Use Safety and effectiveness of TERLIVAZ have not been established in pediatric patients."]},{"n":"testosterone","a":"","c":"Endocrine","b":"Testosterone","s":"0d84e5a6-11e9-4940-8991-21c611c4c32f","d":"20240930","p":["Strict adherence to the following precautions is advised in order to minimize the potential for secondary exposure to testosterone from testosterone gel 1.62%-treated skin: Children and women should avoid contact with unwashed or unclothed application site(s) of men using testosterone gel 1.62%.","8.4 Pediatric Use The safety and effectiveness of testosterone gel 1.62% in pediatric patients less than 18 years old has not been established."]},{"n":"tetanus immune globulin","a":"","c":"Immunology","b":"HyperTET","s":"393fa198-7e07-4162-bd0a-9d873f1544a9","d":"20261101","p":["DOSAGE AND ADMINISTRATION Routine prophylactic dosage schedule: Adults and children 7 years and older: Hyper TET , 250 units should be given by deep intramuscular injection (see PRECAUTIONS ).","Children less than 7 years old: In small children the routine prophylactic dose of Hyper TET may be calculated by the body weight (4.0 units/kg).","However, it may be advisable to administer the entire contents of the syringe of Hyper TET (250 units) regardless of the child's size, since theoretically the same amount of toxin will be produced in the child's body by the infecting tetanus organism as it will in an adult's body."]},{"n":"tetracycline","a":"","c":"Antibiotic","b":"Tetracycline Hydrochloride","s":"00acf413-c5d2-4a54-9d0d-56266cbc9edc","d":"20260522","p":["For pediatric patients above eight years of age Usual daily dose, 10 mg/lb to 20 mg/lb (25mg/kg to 50 mg/kg) body weight divided in four equal doses.","Pediatric Use See WARNINGS and DOSAGE AND ADMINISTRATION ."]},{"n":"theophylline","a":"","c":"Respiratory","b":"Theophylline (Anhydrous)","s":"04f1d1da-ce61-45b3-acf4-903cc81d16da","d":"20251204","p":["Stabilized patients, 12 years of age or older, who are taking an immediate-release or controlled-release theophylline product may be transferred to once-daily administration of 400 or 600 mg Theophylline (Anhydrous)","Because of marked individual differences in the rate of theophylline clearance, the dose required to achieve a peak serum theophylline concentration in the 10-20 mcg/mL range varies fourfold among otherwise similar patients in the absence of factors known to alter theophylline clearance (e.g., 400\u20111","For example, at a dose of 900 mg/d in adults <60 years or 22 mg/kg/d in children 1-9 years, the steady-state peak serum theophylline concentration will be <10 mcg/mL in about 30% of patients, 10-20 mcg/mL in about 50% and 20-30 mcg/mL in about 20% of patients."]},{"n":"thiamine","a":"","c":"Nutritional","b":"THIAMINE HYDROCHLORIDE injection, solution","s":"06446e9a-0e85-0623-e063-6294a90ac403","d":"20260507","p":["Infantile beriberi that is mild may respond to oral therapy, but if collapse occurs, doses of 25 mg may cautiously be given IV."]},{"n":"thioguanine","a":"","c":"Oncology","b":"TABLOID","s":"44b0c461-47fb-4106-ba11-6ed85530235c","d":"20250108","p":["Because the usual therapies for adult and pediatric acute nonlymphocytic leukemias involve the use of thioguanine with other agents in combination, physicians responsible for administering these therapies should be experienced in the use of cancer chemotherapy and in the chosen protocol.","Ninety-six (59%) of 163 pediatric patients with previously untreated acute nonlymphocytic leukemia obtained complete remission with a multiple-drug protocol including thioguanine, prednisone, cytarabine, cyclophosphamide, and vincristine.","On those occasions when single-agent chemotherapy with thioguanine may be appropriate, the usual initial dosage for pediatric patients and adults is approximately 2 mg/kg of body weight per day."]},{"n":"tigecycline","a":"","c":"Antibiotic","b":"Tigecycline","s":"230484a8-408c-dcc1-d0c4-d9dd9a46831b","d":"20260106","p":["Severe hepatic impairment (Child Pugh C): Initial dose of 100 mg followed by 25 mg every 12 hours. ( 2.2 )","2.2 Dosage in Patients With Hepatic Impairment No dosage adjustment is warranted in patients with mild to moderate hepatic impairment (Child Pugh A and Child Pugh B).","In patients with severe hepatic impairment (Child Pugh C), the initial dose of tigecycline for injection should be 100 mg followed by a reduced maintenance dose of 25 mg every 12 hours."]},{"n":"timolol","a":"","c":"Ophthalmic","b":"Timoptic in Ocudose","s":"16323b0e-78ae-40e5-be93-04f698dd672b","d":"20260806","p":["Pediatric Use Safety and effectiveness of timolol maleate ophthalmic solution USP have been established when administered in pediatric patients aged 2 years and older.","Use of timolol maleate ophthalmic solution USP in these children is supported by evidence from adequate and well- controlled studies in children and adults.","Safety and efficacy in pediatric patients below the age of 2 years have not been established."]},{"n":"tinidazole","a":"","c":"Antibiotic","b":"Tindazole","s":"32167dd7-5d37-457b-9b00-cd735de6b060","d":"20250331","p":["Pediatric patients older than three years of age: a single dose of 50 mg/kg (up to 2 g) with food ( 2.4 )","Pediatric patients older than three years of age: 50 mg/kg/day (up to 2 g per day) for 3 days with food ( 2.5 ).","Pediatric patients older than three years of age: 50 mg/kg/day (up to 2 g per day) for 3-5 days with food ( 2.5 )"]},{"n":"tiotropium","a":"","c":"Respiratory","b":"Tiotropium Bromide","s":"496b38ee-45b6-4bb2-a35e-9023c3b73719","d":"20261031","p":["8.4 Pediatric Use Tiotropium bromide inhalation powder is not indicated for use in children.","The safety and effectiveness of tiotropium bromide inhalation powder in pediatric patients have not been established."]},{"n":"tizanidine","a":"","c":"Neuro","b":"tizanidine hydrochloride","s":"146c853c-99a8-4bf3-b1e3-be6876abe6ff","d":"20251210","p":["8.4 Pediatric Use Safety and effectiveness in pediatric patients have not been established.","Juvenile Animal Toxicity Data Oral administration of tizanidine (0, 1, 3, and 10 mg/kg/day) to juvenile rats from postnatal day (PND)","7 through PND 70 resulted in delayed sexual maturation in males at all doses, reduced body weight gain, delayed sexual maturation in females, and bilateral corneal crystals at the mid and high doses."]},{"n":"tobramycin","a":"","c":"Antibiotic","b":"Tobramycin","s":"02b48684-168c-4cd9-8375-794206eff23e","d":"20230227","p":["The patient\u2019s pretreatment body weight should be obtained for calculation of correct dosage.","Administration for Patients with Normal Renal Function\u2014 Adults with Serious Infections : 3 mg/kg/day in 3 equal doses every 8 hours (see Table 3).","Adults with Life-Threatening Infections : Up to 5 mg/kg/day may be administered in 3 or 4 equal doses (see Table 3)."]},{"n":"tobramycin ophthalmic","a":"","c":"Ophthalmic","b":"Tobramycin","s":"02b48684-168c-4cd9-8375-794206eff23e","d":"20230227","p":["The patient\u2019s pretreatment body weight should be obtained for calculation of correct dosage.","Administration for Patients with Normal Renal Function\u2014 Adults with Serious Infections : 3 mg/kg/day in 3 equal doses every 8 hours (see Table 3).","Adults with Life-Threatening Infections : Up to 5 mg/kg/day may be administered in 3 or 4 equal doses (see Table 3)."]},{"n":"tocilizumab","a":"","c":"Immunology/rheum","b":"Tofidence","s":"00529b23-850a-42b9-a152-125a95b5242c","d":"20251219","p":["Recommended Adult Intravenous Dosage: When used in combination with non-biologic DMARDs or as monotherapy the recommended starting dose is 4 mg per kg every 4 weeks followed by an increase to 8 mg per kg every 4 weeks based on clinical response.","Recommended Adult Intravenous Dosage: The recommended dose is 6 mg per kg every 4 weeks in combination with a tapering course of glucocorticoids.","Recommended Intravenous PJIA Dosage Every 4 Weeks Patients less than 30 kg weight 10 mg per kg Patients at or above 30 kg weight 8 mg per kg Systemic Juvenile Idiopathic Arthritis ( 2.5 )"]},{"n":"tofacitinib","a":"","c":"Rheum","b":"Tofacitinib","s":"10403307-e2f9-44d1-bc72-552fdba299d1","d":"20261102","p":["Pediatric Patients 2 Years of Age and Older with PsA or pcJIA Who Weigh At Least 10 kg \u2022 Tofacitinib tablets 5 mg twice daily for those \u226540 kg or weight-based equivalent twice daily for those <40 kg. ( 2.4 )","5 mg twice daily Moderate HI (Child-Pugh B)","5 mg once daily Severe HI (Child-Pugh C)"]},{"n":"tolterodine","a":"","c":"Urology","b":"Tolterodine Tartrate","s":"05b92da2-923b-3c04-e063-6394a90a69a1","d":"20260106","p":["2 mg capsules taken orally once daily with water and swallowed whole in the presence of: mild to moderate hepatic impairment (Child-Pugh class A or B ( 2.2 ) severe renal impairment [Creatinine Clearance (CCr)","Tolterodine tartrate extended-release capsules are not recommended for use in patients with severe hepatic impairment (Child-Pugh Class C). ( 2.2 )","2.2 Dosage Adjustment in Specific Populations For patients with mild to moderate hepatic impairment (Child-Pugh Class A or B) or severe renal impairment (CCr 10 - 30 mL/min), the recommended dose of tolterodine tartrate extended-release capsules is 2 mg once daily."]},{"n":"tolvaptan","a":"","c":"Electrolyte","b":"Jynarque","s":"3febc0a1-9e5a-4ce0-843d-210f21d862c4","d":"20260930","p":["8.4 Pediatric Use Safety and effectiveness of JYNARQUE in pediatric patients have not been established."]},{"n":"topiramate","a":"","c":"Neuro/anticonvulsant","b":"Topiramate","s":"021005ab-6a00-40d8-9aee-20c91613b4d5","d":"20260608","p":["2.1 Dosing in Monotherapy Epilepsy Adults and Pediatric Patients 10 Years of Age and Older The recommended dose for topiramate monotherapy in adults and pediatric patients 10 years of age and older is 400 mg/day in two divided doses.","The dose should be achieved by titration according to the following schedule (Table 1): Table 1: Monotherapy Titration Schedule for Adults and Pediatric Patients 10 years and older Morning Dose Evening Dose Week 1 25 mg 25 mg Week 2 50 mg 50 mg Week 3 75 mg 75 mg Week 4 100 mg 100 mg Week 5 150 mg 1","The total daily dose should not exceed the maximum maintenance dose for each range of body weight (Table 2)."]},{"n":"trace elements","a":"","c":"Nutritional","b":"Multrys","s":"995f1efa-aca0-4b6c-9099-f8e757c2133a","d":"20240701","p":["Multrys is recommended only for pediatric patients who require supplementation with all four of the individual trace elements (i.e., zinc, copper, manganese, and selenium) to meet daily requirements. ( 2.5 )","Pediatric Patients 0.4 kg to 0.59 kg : The total recommended dosage of Multrys is 0.2 mL every other day .Daily supplementation of Zinc Sulfate, Cupric Chloride and Selenious Acid will be needed to meet daily requirements. ( 2.5 )","Pediatric Patients 0.6 kg to 10 kg : The recommended dosage of Multrys is 0.3 mL/kg/day rounded to the nearest 0.1 mL for up to a maximum of 1 mL per day."]},{"n":"tramadol","a":"","c":"Analgesic/opioid","b":"TRAMADOL HYDROCHLORIDE","s":"004de5a4-80f8-4040-a6ea-be5e99352a36","d":"20251120","p":["Discuss the importance of having access to an opioid overdose reversal agent, especially if the patient has risk factors for overdose (e.g., concomitant use of CNS depressants, a history of opioid use disorder, or prior opioid overdose) or if there are household members (including children) or other","8.4 Pediatric Use The safety and effectiveness of tramadol hydrochloride extended-release tablets in pediatric patients have not been established.","Life-threatening respiratory depression and death have occurred in children who received tramadol [see Warnings and Precautions ( 5.6 )] ."]},{"n":"tranexamic acid","a":"","c":"Hematology","b":"tranexamic acid","s":"00630e54-0e84-465d-96a5-63486c87dcd9","d":"20240315","p":["2 DOSAGE AND ADMINISTRATION Before Extraction: Administer 10 mg/kg actual body weight of tranexamic acid injection intravenously with replacement therapy. ( 2.1 )","After Extraction: Administer 10 mg/kg actual body weight 3 to 4 times daily for 2 to 8 days.","2.1 Recommended Dosage The recommended dose of tranexamic acid injection is 10 mg/kg actual body weight intravenously administered as a single-dose, immediately before tooth extractions."]},{"n":"treprostinil","a":"","c":"CVS","b":"Sterile Diluent for Treprostinil","s":"33050ee2-519b-1f0b-d4df-9e14dd329c57","d":"20211223","p":["2 DOSAGE AND ADMINISTRATION PAH WHO Group 1 in patients with NYHA Class II-IV symptoms : Initial dose for patients new to prostacyclin infusion therapy: 1.25 ng/kg/min; increase based on clinical response (increments of 1.25 ng/kg/min per week for the first 4 weeks of treatment, later 2.5 ng/kg/min ","Mild to moderate hepatic insufficiency: Decrease initial dose to 0.625 ng/kg/min.","The infusion rate is initiated at 1.25 ng/kg/min."]},{"n":"tretinoin","a":"","c":"Topical","b":"Tretinoin","s":"045258e2-5efb-4147-bf74-4c43af04dccc","d":"20260526","p":["8.4 Pediatric Use Safety and effectiveness of tretinoin capsules have been established in pediatric patients 1 year of age and older and the information on this use is discussed throughout the labeling.","The maximum tolerated dose is lower in pediatric patients compared to adults.","Some pediatric patients experience severe headache and intracranial hypertension, which required management with an analgesic and a lumbar puncture."]},{"n":"trihexyphenidyl","a":"","c":"Neuro","b":"Trihexyphenidyl Hydrochloride","s":"294cd88d-d9e8-4938-b4be-c3adc4a35de0","d":"20220621","p":["The initial dose should be low and then increased gradually, especially in patients over 60 years of age.Whether trihexyphenidyl may best be given before or after meals should be determined by the way the patient reacts.","Pediatric Use Safety and effectiveness in pediatric patients have not been established. (See also ADVERSE REACTIONS )."]},{"n":"trimethoprim","a":"","c":"Antibiotic","b":"Trimethoprim","s":"249e938d-f181-47c4-a082-372d65462f33","d":"20240604","p":["Pediatric Use Safety and effectiveness in pediatric patients below the age of 2 months have not been established.","The effectiveness of trimethoprim as a single agent has not been established in pediatric patients under 12 years of age."]},{"n":"triptorelin","a":"","c":"Endocrine","b":"Trelstar","s":"b1b84d62-a369-a4b7-5c41-dd1f553a18f3","d":"20260630","p":["8.4 Pediatric Use The safety and effectiveness of TRELSTAR in pediatric patients have not been established."]},{"n":"tropicamide","a":"","c":"Ophthalmic","b":"Mydriacyl","s":"0d4f4a2e-eb00-4c65-b3fa-baf5738d468d","d":"20230215","p":["Pediatric Use Tropicamide may rarely cause CNS disturbances which may be dangerous in pediatric patients.","Psychotic reactions, behavioral disturbances, and vasomotor or cardiorespiratory collapse in children have been reported with the use of anticholinergic drugs (See WARNINGS ).","Keep this and all medications out of the reach of children."]},{"n":"ursodiol","a":"ursodeoxycholic acid","c":"GI","b":"Ursodiol","s":"00c47258-aef0-53f6-e063-6294a90af96f","d":"20260119","p":["DOSAGE AND ADMINISTRATION Gallstone Dissolution The recommended dose for ursodiol treatment of radiolucent gallbladder stones is 8 - 10 mg/kg/day given in 2 or 3 divided doses.","Pediatric Use The safety and effectiveness of ursodiol in pediatric patients have not been established."]},{"n":"valacyclovir","a":"","c":"Antiviral","b":"Valacyclovir Hydrochloride","s":"021ab9d0-7b75-40cf-afde-446942d64388","d":"20260528","p":["Valacyclovir oral suspension (25 m   const add=(lab,val,sub,short)=>{h+=`<div class="frm"><span>${lab}</span><span><b>${val}</b><div class="mu sm">${sub}</div></span></div>`;if(!first)first=short};
  if(R.all||R.oral){
    (d.syr||[]).forEach(s=>{const ml=mlR(pd/(s/5));add(`Syrup ${s} ${u}/5 mL`,`${fmt(ml)} mL${ph}`,`≈ ${fmt(ml*s/5)} ${u}`,`syr ${s}/5 mL ${fmt(ml)} mL`)});
    (d.tab||[]).forEach(s=>{const n=pd/s,tl=d.tabL||'Tablet';if(n<0.2||n>8)return;const r=tabRound(n),del=r*s,dev=Math.abs(del-pd)/pd;
      add(`${tl} ${s} ${u}`,`${tabTxt(r)} tab`,`≈ ${fmt(del)} ${u}${dev>0.15?' <span class="tag am">'+Math.round(dev*100)+'% off</span>':''}`,`${tl.toLowerCase()} ${s} × ${tabTxt(r)}`)})}
  (d.inj||[]).forEach(s=>{const k=s.k||(/drops|oral/i.test(s.l)?'po':/neb/i.test(s.l)?'neb':'iv');
    const show=R.all||(k=='po'&&R.oral)||(k=='neb'&&R.neb)||(k=='iv'&&(R.par||R.buc));if(!show)return;if(injf&&!s.l.startsWith(injf))return;
    const ml=mlR(pd/s.v);add(esc(s.l),`${fmt(ml)} mL${ph}`,`≈ ${fmt(ml*s.v)} ${u}${ml<0.1?' <span class="tag wn">tiny — dilute</span>':''}`,`${s.l} ${fmt(ml)} mL${ph}`)});
  return{h,first}}
function srcInfo(reg){const named=(reg.ref||'R').split(',').filter(k=>k!='R'&&REFS[k]);const okr=reg.okr!=null?reg.okr.split(',').filter(Boolean):(reg.ok?named:[]);return{named,okr,diff:named.filter(k=>!okr.includes(k))}}
function refBadge(reg){const s=srcInfo(reg);let h='';if(s.okr.length)h+=`<span class="tag ok">✓ ${s.okr.join(' · ')}</span> `;if(s.diff.length)h+=`<span class="tag am">≠ ${s.diff.join(' · ')}</span> `;if(!s.named.length)h+=`<span class="tag">recall only</span>`;return h}
function regCard(d,reg,w,am,isAlt){
  const o=calc(d,reg,w,am);let h='';
  if(o.err)return{h:`<div class="warn">${o.err}</div>`,o};
  const a=appl(reg,am,w);if(a.ok===false)h+=`<div class="warn">Not for this patient (${esc(a.why)}). Choose another indication row.</div>`;else if(a.ok===null&&a.why)h+=`<div class="note">This row ${esc(a.why)}.</div>`;
  o.warn.forEach(x=>h+=`<div class="warn">${esc(x)}</div>`);
  const tags=[];
  if(o.total!=null){h+=`<div class="big">${fmt(o.total)} <small>${o.unit} total</small></div>`;tags.push(`${reg.lo==reg.hi?reg.lo:fmt(o.x)} ${o.unit}/kg`);if(reg.dur)tags.push('⏱ '+reg.dur);if(reg.rt)tags.push(reg.rt);
    h+=`<div class="kv">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;o.rx=`${d.n} ${fmt(o.total)} ${o.unit} ${reg.rt||''} ${reg.dur||''}`;return{h,o,F:{h:'',first:null}}}
  if(o.hr){h+=`<div class="big">${fmt(o.perDose)} <small>${o.unit}/hour</small></div>`;tags.push(`${fmt(o.x)} ${o.unit}/kg/h`)}
  else{h+=`<div class="big">${fmt(o.perDose)} <small>${o.unit} per dose</small></div>`;
    tags.push(o.f==1&&!isDaily(reg)?'1 dose · see timing':fq(o.f));if(o.f>1)tags.push(`${fmt(o.perDay)} ${o.unit}/day`);
    if(!reg.bands){if(reg.per=='m2')tags.push(`${fmt(o.x)} ${o.unit}/m² × BSA ${fmt(o.bsa.v)}`);else tags.push(`${reg.lo==reg.hi?reg.lo:fmt(o.x)} ${o.unit}/kg/${reg.per}`)}}
  if(reg.rt)tags.push(reg.rt);if(reg.dur)tags.push('⏱ '+reg.dur);
  h+=`<div class="kv">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`;
  if(o.label)h+=`<div style="margin-top:8px;font-weight:600">${esc(o.label)}</div>`;
  if(o.bsa&&o.bsa.est)h+=`<div class="note">BSA ${fmt(o.bsa.v)} m² ${esc(o.bsa.src)}.</div>`;
  if(o.noCap&&!reg.bands&&!isAlt)h+=`<div class="mu sm" style="margin-top:6px">Max dose: <b>NOT SET</b> in this app</div>`;

  return{h,o,F}}

function lev(a,b){const m=[];for(let i=0;i<=a.length;i++)m[i]=[i];for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
function match(hay,qq){hay=hay.toLowerCase();if(hay.startsWith(qq))return 4;if(hay.split(/[^a-z0-9]+/).some(t=>t.startsWith(qq)))return 3;if(hay.includes(qq))return 2;if(qq.length>=4)return hay.split(/[^a-z0-9]+/).some(t=>t.length>=4&&lev(t.slice(0,qq.length+1),qq)<=1)?1:0;return 0}
