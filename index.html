ended in pediatric patients less than 31 kg because the lowest available strength (200 mg) exceeds the recommended dose for these patients and it cannot be divided.","The recommended prophylaxis dosage is: Adult patients: 400 mg once a week Pediatric patients \u2265 31kg: 6.5 mg/kg actual body weight (up to 400 mg) once a week Treatment of Uncomplicated Malaria The dosages for the treatment of uncomplicated malaria are: Adult patients: Administer 800 mg initially; sub"]},{"n":"hydroxyurea","a":"hydroxycarbamide","c":"Hematology","b":"HYDROXYUREA","s":"44fd5379-5fb0-ff62-e063-6294a90ac792","d":"20251202","p":["Recommended Hydroxyurea Capsules Initial Dose (mg/kg once daily) \u226560 15 <60 or ESRD* 7.5 * On dialysis days, administer hydroxyurea capsules to patients following hemodialysis.","8.4 Pediatric Use Safety and effectiveness in pediatric patients have not been established."]},{"n":"hydroxyzine","a":"","c":"Antihistamine","b":"hydroxyzine pamoate","s":"02616eee-a1a4-4afc-b84e-69fd28755138","d":"20241216","p":["DOSAGE For symptomatic relief of anxiety and tension associated with psychoneurosis and as an adjunct in organic disease states in which anxiety is manifested: in adults, 50 mg to 100 mg q.i.d.; children under 6 years, 50 mg daily in divided doses; and over 6 years, 50 mg to 100 mg daily in divided ","For use in the management of pruritus due to allergic conditions such as chronic urticaria and atopic and contact dermatoses, and in histamine-mediated pruritus: in adults, 25 mg t.i.d. or q.i.d.; children under 6 years, 50 mg daily in divided doses; and over 6 years, 50 mg to 100 mg daily in divide","As a sedative when used as a premedication and following general anesthesia: 50 mg to 100 mg in adults, and 0.6 mg/kg in children."]},{"n":"ifosfamide","a":"","c":"Oncology","b":"IFOSFAMIDE","s":"91e433a9-6800-43a6-ac13-a49a04a5aecd","d":"20261007","p":["8.4 Pediatric Use Safety and effectiveness have not been established in pediatric patients.","Renal rickets and growth retardation in pediatric patients treated with ifosfamide have been reported.","Ifosfamide for Injection may cause temporary or permanent infertility in prepubertal girls or in females of child-bearing potential and may have an increased risk of developing premature menopause."]},{"n":"imatinib","a":"","c":"Oncology","b":"Imatinib Mesylate","s":"0291eca5-7a1d-4a79-30be-252224d96509","d":"20260908","p":["2 DOSAGE AND ADMINISTRATION Adults with Ph+ CML CP ( 2.2 ): 400 mg/day Adults with Ph+ CML AP or BC ( 2.2 ): 600 mg/day Pediatrics with Ph+ CML CP ( 2.3 ): 340 mg/m 2 /day Adults with Ph+ ALL ( 2.4 ): 600 mg/day Pediatrics with Ph+ ALL ( 2.5 )","2.3 Pediatric Patients With Ph+ CML CP The recommended dose of imatinib mesylate tablets for children with newly diagnosed Ph+ CML is 340 mg/m 2 /day (not to exceed 600 mg).","There is no experience with imatinib mesylate treatment in children under 1 year of age."]},{"n":"imipenem and cilastatin","a":"","c":"Antibiotic","b":"Imipenem and Cilastatin","s":"0a1dd9b9-ada1-4bff-9dcb-18961254e9e8","d":"20221010","p":["See full prescribing information for dosage recommendations in pediatric patients ( 2.2 ).","If the infection is suspected or proven to be due to a susceptible bacterial species 500 mg every 6 hours OR 1,000 mg every 8 hours If the infection is suspected or proven to be due to bacterial species with intermediate susceptibility [see Microbiology ( 12.4 )] 1,000 mg every 6 hours 2.2 Dosage in","Imipenem and Cilastatin for Injection (I.V.) is not recommended in pediatric patients < 30 kg with renal impairment, as no data are available [see Use in Specific Populations ( 8.4 )] ."]},{"n":"imipramine","a":"","c":"Psych","b":"Imipramine Hydrochloride","s":"02c19a0a-3d9d-4881-ad14-1687aafd87b5","d":"20260706","p":["Childhood Enuresis Initially, an oral dose of 25 mg/day should be tried in children aged 6 and older.","If a satisfactory response does not occur within one week, increase the dose to 50 mg nightly in children under 12 years; children over 12 may receive up to 75 mg nightly.","Children who relapse when the drug is discontinued do not always respond to a subsequent course of treatment."]},{"n":"immune globulin intravenous","a":"","c":"Hematology/immunology","b":"BIVIGAM","s":"a2244aa0-a6d0-11df-b385-0002a5d5c51b","d":"20260929","p":["PI 300-800 mg/kg every 3-4 weeks 0.5 mg/kg/min for first 10 minutes Increase every 20 minutes (if tolerated) by 0.8 mg/kg/min up to 6 mg/kg/min.","The recommended dose of BIVIGAM for replacement therapy in primary humoral immunodeficiency in adults and children 2 years of age and older, is 300 to 800 mg/kg body weight administered every 3 to 4 weeks.","A dose of 400 mg/kg should provide a serum level> 240 mIU/mL of measles antibodies for at least two weeks."]},{"n":"indomethacin","a":"","c":"Neonatal/CVS","b":"Indomethacin","s":"30e38747-c553-4e2d-bc23-634e1dd90b8d","d":"20230616","p":["Dosage recommendations for closure of the ductus arteriosus depend on the age of the infant at the time of therapy.","If anuria or marked oliguria (urinary output <0.6 mL/kg/hr) is evident at the scheduled time of the second or third dose of Indomethacin for Injection, do not give additional doses until laboratory studies indicate that renal function has returned to normal [see Warnings and Precautions ( 5.7 )] .","Dosage according to age is as follows: AGE at 1st dose DOSAGE (mg/kg)"]},{"n":"infliximab","a":"","c":"Immunology/rheum","b":"INFLECTRA","s":"37eaca10-d812-48bc-8b8e-b836bfa9968f","d":"20261029","p":["Crohn's Disease ( 2.1 ) \u2022 5 mg/kg at 0, 2 and 6 weeks, then every 8 weeks.","Some adult patients who initially respond to treatment may benefit from increasing the dose to 10 mg/kg every 8 weeks if they later lose their response.","Pediatric Crohn's Disease (\u2265 6 years old) ( 2.2 ) \u2022 5 mg/kg at 0, 2 and 6 weeks, then every 8 weeks."]},{"n":"insulin aspart","a":"","c":"Endocrine","b":"NOVOLOG","s":"13891e5a-e57a-46e8-911c-2f680352b52b","d":"20231215","p":["8.4 Pediatric Use The safety and effectiveness of NOVOLOG to improve glycemic control have been established in pediatric patients with diabetes mellitus.","Use of NOVOLOG for this indication is supported by evidence from an adequate and well-controlled study in 283 pediatric patients with type 1 diabetes mellitus aged 6 to 18 years and from studies in adults with diabetes mellitus [see Adverse Reactions ( 6.1 ), Clinical Pharmacology ( 12.3 ), and Clin"]},{"n":"insulin degludec","a":"","c":"Endocrine","b":"Tresiba","s":"456c5e87-3dfd-46fa-8ac0-c6128d4c97c6","d":"20220701","p":["2 DOSAGE AND ADMINISTRATION \u2022 See Full Prescribing Information for important administration instructions ( 2.1 ). \u2022 Inject TRESIBA subcutaneously into the thigh, upper arm, or abdomen ( 2.1 ). \u2022 Rotate injection sites to reduce risk of lipodystrophy and localized cutaneous amyloidosis ( 2.1 ). \u2022 For","Do not inject into areas of lipodystrophy or localized cutaneous amyloidosis [see Warnings and Precautions ( 5.2 ), Adverse Reactions ( 6.1 , 6.3 )]. \u2022 During changes to a patient\u2019s insulin regimen, increase the frequency of blood glucose monitoring [see Warnings and Precautions ( 5.2 )]. \u2022 For pedi","The dose window shows the number of insulin units to be delivered and no conversion is needed. \u2022 In adults, inject TRESIBA subcutaneously once-daily at any time of day. \u2022 In pediatric patients inject TRESIBA subcutaneously once-daily at the same time every day. \u2022 Individualize and titrate the dose o"]},{"n":"insulin detemir","a":"","c":"Endocrine","b":"Levemir","s":"82192527-99aa-4b53-8ce9-9173668d309c","d":"20241009","p":["As a general rule, 0.2 to 0.4 units of insulin per kilogram of body weight can be used to calculate the initial total daily insulin dose in insulin na\u00efve patients with type 1 diabetes.","Recommended Starting Dosage in Patients with Type 2 Diabetes The recommended starting dose of LEVEMIR in patients with type 2 diabetes mellitus inadequately controlled on oral antidiabetic medications or a GLP-1 receptor agonist is 10 units (or 0.1 units/kg to 0.2 units/kg) given once daily in the e","8.4 Pediatric Use The safety and effectiveness of LEVEMIR to improve glycemic control in pediatric patients with diabetes mellitus have been established."]},{"n":"insulin glargine","a":"","c":"Endocrine","b":"TOUJEO","s":"257ca17b-6ff7-4f2e-9037-4c185bac5768","d":"20230427","p":["2.3 Starting Dose in Insulin-Naive Pediatric and Adult Patients Recommended Starting Dosage in Patients with Type 1 Diabetes The recommended starting dose of TOUJEO in insulin-naive patients with type 1 diabetes is approximately one-third to one-half of the total daily insulin dose.","As a general rule, 0.2 to 0.4 units of insulin per kilogram of body weight can be used to calculate the initial total daily insulin dose in insulin-naive patients with type 1 diabetes.","Recommended Starting Dosage in Patients with Type 2 Diabetes The recommended starting dose of TOUJEO in insulin-naive patients with type 2 diabetes is 0.2 units per kilogram of body weight once daily."]},{"n":"insulin lispro","a":"","c":"Endocrine","b":"ADMELOG","s":"0691def8-4a7b-4de3-866f-a280989f47f1","d":"20250604","p":["8.4 Pediatric Use The safety and effectiveness of ADMELOG to improve glycemic control have been established in pediatric patients with diabetes mellitus.","Use of ADMELOG for this indication is supported by evidence from an adequate and well-controlled study with another insulin lispro product, 100 units/ml, in 60 pediatric patients 3 years of age and older with type 1 diabetes mellitus and studies in adult patients with diabetes mellitus [see Clinical"]},{"n":"ipratropium","a":"","c":"Respiratory","b":"Ipratropium bromide","s":"1e92b86d-66e1-45e4-9e23-f9310c95bf82","d":"20190501","p":["DOSAGE AND ADMINISTRATION: The recommended dose of Ipratropium Bromide Nasal Solution 0.03% (Nasal Spray) is two sprays (42 mcg) per nostril two or three times daily (total dose 168 to 252 mcg/day) for the symptomatic relief of rhinorrhea associated with allergic and nonallergic perennial rhinitis i","Pediatric Use: The safety of Ipratropium Bromide Nasal Solution 0.03% (Nasal Spray) at a dose of two sprays (42 mcg) per nostril two or three times daily (total dose 168 to 252 mcg/day) has been demonstrated in 77 pediatric patients 6 to 12 years of age in placebo-controlled, 4-week trials and in 55","The effectiveness of Ipratropium Bromide Nasal Solution 0.03% (Nasal Spray) for the treatment of rhinorrhea associated with allergic and nonallergic perennial rhinitis in this pediatric age group is based on an extrapolation of the demonstrated efficacy of Ipratropium Bromide Nasal Solution 0.03% (N"]},{"n":"isavuconazonium","a":"","c":"Antifungal","b":"CRESEMBA","s":"8f7f73b8-586a-4df0-935f-fecd4696c16c","d":"20250425","p":["2 DOSAGE AND ADMINISTRATION Important Administration Instructions: \u2022 CRESEMBA for injection is intended for use in patients who are 1 year of age and older ( 2.1 , 2.3 ). \u2022 CRESEMBA for injection via nasogastric (NG) tube administration is intended for use by patients who are 6 years of age and olde","Five 74.5 mg capsules (372 mg) orally once daily Recommended Dosage in Pediatric Patients ( 2.3 ): \u2022 The maximum of any individual loading or daily maintenance dose to be administered to any pediatric patient is 372 mg of CRESEMBA. ( 2.3 )","Recommended Dosage for CRESEMBA in Pediatric Patients ( 2.3 )"]},{"n":"isoniazid","a":"","c":"TB","b":"Isoniazid","s":"03bf3bd5-64f9-4491-89fd-96c5c10d0129","d":"20260216","p":["Treatment of Tuberculosis and Tuberculosis Infection in Adults and Children, American Journal of Respiratory and Critical Care Medicine: vol 149; 1359-1374, 1994.","Usual Oral Dosage (depending on the regimen used): Adults 5 mg/kg up to 300 mg daily in a single dose; or 15 mg/kg up to 900 mg/day, two or three times/week Children 10 mg/kg to 15 mg/kg up to 300 mg daily in a single dose; or 20 mg/kg to 40 mg/kg up to 900 mg/day, two or three times/week Patients w","It is suggested that ethambutol not be used in children whose visual acuity cannot be monitored."]},{"n":"isoproterenol","a":"","c":"Critical/emergency","b":"Isoproterenol Hydrochloride","s":"046f2941-3bc0-4755-861c-71bedb49e706","d":"20240627","p":["The initial dose may be repeated when necessary There are no well-controlled studies in children to establish appropriate dosing; however, the American Heart Association recommends an initial infusion rate of 0.1 mcg/kg/min, with the usual range being 0.1 mcg/kg/min to 1 mcg/kg/min.","8.4 Pediatric Use Safety and efficacy of isoproterenol in pediatric patients have not been established.","Intravenous infusions of isoproterenol in refractory asthmatic children at rates of 0.05-2.7 \u03bcg/kg/min have caused clinical deterioration, myocardial necrosis, congestive heart failure and death."]},{"n":"isotretinoin","a":"","c":"Topical","b":"Isotretinoin","s":"0114567b-3bac-490d-b9eb-03a6c5d90935","d":"20240626","p":["The recommended dosage range for isotretinoin capsules are 0.5 to 1 mg/kg/day given in two divided doses with food for 15 to 20 weeks.","In studies comparing 0.1, 0.5, and 1 mg/kg/day 8 , it was found that all dosages provided initial clearing of disease, but there was a greater need for retreatment with the lower dosages.","Adult patients whose disease is very severe with scarring or is primarily manifested on the trunk may require dose adjustments up to 2 mg/kg/day, as tolerated."]},{"n":"itraconazole","a":"","c":"Antifungal","b":"ITRACONAZOLE","s":"23126370-8d6a-4027-bd8f-860e2776ba3a","d":"20260917","p":["Pediatric Use: The efficacy and safety of itraconazole have not been established in pediatric patients.","The long-term effects of itraconazole on bone growth in children are unknown.","In three toxicology studies using rats, itraconazole induced bone defects at dosage levels as low as 20 mg/kg/day (0.5 times the MRHD of 400 mg based on body surface area comparisons)."]},{"n":"ivermectin","a":"","c":"Antiparasitic","b":"Ivermectin","s":"0d405318-3db5-41b6-a248-a6c1cfe7a765","d":"20261008","p":["Directions Important: Read warnings on carton before use. children 6 months of age to under 12 years of age: an adult should supervise use. adults and children 6 months of age and over: Inspect all household members should be checked by another person for lice and/or nits (eggs) use a magnifying gla"]},{"n":"ketamine","a":"","c":"Anesthesia","b":"Ketalar","s":"14e8f864-8b8a-4e7e-8439-e510d3107063","d":"20260327","p":["Induction of anesthesia: -- Intravenous route : Initially, 1 to 4.5 mg/kg administered slowly (over a period of 60 seconds).","Alternatively, administer a dose of 1 to 2 mg/kg at a rate of 0.5 mg/kg/min. ( 2.2 ) -- Intramuscular route : Initially, 6.5 to 13 mg/kg. ( 2.2 )","Induction of Anesthesia Intravenous Route: The initial dose of KETALAR administered intravenously may range from 1 mg/kg to 4.5 mg/kg."]},{"n":"ketoconazole","a":"","c":"Antifungal","b":"Ketoconazole","s":"369f31da-d3c3-49b8-956f-f70598760164","d":"20250621","p":["Children In small numbers of children over 2 years of age, a single daily dose of 3.3 to 6.6 mg/kg has been used.","Ketoconazole tablets have not been studied in children under 2 years of age.","Pediatric Use Ketoconazole tablets have not been systematically studied in children of any age, and essentially no information is available on children under two years."]},{"n":"labetalol","a":"","c":"CVS","b":"Labetalol Hydrochloride","s":"1b96ddc9-d0c3-488a-a113-66491fd3d899","d":"20260603","p":["Repeated Intravenous Injection Initially, labetalol hydrochloride injection should be given in a dose of 20 mg labetalol HCl (which corresponds to 0.25 mg/kg for an 80 kg patient) by slow intravenous injection over a 2-minute period."]},{"n":"lacosamide","a":"","c":"Neuro/anticonvulsant","b":"LACOSAMIDE","s":"00203a7b-e774-45f7-ac6b-48db6d32a48a","d":"20241016","p":["Pediatric Patients 4 years to less than 17 years : The recommended dosage is based on body weight and is administered orally twice daily (2.1)","Injection: for intravenous use only when oral administration is temporarily not feasible; the recommended dosage is based on body weight and is administered two or three times daily over 15 to 60 minutes; obtaining ECG before initiation is recommended in certain patients (2.7, 5.3)","2.1 Dosage Information The recommended dosage for monotherapy and adjunctive therapy for partial-onset seizures in patients 4 years of age and older and for adjunctive therapy for primary generalized tonic-clonic seizures in patients 4 years of age and older is included in Table 1."]},{"n":"lactulose","a":"","c":"GI","b":"Enulose","s":"00c42c5c-d19e-4130-aa08-a8bbd47d3e5b","d":"20220601","p":["Pediatric Very little information on the use of lactulose in young children and adolescents has been recorded.","On the basis of information available, the recommended initial daily oral dose in infants is 2.5 to 10 ml in divided doses.","For older children and adolescents, the total daily dose is 40 to 90 ml."]},{"n":"lamivudine","a":"","c":"Antiretroviral","b":"Lamivudine","s":"1be30bcc-2d9f-4afc-8f09-adc840b3f2d9","d":"20221201","p":["2 DOSAGE & ADMINISTRATION \u2022 Adults: 300 mg daily, administered as either 150 mg twice daily or 300 mg once daily. ( 2.1 ) \u2022 Pediatric Patients Aged 3 Months and Older: Administered either once or twice daily.","Dose should be calculated on body weight (kg) and should not exceed 300 mg daily. ( 2.2 ) \u2022 Patients with Renal Impairment: Doses of lamivudine must be adjusted in accordance with renal function. ( 2.3 )","2.2 Recommended Dosage for Pediatric Patients Lamivudine scored tablet is the preferred formulation for HIV-1-infected pediatric patients who weigh at least 14 kg and for whom a solid dosage form is appropriate."]},{"n":"lamotrigine","a":"","c":"Neuro/anticonvulsant","b":"Lamotrigine","s":"003663e5-c0c7-4fc1-a64d-313f2a5b10d2","d":"20260422","p":["8.4 Pediatric Use Epilepsy Lamotrigine is indicated as adjunctive therapy in patients aged 2 years and older for partial-onset seizures, the generalized seizures of Lennox-Gastaut syndrome, and PGTC seizures.","Safety and efficacy of lamotrigine used as adjunctive treatment for partial-onset seizures were not demonstrated in a small, randomized, double-blind, placebo-controlled withdrawal trial in very young pediatric patients (aged 1 to 24 months).","Bipolar Disorder Safety and efficacy of lamotrigine for the maintenance treatment of bipolar disorder were not established in a double-blind, randomized withdrawal, placebo-controlled trial that evaluated 301 pediatric patients aged 10 to 17 years with a current manic/hypomanic, depressed, or mixed "]},{"n":"lansoprazole","a":"","c":"GI","b":"Lansoprazole","s":"00a574e0-bd03-deea-9f85-b108f78982ba","d":"20220415","p":["Some patients with Zollinger-Ellison syndrome have been treated continuously with lansoprazole for more than four years. # Controlled studies did not extend beyond 12 months 2.2 Recommended Pediatric Dosage by Indication Pediatric Patients 1 to 11 Years of Age In clinical studies, Lansoprazole delay","Do not exceed the recommended dose and duration of use in pediatric patients as outlined below [see Use in Specific Populations ( 8.4 )].","Indication Recommended Dose Frequency Short-Term Treatment of Symptomatic GERD and Short-Term Treatment of Erosive Esophagitis \u2264 30 kg 15 mg Once daily for up to 12 weeks > 30 kg 30 mg Once daily for up to 12 weeks Pediatric Patients 12 to 17 Years of Age Indication Recommended Dose Frequency Short-"]},{"n":"ledipasvir and sofosbuvir","a":"","c":"Antiviral/HCV","b":"Ledipasvir and Sofosbuvir","s":"46f4a73b-0cd6-4902-9092-3ac79e882c1a","d":"20250110","p":["Recommended treatment regimen and duration in patients 3 years of age and older: ( 2.2 )","HCV Genotype Patient Population Regimen and Duration Genotype 1 Treatment-na\u00efve without cirrhosis or with compensated cirrhosis (Child-Pugh A)","Ledipasvir and sofosbuvir 12 weeks Treatment-experienced without cirrhosis Ledipasvir and sofosbuvir 12 weeks Treatment-experienced with compensated cirrhosis (Child-Pugh A)"]},{"n":"leflunomide","a":"","c":"Rheum","b":"Leflunomide","s":"0a4f8671-b632-4cc5-8dc9-6b863e62b467","d":"20250108","p":["8.4 Pediatric Use The safety and effectiveness of leflunomide in pediatric patients have not been established.","The safety and effectiveness of leflunomide in the treatment of polyarticular course juvenile idiopathic arthritis (JIA) was evaluated in a single multicenter, double-blind, active-controlled trial in 94 pediatric patients (1:1 randomization) with polyarticular course juvenile idiopathic arthritis (","Fourteen pediatric patients experienced ALT and/or AST elevations, nine between 1.2 and 3-fold the upper limit of normal, and five between 3 and 8-fold the upper limit of normal."]},{"n":"leuprolide","a":"","c":"Endocrine","b":"Vabrinty","s":"008776cc-83f1-4f8c-819b-6471425da15f","d":"20260430","p":["8.4 Pediatric Use The safety and effectiveness of VABRINTY in pediatric patients have not been established."]},{"n":"levalbuterol","a":"","c":"Respiratory","b":"Levalbuterol","s":"206bbdec-04f0-40e3-a259-32fc6bce20d8","d":"20191111","p":["Children 6 to 11 Years Old: The recommended dosage of levalbuterol inhalation solution for patients 6 to 11 years old is 0.31 mg administered three times a day, by nebulization.","Adults and Adolescents \u2265 12 Years Old: The recommended starting dosage of levalbuterol inhalation solution for patients 12 years of age and older is 0.63 mg administered three times a day, every 6 to 8 hours, by nebulization.","Patients 12 years of age and older with more severe asthma or patients who do not respond adequately to a dose of 0.63 mg of levalbuterol inhalation solution may benefit from a dosage of 1.25 mg three times a day."]},{"n":"levocarnitine","a":"","c":"Metabolic","b":"Levocarnitine","s":"05ab18c1-fb01-48fa-8f05-0200bb8a5edf","d":"20241227","p":["Infants and children: The recommended dosage of levocarnitine is 50 to 100 mg/kg/day which is equivalent to 0.5 mL/kg/day levocarnitine oral solution.","Dosage should start at 50 mg/kg/day, and be increased slowly to a maximum of 3 g/day (30 mL/day) while assessing tolerance and therapeutic response.","Pediatric Use See DOSAGE AND ADMINISTRATION ."]},{"n":"levodopa and carbidopa","a":"","c":"Neuro","b":"Carbidopa and Levodopa","s":"015bc056-ee86-4006-ae7c-689b95e566f4","d":"20260319","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established."]},{"n":"levofloxacin","a":"","c":"Antibiotic","b":"Levofloxacin","s":"05d179f5-b200-8597-e063-6394a90a10cc","d":"20250304","p":["2 DOSAGE & ADMINISTRATION \u2022 Administer Levofloxacin Tablets to pediatric patients weighing 30 kg and greater only (2.1, 2.2). \u2022 Levofloxacin Tablets cannot be administered to pediatric patients who weigh less than 30 kg because of the limitations of the available strengths.","Alternative formulations of levofloxacin may be considered for pediatric patients who weigh less than 30 kg (2.2).","Dosage in Adult and Pediatric Patients with Creatinine Clearance greater than or equal to 50 mL/minute (2.1."]},{"n":"levothyroxine","a":"","c":"Endocrine","b":"Levothyroxine sodium","s":"008de8fd-150f-4022-8ccb-c8bfa94875c7","d":"20260324","p":["Starting dose depends on a variety of factors, including age, body weight, cardiovascular status, and concomitant medications.","Administer levothyroxine sodium tablets to pediatric patients who cannot swallow intact tablets by crushing the tablet, suspending the freshly crushed tablet in a small amount (5 to 10 mL) of water and immediately administering the suspension by spoon or dropper.","Do not administer in foods that decrease absorption of levothyroxine sodium tablets, such as soybean-based infant formula [see Drug Interactions (7.9) ]."]},{"n":"lidocaine","a":"","c":"Anesthesia","b":"Lidocaine Hydrochloride","s":"0050d05a-b8e9-c544-e063-6294a90a0243","d":"20240208","p":["DOSAGE AND ADMINISTRATION Adult The maximum recommended single dose of lidocaine for healthy adults should be such that the dose of lidocaine does not exceed 4.5 mg/kg or 2 mg/lb body weight and does not in any case exceed a total of 300 mg.","Pediatric Care must be taken to ensure correct dosage in all pediatric patients as there have been cases of overdose due to inappropriate dosing.","It is difficult to recommend a maximum dose of any drug for children since this varies as a function of age and weight."]},{"n":"linezolid","a":"","c":"Antibiotic","b":"Linezolid","s":"16007ca5-7956-4414-af38-406a6623400e","d":"20260717","p":["2 DOSAGE AND ADMINISTRATION Dosage, Route, and Frequency of Administration Infection Pediatric Patients (Birth through 11 Years of Age)","Nosocomial pneumonia Community-acquired pneumonia, including concurrent bacteremia 10 mg/kg intravenous or oral every 8 hours 600 mg intravenous or oral every 12 hours 10 to 14 Complicated skin and skin structure infections Vancomycin-resistant Enterococcus faecium infections, including concurrent b","Pediatric Patients Neonates less than 7 days: Most pre-term neonates less than 7 days of age (gestational age less than 34 weeks) have lower systemic linezolid clearance values and larger AUC values than many full-term neonates and older infants."]},{"n":"liothyronine","a":"","c":"Endocrine","b":"Liothyronine Sodium","s":"0b0f2db9-642d-d84f-b102-b43de34bbe75","d":"20240315","p":["2.1 General Principles of Dosing The dose of liothyronine sodium tablets for hypothyroidism or pituitary Thyroid-Stimulating Hormone (TSH) suppression depends on a variety of factors including: the patient's age, body weight, cardiovascular status, concomitant medical conditions (including pregnancy","Pediatric Patients The recommended starting dosage is 5 mcg once daily, with a 5 mcg increase every 3 to 4 days until the desired response is achieved.","Infants a few months old may require 20 mcg once daily for maintenance."]},{"n":"liraglutide","a":"","c":"Endocrine","b":"Liraglutide","s":"0450d8a2-a88e-4849-9788-ed4f5246f223","d":"20261030","p":["Pediatric Patients: Initiate at 0.6 mg injected subcutaneously once daily for at least one week.","Pediatric Patients Aged 10 Years and Older The recommended starting dosage of liraglutide injection is 0.6 mg injected subcutaneously once daily.","8.4 Pediatric Use The safety and effectiveness of liraglutide injection as an adjunct to diet and exercise to improve glycemic control in type 2 diabetes mellitus have been established in pediatric patients 10 years of age and older."]},{"n":"lisinopril","a":"","c":"CVS","b":"Lisinopril","s":"021831ab-dfeb-40fc-aede-4aa1fbb8d918","d":"20230818","p":["Pediatric patients with glomerular filtration rate > 30 mL/min/1.73m 2 : Initial dose in patients 6 years of age and older is 0.07 mg per kg (up to 5 mg total) once daily ( 2.1 )","Pediatric Patients 6 Years of Age and Older with Hypertension For pediatric patients with glomerular filtration rate > 30 mL/min/1.73m 2 , the recommended starting dose is 0.07 mg per kg once daily (up to 5 mg total).","Dosage should be adjusted according to blood pressure response up to a maximum of 0.61 mg per kg (up to 40 mg) once daily."]},{"n":"lithium","a":"","c":"Psych","b":"Lithium","s":"59d0e8e3-bc0b-0cc1-e063-6394a90a0a6d","d":"20260824","p":["2 DOSAGE AND ADMINISTRATION Recommended starting dosage for adults and pediatric patients over 30 kg ( 2.2 ): Oral Solution: 8mEq lithium (5 mL) three times daily Recommended starting dosage for pediatric patients 20 to 30 kg ( 2.2 ): Oral Solution: 8mEq (5mL), twice daily Obtain serum lithium conce","Concurrent medications should be assessed, and if the patient is a woman of childbearing potential, pregnancy status and potential should be considered.","2.2 Recommended Dosage See Table 1 for dosage recommendations for acute and maintenance treatment of bipolar I disorder in adult and pediatric patients (7 to 17 years)."]},{"n":"loperamide","a":"","c":"GI","b":"Loperamide Hydrochloride","s":"03c907d5-87f8-47a6-9544-5a24f5272739","d":"20260105","p":["DOSAGE AND ADMINISTRATION Loperamide hydrochloride capsules USP are contraindicated in pediatric patients less than 2 years of age due to the risks of respiratory depression and serious cardiac adverse reactions (see CONTRAINDICATIONS ).","Avoid loperamide hydrochloride capsules dosages higher than recommended in adult or pediatric patients 2 years of age and older due to the risk of serious cardiac adverse reactions (see WARNINGS , OVERDOSAGE ). (1 capsule = 2 mg)","Acute Diarrhea Adults and Pediatric Patients 13 Years and Older: The recommended initial dose is 4 mg (two capsules) followed by 2 mg (one capsule) after each unformed stool."]},{"n":"lopinavir and ritonavir","a":"","c":"Antiretroviral","b":"Lopinavir and Ritonavir","s":"115178c8-5ee2-4d96-820e-ea8264c1ac10","d":"20260827","p":["Pediatric Patients (14 days and older) ( 2.4 ): Lopinavir and ritonavir once daily dosing regimen is not recommended in pediatric patients.","Twice daily dose is based on body weight or body surface area.","Concomitant Therapy in Adults and Pediatric Patients: Dose adjustments of lopinavir and ritonavir may be needed when co-administering with efavirenz, nevirapine, or nelfinavir. ( 2.3 , 2.4 , 7.3 )"]},{"n":"loratadine","a":"","c":"Antihistamine","b":"allergy relief","s":"0038bc38-c205-4d8d-ab78-1abbcd76829e","d":"20260225","p":["Directions adults and children 6 years and over 1 tablet daily; not more than 1 tablet in 24 hours children under 6 years of age ask a doctor consumers with liver or kidney disease ask a doctor"]},{"n":"losartan","a":"","c":"CVS","b":"Losartan Potassium","s":"021cd76a-b093-4704-8410-5e7d01e20a54","d":"20260827","p":["2 DOSAGE AND ADMINISTRATION Hypertension \u2022 Usual adult dose: 50 mg once daily. (2.1) \u2022 Usual pediatric starting dose: 0.7 mg per kg once daily (up to 50 mg). (2.1)","Pediatric Hypertension The usual recommended starting dose is 0.7 mg per kg once daily (up to 50 mg total) administered as a tablet or a suspension [see Dosage and Administration (2.5) ].","Doses above 1.4 mg per kg (or in excess of 100 mg) daily have not been studied in pediatric patients [see Clinical Pharmacology (12.3) , Clinical Studies (14.1) , and Warnings and Precautions (5.2) ]."]},{"n":"mannitol","a":"","c":"Diuretic/critical","b":"MANNITOL","s":"999ce711-2d5b-0d7d-e053-2995a90a2689","d":"20240127","p":["2.2 Recommended Dosage Reduction of Intracranial Pressure and Brain Mass In adults a dose of 0.25 to 2 g/kg body weight as a 15% to 25% solution administered over a period of 30 to 60 minutes; pediatric patients 1 to 2 g/kg body weight or 30 to 60 g/m2 body surface area over a period of 30 to 60 min","In small or debilitated patients, a dose of 500 mg/kg may be sufficient.","Careful attention must be paid to fluid and electrolyte balance, body weight, and total input and output before and after infusion of mannitol."]},{"n":"mebendazole","a":"","c":"Antiparasitic","b":"VERMOX","s":"a720c424-517a-461b-8e13-6c37caf8aa3f","d":"20211005","p":["8.4 Pediatric Use The safety and effectiveness of VERMOX\u2122 CHEWABLE 500 mg tablets have been established in pediatric patients 1 to 16 years of age.","Use of VERMOX\u2122 CHEWABLE 500 mg tablets in children is supported by evidence from adequate and well-controlled studies of VERMOX\u2122 CHEWABLE 500 mg tablets [see Clinical Studies (14) ] .","The safety and effectiveness of mebendazole, including VERMOX\u2122 CHEWABLE have not been established in pediatric patients less than one year of age."]},{"n":"medroxyprogesterone","a":"","c":"Endocrine","b":"MEDROXYPROGESTERONE ACETATE","s":"01e28bef-9758-40cf-a4ff-86ae9f4f5105","d":"20221214","p":["Dosage does not need to be adjusted for body weight [ see Clinical Studies ( 14.1 )] .","8.4 Pediatric Use Medroxyprogesterone acetate injectable suspension is not indicated before menarche."]},{"n":"mefenamic acid","a":"","c":"Analgesic/antipyretic","b":"Mefenamic acid","s":"4b0788cd-bdca-4fa5-9eba-01a270613aab","d":"20260112","p":["2 DOSAGE AND ADMINISTRATION Adults and adolescents 14 years of age and older: 500 mg given orally as an initial dose followed by 250 mg every 6 hours as needed ( 2.2 )","2.2 For the Management of Mild to Moderate Pain The recommended dosage in adults and pediatric patients 14 years of age and older is 500 mg given orally as an initial dose followed by 250 mg every 6 hours as needed.","8.4 Pediatric Use The safety and effectiveness of mefenamic acid capsules have been established for management of mild to moderate pain in pediatric patients 14 years of age and older."]},{"n":"mefloquine","a":"","c":"Antimalarial","b":"Mefloquine Hydrochloride","s":"09716a24-d7da-42b2-af29-c03a1b6670bd","d":"20250926","p":["Malaria Treatment in Pediatric Patients Treatment of mild to moderate malaria in pediatric patients caused by mefloquine-susceptible strains of P. falciparum: Dosage: 20 to 25 mg/kg body weight.","The pediatric dose should not exceed the adult dose.","Experience with mefloquine in pediatric patients weighing less than 20 kg is limited."]},{"n":"melatonin","a":"","c":"Neuro/sleep","b":"Melatonin","s":"4ea9b3dc-a6f7-48b0-b0a7-ac2951bc575d","d":"20240401","p":["Consult a physician for use in children under 12 years of age."]},{"n":"mercaptopurine","a":"","c":"Oncology","b":"MERCAPTOPURINE","s":"0a366cf3-91f0-4aa4-8f34-a7a27cad8f15","d":"20260722","p":["2 DOSAGE AND ADMINISTRATION \u2022 The recommended starting dosage of mercaptopurine oral suspension is 1.5 mg/kg to 2.5 mg/kg (50 mg/m 2 to 75 mg/m 2 ) orally once daily as part of a combination chemotherapy maintenance regimen.","2.1 Recommended Dosage The recommended starting dose of mercaptopurine oral suspension is 1.5 mg/kg to 2.5 mg/kg (50 mg/m 2 to 75 mg/m 2 ) orally once daily as part of combination chemotherapy maintenance regimen.","8.4 Pediatric Use Safety and effectiveness of mercaptopurine have been established in pediatric patients."]},{"n":"mesalamine","a":"","c":"GI","b":"Mesalamine","s":"04ce2182-2e8c-4598-a269-550cfaddde6c","d":"20240215","p":["Pediatric Patients The recommended dosage for treatment of mildly to moderately active ulcerative colitis in pediatric patients weighing at least 24 kg who can swallow tablets whole is shown in Table 1: Table 1: Recommended Dosage of Mesalamine Delayed-release Tablets for the Treatment of Mildly to ","Recommended Dosage in Pediatric Patients \u2022 The recommended dosage for treatment of mildly to moderately active ulcerative colitis in pediatric patients weighing at least 24 kg who can swallow tablets whole is shown below: ( 2 )","Weight of Pediatric Patient Once Daily Mesalamine Delayed-Release Tablets Dosage Week 0 to Week 8 After Week 8 24 kg to 35 kg 2.4 g (two 1.2 g tablets)"]},{"n":"mesna","a":"","c":"Oncology","b":"MESNEX","s":"2e8eebc3-ea75-4c57-bfe1-2c5dc2c37806","d":"20180724","p":["8.4 Pediatric Use Safety and effectiveness of MESNEX in pediatric patients have not been established.","MESNEX contains benzyl alcohol (10.4 mg benzyl alcohol per mL) which has been associated with serious adverse reactions and death in pediatric patients.","The \"gasping syndrome,\" (characterized by central nervous system depression, metabolic acidosis and gasping respirations) has been associated with benzyl alcohol dosages >99 mg/kg/day in neonates, premature, and low-birth weight infants."]},{"n":"metformin","a":"","c":"Endocrine","b":"Metformin Hydrochloride","s":"011de1a5-1ac0-4831-9e8d-26ec79ba2205","d":"20240821","p":["Pediatric Dosage for metformin hydrochloride tablets: Starting dose: 500 mg orally twice a day, with meals ( 2.2 )","2.2 Pediatric Dosage for metformin hydrochloride tablets The recommended starting dose of metformin hydrochloride tablets for pediatric patients 10 years of age and older is 500 mg orally twice a day, given with meals.","8.4 Pediatric Use Metformin Hydrochloride Tablets The safety and effectiveness of metformin hydrochloride tablets for the treatment of type 2 diabetes mellitus have been established in pediatric patients 10 to 16 years old."]},{"n":"methadone","a":"","c":"Analgesic/opioid","b":"Methadone Hydrocloride dye-free, sugar-free, unflavored","s":"0955ea4a-c6b8-431f-ba42-9641b5b102ea","d":"20260112","p":["Package in child-resistant containers and inform patients that Methadone Hydrochloride should be kept out of reach of children to prevent accidental ingestion.","Also consider recommending or prescribing such an agent if the patient has household members (including children) or other close contacts at risk for accidental ingestion or opioid overdose [see Warnings and Precautions ( 5.1 )] .","8.4 Pediatric Use The safety, effectiveness, and pharmacokinetics of methadone in pediatric patients below the age of 18 years have not been established."]},{"n":"methimazole","a":"","c":"Endocrine","b":"Methimazole","s":"06bb4bcc-5e47-48b6-a76c-648f846704e8","d":"20260820","p":["Pediatric - Initially, the daily dosage is 0.4 mg/kg of body weight divided into 3 doses and given at 8-hour intervals.","Pediatric Use Because of postmarketing reports of severe liver injury in pediatric patients treated with propylthiouracil, methimazole is the preferred choice when an antithyroid drug is required for a pediatric patient [see DOSAGE AND ADMINISTRATION ] ."]},{"n":"methotrexate","a":"","c":"Oncology/rheum","b":"Methotrexate","s":"0d63ba29-b692-41b4-87e8-351265c8273f","d":"20261027","p":["2.1 Important Dosage and Safety Information \u2022 Use only preservative-free Methotrexate Injection for treatment of neonates or low birth weight infants and for intrathecal use.","2.9 Recommended Dosage for Gestational Trophoblastic Neoplasia For patients with low-risk gestational trophoblastic neoplasia (GTN) a recommended dosage for Methotrexate Injection is 30 mg/m 2 to 200 mg/m 2 or 0.4 mg/kg to1 mg/kg intravenously or intramuscularly.","8.4 Pediatric Use The safety and effectiveness of Methotrexate Injection in pediatric patients have been established for ALL, meningeal leukemia prophylaxis and treatment, non-Hodgkin lymphoma, osteosarcoma and in pJIA."]},{"n":"methylene blue","a":"","c":"Toxicology","b":"Methylene Blue","s":"2566ce72-9d19-42e5-80f9-8fc4612b1eff","d":"20250127","p":["2 DOSAGE AND ADMINISTRATION Administer 1 mg/kg intravenously over 5-30 minutes. ( 2.1 )","If methemoglobin level remains above 30% or if clinical symptoms persist, give a repeat dose of up to 1 mg/kg one hour after the first dose. ( 2.1 )","Administer a single dose of 1 mg/kg in patients with moderate or severe renal impairment. ( 2.2 )"]},{"n":"methylphenidate","a":"","c":"Psych","b":"Methylphenidate Hydrochloride","s":"18024571-4505-6d51-e063-6294a90a1972","d":"20260817","p":["Recommended dosage in pediatric patients 6 to 17 years of age new to methylphenidate hydrochloride extended-release tablets: starting dosage is18 mg once daily.","Maximum dosage for pediatric patients (2.3): o 6 to 12 years: 54 mg once daily o 13 to 17 years: 72 mg once daily Recommended dosage in adults (up to 65 years of age) new to methylphenidate hydrochloride extended-release tablets: starting dosage is 18 mg or 36 mg once daily.","Table 1: Recommended Methylphenidate Hydrochloride Extended-Release Tablets Dosage in Patients New to Methylphenidate Patient Population Recommended Starting Dose Dosage Range Pediatric patients 6 to 12 years of age 18 mg once daily 18 mg to 54 mg once daily Pediatric patients 13 to 17 years of age "]},{"n":"methylprednisolone","a":"","c":"Steroid","b":"Methylprednisolone Sodium Succinate","s":"05d95a56-b03a-4d5b-9877-2853ac470fa1","d":"20260213","p":["DOSAGE AND ADMINISTRATION Note: Methylprednisolone sodium succinate injection when reconstituted with bacteriostatic water for injection contains benzyl alcohol (see DESCRIPTION , WARNINGS and PRECAUTIONS , Pediatric Use)","When high dose therapy is desired, the recommended dose of methylprednisolone sodium succinate sterile powder is 30 mg/kg administered intravenously over at least 30 minutes .","In pediatric patients, the initial dose of methylprednisolone may vary depending on the specific disease entity being treated."]},{"n":"metoclopramide","a":"","c":"GI","b":"Metoclopramide","s":"146803a1-199d-4789-b128-e974bdd03322","d":"20260520","p":["The initial two doses should be 2 mg/kg if highly emetogenic drugs such as cisplatin or dacarbazine are used alone or in combination.","For less emetogenic regimens, 1 mg/kg per dose may be adequate.","The recommended single dose is: Pediatric patients above 14 years of age and adults \u2013 10 mg metoclopramide base."]},{"n":"metoprolol","a":"","c":"CVS","b":"Metoprolol Succinate","s":"028049cd-d233-49f9-87fa-ec91e433a49f","d":"20260406","p":["Pediatric Hypertensive Patients \u2265 6 Years of age: The recommended starting dose of metoprolol succinate extended-release tablets is 1 mg/kg once daily, but the maximum initial dose should not exceed 50 mg once daily.","Doses above 2 mg/kg (or in excess of 200 mg) once daily have not been studied in pediatric patients [see Use in Specific Populations (8.4) and Clinical Pharmacology (12.3) ].","Metoprolol succinate extended-release tablets have not been studied in pediatric patients < 6 years of age [see Use in Specific Populations (8.4) ]."]},{"n":"micafungin","a":"","c":"Antifungal","b":"Micafungin","s":"29f17423-5787-47d0-a83b-bbdc0198fbfa","d":"20250120","p":["Adult Pediatric Patients 4 Months and Older 30 kg or less Pediatric Patients 4 Months and Older greater than 30 kg Pediatric Patients Younger than 4 Months of Age Treatment of Candidemia, Acute Disseminated Candidiasis, Candida Peritonitis and Abscesses 100 mg daily 2 mg/kg/day (maximum 100 mg daily","See below Treatment of Candidemia, Acute Disseminated Candidiasis, Candida Peritonitis and Abscesses without Meningoencephalitis and/or Ocular Dissemination See above See above 4 mg/kg/day Treatment of Esophageal Candidiasis 150 mg daily 3 mg/kg/day 2.5 mg/kg/day (maximum 150 mg daily)","Not approved Prophylaxis of Candida Infections in HSCT Recipients 50 mg daily 1 mg/kg/day (maximum 50 mg daily)"]},{"n":"miconazole","a":"","c":"Antifungal","b":"Remedy Antifungal","s":"021b4a31-d7f6-4921-b4b1-cbe832eecd93","d":"20251029","p":["Directions Clean the affected area and dry thoroughly Apply a thin layer of powder over affected area twice daily (morning and night) or as directed by a doctor Supervise children in the use of this product For athlete's foot, pay special attention between spaces in toes; wear well-fitting, ventilat"]},{"n":"miglustat","a":"","c":"Metabolic","b":"Yargesa","s":"2b371dfe-e2b0-47fe-b677-a7bde7149f87","d":"20251217","p":["8.4 Pediatric Use The safety and effectiveness of miglustat capsules in pediatric patients have not been established.","In a combined clinical trial safety data set of 45 patients less than 18 years of age exposed to miglustat capsules in indications other than type 1 Gaucher disease, the median weight and height percentiles adjusted for age and gender decreased during the first year of treatment but then stabilized.","The mean length of exposure in these studies ranged from 2 to 2.6 years; some pediatric patients were exposed for up to 4 years."]},{"n":"milrinone","a":"","c":"Critical/emergency","b":"Milrinone Lactate in 5% Dextrose","s":"27a19fc1-5e18-44e1-957d-d90f18dedc54","d":"20260325","p":["DOSAGE AND ADMINISTRATION Milrinone Lactate in 5% Dextrose Injection should be administered with a loading dose followed by a continuous infusion (maintenance dose) according to the following guidelines: Loading Dose 50 mcg/kg: Administer slowly over 10 minutes Note: Milrinone (200 mcg per mL) in Pl","The table below shows the loading dose in milliliters (mL) of milrinone (1 mg/mL) by patient body weight (kg).","Using 1 mg/mL Concentration Patient Body Weight (kg) kg 30 40 50 60 70 80 90 100 110 120 mL 1.5 2.0 2.5 3.0 3.5 4.0 4.5 5.0 5.5 6.0 The loading dose may be given undiluted, but diluting to a rounded total volume of 10 or 20 mL (see Maintenance Dose for diluents) may simplify the visualization of the"]},{"n":"miltefosine","a":"","c":"Antiparasitic","b":"IMPAVIDO","s":"bcb387ac-2e90-4f5e-94b2-d3635190678e","d":"20261008","p":["8.4 Pediatric Use Safety and effectiveness in pediatric patients < 12 years have not been established."]},{"n":"minocycline","a":"","c":"Antibiotic","b":"Minocycline hydrochloride","s":"0760232b-21a6-2b13-e063-6394a90a22c1","d":"20260101","p":["For Pediatric Patients above 8 Years of Age Usual pediatric dose: 4 mg/kg initially followed by 2 mg/kg every 12 hours, not to exceed the usual adult dose.","Pediatric Use Minocycline is not recommended for the use in children below 8 years of age unless the expected benefits of therapy outweigh the risks (see WARNINGS )."]},{"n":"minoxidil","a":"","c":"CVS","b":"MINOXIDIL","s":"02d7399f-94cc-f718-f214-587301edd138","d":"20260121","p":["DOSAGE AND ADMINISTRATION Patients over 12 years of age: The recommended initial dosage of minoxidil tablets is 5 mg of minoxidil given as a single daily dose.","Patients under 12 years of age: The initial dosage is 0.2 mg/kg minoxidil as a single daily dose.","The effective dosage range is usually 0.25 mg to 1 mg/kg/day."]},{"n":"mometasone","a":"","c":"Respiratory/steroid","b":"ASMANEX HFA","s":"0c6d63da-41bc-4894-bead-198e66c848ac","d":"20260707","p":["Treatment of asthma in patients 12 years of age and older: 2 inhalations twice daily of ASMANEX HFA 100 mcg or 200 mcg.","Adult and Adolescent Patients Aged 12 Years and Older For patients 12 years of age and older, the dosage is either 2 inhalations twice daily of ASMANEX HFA 100 mcg or 200 mcg.","The recommended starting dosage for patients 12 years of age and older who are not on an inhaled corticosteroid is ASMANEX HFA 100 mcg, 2 inhalations twice daily."]},{"n":"mometasone nasal","a":"","c":"ENT","b":"ASMANEX HFA","s":"0c6d63da-41bc-4894-bead-198e66c848ac","d":"20260707","p":["Treatment of asthma in patients 12 years of age and older: 2 inhalations twice daily of ASMANEX HFA 100 mcg or 200 mcg.","Adult and Adolescent Patients Aged 12 Years and Older For patients 12 years of age and older, the dosage is either 2 inhalations twice daily of ASMANEX HFA 100 mcg or 200 mcg.","The recommended starting dosage for patients 12 years of age and older who are not on an inhaled corticosteroid is ASMANEX HFA 100 mcg, 2 inhalations twice daily."]},{"n":"morphine","a":"","c":"Analgesic/opioid","b":"MORPHINE SULFATE","s":"07593aa4-f2c4-4d6e-b186-ab2a4ecaa38a","d":"20251010","p":["Initiate treatment with morphine sulfate tablets in adults and pediatric patients 50 kg and above: 15 to 30 mg every 4 hours as needed for pain, at the lowest dose necessary to achieve adequate analgesia.","Do not exceed 30 mg as an initial dose in pediatric patients.","Consider prescribing naloxone if the patient has household members (including children) or other close contacts at risk for accidental ingestion or overdose."]},{"n":"moxifloxacin","a":"","c":"Antibiotic","b":"MOXIFLOXACIN HYDROCHLORIDE","s":"02c29e8e-8346-4e28-b7fc-2f4cb61ad37d","d":"20240918","p":["2.2 Important Administration Instructions With Multivalent Cations Administer moxifloxacin tablets at least 4 hours before or 8 hours after products containing magnesium, aluminum, iron or zinc, including antacids, sucralfate, multivitamins and didanosine buffered tablets for oral suspension or the ","8.4 Pediatric Use Effectiveness in pediatric patients and adolescents less than 18 years of age has not been established.","Limited information on the safety of moxifloxacin hydrochloride in 301 pediatric patients is available from the cIAI trial [see Boxed Warning , Warnings and Precautions (5.11) and Nonclinical Toxicology (13.2) ]."]},{"n":"moxifloxacin ophthalmic","a":"","c":"Ophthalmic","b":"MOXIFLOXACIN HYDROCHLORIDE","s":"02c29e8e-8346-4e28-b7fc-2f4cb61ad37d","d":"20240918","p":["2.2 Important Administration Instructions With Multivalent Cations Administer moxifloxacin tablets at least 4 hours before or 8 hours after products containing magnesium, aluminum, iron or zinc, including antacids, sucralfate, multivitamins and didanosine buffered tablets for oral suspension or the ","8.4 Pediatric Use Effectiveness in pediatric patients and adolescents less than 18 years of age has not been established.","Limited information on the safety of moxifloxacin hydrochloride in 301 pediatric patients is available from the cIAI trial [see Boxed Warning , Warnings and Precautions (5.11) and Nonclinical Toxicology (13.2) ]."]},{"n":"mupirocin","a":"","c":"Antibiotic/topical","b":"DermacinRx Clorhexacin","s":"3c8cb9a6-58e5-4e8d-bfdc-1432a1bde6f9","d":"20241213","p":["Directions use with care in premature infants and infants under 2 months of age."]},{"n":"nafcillin","a":"","c":"Antibiotic","b":"NAFCILLIN SODIUM","s":"090fda61-b9c8-640e-e063-6294a90a7363","d":"20250930","p":["RECOMMENDED DOSAGE FOR NAFCILLIN FOR INJECTION, USP Drug Adults Infants and Children <40 kg (88 lbs)","IV every 4 hours 25 mg/kg IM twice daily Neonates 10 mg/kg IM twice daily Nafcillin 1 gram IM or IV every 4 hours (severe infections)","There is no clinical experience available on the use of this agent in neonates or infants for this route of administration."]},{"n":"nalbuphine","a":"","c":"Analgesic/opioid","b":"Nalbuphine Hydrochloride","s":"28f274a4-62c4-4e54-e063-6394a90a2200","d":"20241210","p":["Induction doses of nalbuphine hydrochloride range from 0.3 mg/kg to 3 mg/kg intravenously to be administered over a 10 to 15 minute period with maintenance doses of 0.25 to 0.5 mg/kg in single intravenous administrations as required.","Pediatric Use Safety and effectiveness in pediatric patients below the age of 18 years have not been established."]},{"n":"naloxone","a":"","c":"Antidote","b":"Naloxone Hydrochloride","s":"201fdedf-1736-4e52-9d7d-de14292547fd","d":"20250731","p":["Usage in Children Opioid Overdose\u2013Known or Suspected: The usual initial dose in children is 0.01 mg/kg body weight given I.V.","If this dose does not result in the desired degree of clinical improvement, a subsequent dose of 0.1 mg/kg body weight may be administered.","Usage in Neonates Opioid-induced Depression: The usual initial dose is 0.01 mg/kg body weight administered I.V., I.M. or S.C."]},{"n":"naproxen","a":"","c":"Analgesic/antipyretic","b":"Naproxen","s":"000155a8-709c-44e5-a75f-cd890f3a7caf","d":"20260129","p":["Polyarticular Juvenile Idiopathic Arthritis Naproxen tablets may not allow for the flexible dose titration needed in pediatric patients with polyarticular juvenile idiopathic arthritis.","Recommended total daily dose of naproxen is approximately 10 mg/kg given in 2 divided doses.","Dosing with naproxen tablets is not appropriate for children weighing less than 50 kilograms."]},{"n":"neostigmine","a":"","c":"Anesthesia","b":"Neostigmine","s":"81243f47-bd25-bd02-518a-087badcca755","d":"20210202","p":["2 DOSAGE AND ADMINISTRATION \u2022 Should be administered by trained healthcare providers ( 2.1) \u2022 Peripheral nerve stimulator and monitoring for twitch responses should be used to determine when neostigmine methylsulfate injection should be initiated and if additional doses are needed ( 2.2 ) \u2022 For reve","A 0.03 mg/kg to 0.07 mg/kg dose of neostigmine methylsulfate injection will generally achieve a TOF twitch ratio of 90% (TOF0.9) within 10 to 20 minutes of administration.","Dose selection should be based on the extent of spontaneous recovery that has occurred at the time of administration, the half-life of the NMBA being reversed, and whether there is a need to rapidly reverse the NMBA. \u2022 The 0.03 mg/kg dose is recommended for: i."]},{"n":"nevirapine","a":"","c":"Antiretroviral","b":"NEVIRAPINE","s":"2620b114-f53f-44f1-8708-697e86343090","d":"20240814","p":["2 DOSAGE & ADMINISTRATION \u2022 The 14-day lead-in period with immediate-release nevirapine tablets (200 mg once daily) must be strictly followed; it has been demonstrated to reduce the frequency of rash. ( 2.5 , 5.2 ) \u2022 Must be swallowed whole and must not be chewed, crushed, or divided. ( 2.1 ) \u2022 Adul","Pediatric patients should be assessed for their ability to swallow the extended-release tablets before prescribing nevirapine extended-release tablets.","2.3 Recommended Dosage in Pediatric Patients Nevirapine extended-release tablet in pediatric patients is dosed based on body surface area (BSA) calculated using the Mosteller formula."]},{"n":"nicardipine","a":"","c":"CVS","b":"Nicardipine Hydrochloride","s":"065efabf-8c7d-4dd5-aef2-700c2eca399d","d":"20190107","p":["Pediatric Use Safety and efficacy in patients under the age of 18 have not been established."]},{"n":"nifedipine","a":"","c":"CVS","b":"Nifedipine","s":"0b4e9bbc-4c16-4611-9ea2-903852804227","d":"20260319","p":["Pediatric Use The safety and effectiveness of Nifedipine Extended-Release tablets, USP in pediatric patients have not been established."]},{"n":"nitazoxanide","a":"","c":"Antiparasitic","b":"Nitazoxanide","s":"295011e1-f919-4e5a-b9e7-4c784f623a86","d":"20251230","p":["2 DOSAGE AND ADMINISTRATION \u2022 Nitazoxanide tablets should not be administered to pediatric patient 11 years of age or younger ( 2.1 ). \u2022 Dosage for treatment of diarrhea caused by G.lamblia or C. parvum ( 2.1 ): Age Dosage Duration 12 years and older One 500 mg nitazoxanide tablet every 12 hours wit","8.4 Pediatric Use The safety and efficacy of nitazoxanide tablets for the treatment of diarrhea caused by G. lamblia or C. parvum in pediatric patients 12 to 17 years of age has been established based on three (3) randomized controlled studies with 47 pediatric subjects treated with nitazoxanide tab","A single nitazoxanide tablet contains a greater amount of nitazoxanide than is recommended for use in pediatric patients 11 years or younger. [see Dosage and Administration ( 2.1 )] ."]},{"n":"nitisinone","a":"","c":"Metabolic","b":"ORFADIN","s":"00307f42-748d-4227-8c6f-ed5f0a89ae0a","d":"20251218","p":["2 DOSAGE AND ADMINISTRATION Recommended Dosage ( 2.1 ) : The recommended starting dosage is 0.5 mg/kg orally twice daily.","In patients 5 years of age and older who have undetectable serum and urine succinylacetone concentrations after a minimum of 4 weeks on a stable dosage of nitisinone, the total daily dose may be given once daily.","The maximum total daily dosage is 2 mg/kg orally."]},{"n":"nitrofurantoin","a":"","c":"Antibiotic","b":"Nitrofurantoin","s":"04af8b73-7e15-7da8-e063-6294a90af284","d":"20240329","p":["Pediatric Patients: 5 mg/kg to 7 mg/kg of body weight per 24 hours, given in four divided doses (contraindicated under one month of age). (2.3)","2.2 Recommended Dosage and Administration in Pediatric Patients (1 month of age and older)","The recommended dosage of nitrofurantoin is 5 mg/kg to 7 mg/kg of body weight per 24 hours, given in four divided doses in pediatric patients aged 1 month and older."]},{"n":"nitroglycerin","a":"","c":"CVS","b":"Glonoinum","s":"7c0efc90-7a53-11e6-a302-424c58303031","d":"20231113","p":["Adults and children: At the onset of symptoms, dissolve 5 pellets under the tongue 3 times a day until symptoms are relieved or as directed by a doctor."]},{"n":"norepinephrine","a":"noradrenaline","c":"Critical/emergency","b":"Norepinephrine","s":"77da899e-fa5b-476c-a7b3-5fa635e5ea4c","d":"20250402","p":["DIRECTIONS: \u2022 10 drops orally, 3 times a day. \u2022 Consult a health care professional for use in children under 12 years of age."]},{"n":"nystatin","a":"","c":"Antifungal","b":"Nyamyc","s":"01b44f91-9b68-464a-9693-b5d3e793bf3c","d":"20250709","p":["Adults and Pediatric Patients (Neonates and Older)","Pediatric Use Safety and effectiveness have been established in the pediatric population from birth to 16 years. [see DOSAGE AND ADMINISTRATION ]."]},{"n":"octreotide","a":"","c":"GI","b":"Octreotide Acetate","s":"01962c67-e551-47b6-a276-e1ae1860d2a4","d":"20250116","p":["8.4 Pediatric Use Safety and efficacy of octreotide acetate injection in the pediatric population have not been demonstrated.","No formal controlled clinical trials have been performed to evaluate the safety and effectiveness of octreotide acetate injection in pediatric patients under age 6 years.","In postmarketing reports, serious adverse events, including hypoxia, necrotizing enterocolitis, and death, have been reported with octreotide acetate injection use in children, most notably in children under 2 years of age."]},{"n":"ofloxacin","a":"","c":"Antibiotic","b":"ofloxacin","s":"0621700e-6315-47ff-a8ed-cccf7d6fc56a","d":"20260813","p":["DOSAGE AND ADMINISTRATION Otitis Externa: The recommended dosage regimen for the treatment of otitis externa is: For pediatric patients (from 6 months to 13 years old): Five drops (0.25 mL, 0.75 mg ofloxacin) instilled into the affected ear once daily for seven days.","Acute Otitis Media in pediatric patients with tympanostomy tubes: The recommended dosage regimen for the treatment of acute otitis media in pediatric patients (from 1 to 12 years old) with tympanostomy tubes is: Five drops (0.25 mL, 0.75 mg ofloxacin) instilled into the affected ear twice daily for ","Pediatric Use: Safety and efficacy have been demonstrated in pediatric patients of the following ages for the listed indications: \u25a0 six months and older: otitis externa with intact tympanic membranes \u25a0 one year and older: acute otitis media with tympanostomy tubes \u25a0 twelve years and older: chronic s"]},{"n":"ofloxacin otic","a":"","c":"ENT","b":"ofloxacin","s":"0621700e-6315-47ff-a8ed-cccf7d6fc56a","d":"20260813","p":["DOSAGE AND ADMINISTRATION Otitis Externa: The recommended dosage regimen for the treatment of otitis externa is: For pediatric patients (from 6 months to 13 years old): Five drops (0.25 mL, 0.75 mg ofloxacin) instilled into the affected ear once daily for seven days.","Acute Otitis Media in pediatric patients with tympanostomy tubes: The recommended dosage regimen for the treatment of acute otitis media in pediatric patients (from 1 to 12 years old) with tympanostomy tubes is: Five drops (0.25 mL, 0.75 mg ofloxacin) instilled into the affected ear twice daily for ","Pediatric Use: Safety and efficacy have been demonstrated in pediatric patients of the following ages for the listed indications: \u25a0 six months and older: otitis externa with intact tympanic membranes \u25a0 one year and older: acute otitis media with tympanostomy tubes \u25a0 twelve years and older: chronic s"]},{"n":"olanzapine","a":"","c":"Psych","b":"Olanzapine","s":"002dd00f-7946-ea4f-e063-6294a90a5916","d":"20230710","p":["Oral in combination with fluoxetine: Start at 5 mg of oral olanzapine and 20 mg of fluoxetine once daily Depressive Episodes associated with Bipolar I Disorder in children and adolescents ( 2.5 )","Safety of co-administration of doses above 12 mg olanzapine with 50 mg fluoxetine has not been evaluated in children and adolescents ages 10 to 17. ( 2.5 )","Dosing in Special Populations \u2014 The recommended starting dose is 5 mg in patients who are debilitated, who have a predisposition to hypotensive reactions, who otherwise exhibit a combination of factors that may result in slower metabolism of olanzapine (e.g., nonsmoking female patients \u226565 years of "]},{"n":"olopatadine","a":"","c":"Ophthalmic","b":"olopatadine hydrochloride","s":"126ff6eb-62ae-46f2-ab1e-7ac19346c36b","d":"20230901","p":["Recommended dosages: \u2022 Adults and Adolescents \u2265 12 Years : Two sprays per nostril (665 mcg per spray) twice daily ( 2.1 ). \u2022 Pediatric Patients 6 to 11 Years : One spray per nostril (665 mcg per spray) twice daily ( 2.2 ). \u2022 Priming Information : Prime olopatadine hydrochloride nasal spray before in","2.1 Adults and Adolescents Twelve Years of Age and Older The recommended dosage is two sprays per nostril twice daily.","2.2 Pediatric Patients Six to Eleven Years of Age The recommended dosage is one spray per nostril twice daily."]},{"n":"omalizumab","a":"","c":"Respiratory/allergy","b":"XOLAIR","s":"7f6a2191-adfb-48b9-9bfa-0d9920479f0d","d":"20260813","p":["Determine dose (mg) and dosing frequency by serum total IgE level (IU/mL), measured before the start of treatment, and body weight (kg).","Dosing in CSU is not dependent on serum IgE level or body weight. ( 2.5 )","2.1 Overview of Dosage Determination Asthma, and Chronic Rhinosinusitis with Nasal Polyps, and IgE-Mediated Food Allergy Determine dosage of XOLAIR by serum total IgE level (IU/mL) measured before the start of treatment, and by body weight (kg)."]},{"n":"oxacillin","a":"","c":"Antibiotic","b":"Oxacillin","s":"152758c0-d225-4761-abeb-3f1cb0190806","d":"20250813","p":["RECOMMENDED DOSAGES FOR OXACILLIN FOR INJECTION, USP Drug Adults Infants and Children <40 kg (88 lbs)","50 mg/kg/day IV in equally divided doses every 6 hours (mild to moderate infections)","100 mg/kg/day IV in equally divided doses every 4 to 6 hours (severe infections)"]},{"n":"oxcarbazepine","a":"","c":"Neuro/anticonvulsant","b":"OXCARBAZEPINE","s":"03bec567-a9c3-4d82-9679-fec5324d0df6","d":"20241118","p":["Pediatrics : Initiation with 8 to 10 mg/kg/day, given twice a day.","For patients aged 2 to < 4 years and under 20 kg, a starting dose of 16 to 20 mg/kg/day may be considered.","For patients aged 2 to < 4 years, maximum maintenance dose should be achieved over 2 to 4 weeks and should not exceed 60mg/kg/day ( 2.4 ) \u2022 Conversion to Monotherapy for Patients (Aged 4 to 16 Years): Maximum increment of 10 mg/kg/day at weekly intervals, concomitant antiepileptic drugs (AEDs) can b"]},{"n":"oxybutynin","a":"","c":"Urology","b":"Oxybutynin Chloride Extended Release","s":"02ff3be7-fc5c-4b91-8c67-ecdf6e19c42a","d":"20230531","p":["Pediatric patients (6 years of age or older): Start with 5 mg, once daily at approximately the same time every day.","2.2 Pediatric Patients Aged 6 Years of Age and Older The recommended starting dose of Oxybutynin chloride extended-release tablets is 5 mg once daily at approximately the same time each day.","8.4 Pediatric Use The safety and efficacy of Oxybutynin chloride extended-release tablets were studied in 60 children in a 24-week, open-label, non-randomized trial."]},{"n":"oxycodone","a":"","c":"Analgesic/opioid","b":"Oxycodone Hydrochloride","s":"056bdaac-4a43-42f0-9435-f349d3ccc128","d":"20251227","p":["Consider prescribing naloxone if the patient has household members (including children) or other close contacts at risk for accidental ingestion or overdose .","8.4 Pediatric Use The safety and efficacy of oxycodone hydrochloride in pediatric patients have not been evaluated."]},{"n":"oxymetazoline","a":"","c":"Cough/cold","b":"Equate","s":"020942b1-59d4-a19d-e063-6394a90a5d87","d":"20251008","p":["Fully depress rim with a firm, even stroke and inhale deeply. adults & children 6 yrs. & older (with adult supervision): 2 or 3 sprays in each nostril, not more often than every 10 to 12 hours.","Do not exceed 2 doses in 24 hours. children 2 to under 6 yrs.: ask a doctor children under 2 yrs.: do not use"]},{"n":"palonosetron","a":"","c":"GI","b":"Palonosetron Hydrochloride","s":"0a781796-bb74-4c5f-8d26-9ce520b818f7","d":"20200609","p":["Age Dose Note different dosing units in pediatrics Infusion Time Adults 0.25 mg as a single dose Infuse over 30 second s beginning approximately 30 minutes before the start of chemotherapy Pediatrics (1 month to less than 17 years)","2.1 Recommended Dosage Prevention of Chemotherapy-Induced Nausea and Vomiting The recommended dosage of palonosetron hydrochloride injection for prevention of nausea and vomiting associated with HEC and MEC in adults and associated with emetogenic chemotherapy, including HEC in pediatric patients 1 ","Table 1: Recommended Dosage of Palonosetron Hydrochloride Injection for the Prevention of Nausea and Vomiting Associated with Chemotherapy in Adults and Pediatric Patients 1 Month to Less than 17 Years Age Dose Note different dosing units in pediatrics Infusion Time Adults 0.25 mg as a single dose I"]},{"n":"pamidronate","a":"","c":"Endocrine","b":"Pamidronate Disodium","s":"c2ca033e-fa5f-4141-b702-11f8b4303da1","d":"20251215","p":["8.4 Pediatric Use Safety and effectiveness of pamidronate disodium in pediatric patients have not been established."]},{"n":"pancrelipase","a":"","c":"GI","b":"Creon","s":"073201aa-556d-4a70-918e-84e9616fd88d","d":"20240228","p":["Dosing scheme based on actual body weight or fat ingestion.","Do not exceed 2,500 lipase units/kg/meal, 10,000 lipase units/kg/day, or 4,000 lipase units/g fat ingested/day in adult and pediatric patients greater than 12 months of age without further investigation. ( 5.1 )","The total daily dosage in adult and pediatric patients greater than 12 months of age should reflect approximately three meals plus two or three snacks per day."]},{"n":"pantoprazole","a":"","c":"GI","b":"Pantoprazole Sodium","s":"03dea010-4bae-43ab-893e-9bbddb58062d","d":"20260605","p":["Adults 40 mg Once Daily for up to 8 wks Children (5 years and older) \u2265 15 kg to < 40 kg 20 mg Once Daily for up to 8 wks \u2265 40 kg 40 mg Maintenance of Healing of Erosive Esophagitis ( 2.1 )","Doses up to 240 mg daily have been administered. *** Controlled studies did not extend beyond 12 months Indication Dose Frequency Short-Term Treatment of Erosive Esophagitis Associated With GERD Adults 40 mg Once daily for up to 8 weeks* Children (5 years and older) \u2265 15 kg to < 40 kg 20 mg Once dai","8.4 Pediatric Use The safety and effectiveness of pantoprazole sodium for short-term treatment (up to eight weeks) of EE associated with GERD have been established in pediatric patients 1 year through 16 years of age."]},{"n":"patiromer","a":"","c":"Electrolyte","b":"VELTASSA","s":"bf002984-d6c9-46df-aecb-a07733f763c1","d":"20250131","p":["For pediatric patients 12 to 17 years of age, the recommended starting dose of Veltassa is 4 grams administered orally once daily. ( 2.2 )","For pediatric patients 12 to 17 years of age, adjust dose by 4 grams daily as needed at one-week intervals to obtain desired serum potassium target range. ( 2.2 )","The maximum recommended dosage in adults and pediatric patients older than 12 years is 25.2 grams once daily. ( 2.2 )"]},{"n":"penicillamine","a":"","c":"Rheum","b":"Penicillamine","s":"01e79d8f-8c74-4f48-b761-9f225fabf93d","d":"20260723","p":["For pediatric patients, dosage can be based on 30 mg/kg/day.","Pediatric Use The efficacy of penicillamine in juvenile rheumatoid arthritis has not been established."]},{"n":"penicillin G benzathine","a":"benzathine penicillin","c":"Antibiotic","b":"BICILLIN L-A","s":"012d46f1-d0a0-4676-a879-cd320297ab16","d":"20260721","p":["Adults\u2014a single injection of 1,200,000 units; older pediatric patients\u2014a single injection of 900,000 units; infants and pediatric patients under 60 lbs.\u2014300,000 to 600,000 units.","Congenital\u2014under 2 years of age: 50,000 units/kg/body weight; ages 2 to 12 years: adjust dosage based on adult dosage schedule.","In neonates, infants and small children, the midlateral aspect of the thigh may be preferable."]},{"n":"penicillin G potassium","a":"benzylpenicillin","c":"Antibiotic","b":"Penicillin G Potassium","s":"1442486a-05d6-4dce-8b95-857a30f478c2","d":"20250128","p":["12 to 24 million units/day, as 2 to 4 MU every 4 hours for 10 to 14 days; many experts recommend additional therapy with Benzathine PCN G 2.4 MU IM weekly for 3 doses after completion of IV therapy Meningococcal meningitis and/or septicemia 24 million units/day as 2 million units every 2 hours Pedia","CLINICAL INDICATION DOSAGE Serious infections, such as pneumonia and endocarditis, due to susceptible strains of streptococci (including S. pneumoniae ) and meningococcus 150,000 to 300,000 units/kg/day divided in equal doses every 4 to 6 hours, duration depends on infecting organism and type of inf","Weight less than 45 kg: Arthritis 100,000 units/kg/day in 4 equally divided doses for 7 to 10 days Meningitis 250,000 units/kg/day in equal doses every 4 hours for 10 to 14 days Endocarditis 250,000 units/kg/day in equal doses every 4 hours for 4 weeks Arthritis, meningitis, endocarditis Weight 45 k"]},{"n":"penicillin V","a":"phenoxymethylpenicillin","c":"Antibiotic","b":"Penicillin V Potassium","s":"0151c742-7525-4707-af03-bd48d50cd586","d":"20261110","p":["The usual dosage recommendations for adults and children 12 years and over are as follows: Streptococcal Infections Mild to moderately severe - of the upper respiratory tract and including scarlet fever and erysipelas: 125 to 250 mg (200,000 to 400,000 units) every 6 to 8 hours for 10 days.","For prophylaxis against bacterial endocarditis 1 in patients with congenital heart disease or rheumatic or other acquired valvular heart disease when undergoing dental procedures or surgical procedures of the upper respiratory tract: 2 gram of penicillin V (1 gram for children under 60 lbs.)","1 hour before the procedure, and then, 1 gram (500 mg for children under 60 lbs.)"]},{"n":"perampanel","a":"","c":"Neuro/anticonvulsant","b":"Perampanel","s":"1b0458ea-e718-4d48-ae55-ad9b4d863810","d":"20251219","p":["2.1 Dosage for Partial-Onset Seizures Monotherapy or Adjunctive Therapy The recommended starting dosage of perampanel in adults and pediatric patients 4 years of age and older is 2 mg once daily taken orally at bedtime.","2.2 Dosage for Primary Generalized Tonic-Clonic Seizures Adjunctive Therapy The recommended starting dosage of perampanel in adults and pediatric patients 12 years of age and older is 2 mg once daily taken orally at bedtime.","Therefore, in adults and pediatric patients 4 years of age and older receiving these concomitant enzyme-inducing drugs, the recommended starting dosage of perampanel is 4 mg once daily taken orally at bedtime."]},{"n":"permethrin","a":"","c":"Antiparasitic","b":"PERMETHRIN","s":"0c92aca1-0daa-4b24-9348-f9d42fec478a","d":"20260304","p":["DOSAGE AND ADMINISTRATION: Adults and Children - Thoroughly massage Permethrin Cream, 5% into the skin from the head to the soles of the feet.","Scabies rarely infests the scalp of adults, although the hairline, neck, temple, and forehead may be infested in infants and geriatric patients.","Infants should be treated on the scalp, temple, and forehead."]},{"n":"phenobarbital","a":"","c":"Neuro/anticonvulsant","b":"Phenobarbital","s":"057992c1-29a0-4229-9c30-d787cb632eac","d":"20250922","p":["To achieve the blood levels considered therapeutic in pediatric patients, higher per-kilogram dosages are generally necessary for phenobarbital and most other anticonvulsants.","In pediatric patients and infants, phenobarbital at a loading dose of 15 to 20 mg/kg produces blood levels of about 20 mcg/mL shortly after administration.","Pediatric Patients: 3 to 6 mg/kg/day."]},{"n":"phenylephrine","a":"","c":"Cough/cold","b":"Nasal Decongestant PE","s":"0153294d-7f52-4d92-8db8-daeca3e29a3b","d":"20260306","p":["Directions adults and children 12 years and over: take 1 tablet every 4 hours.","Do not take more than 6 tablets in 24 hours. children under 12 years: ask a doctor"]},{"n":"phenylephrine injection","a":"","c":"Critical/emergency","b":"Nasal Decongestant PE","s":"0153294d-7f52-4d92-8db8-daeca3e29a3b","d":"20260306","p":["Directions adults and children 12 years and over: take 1 tablet every 4 hours.","Do not take more than 6 tablets in 24 hours. children under 12 years: ask a doctor"]},{"n":"phenylephrine ophthalmic","a":"","c":"Ophthalmic","b":"Nasal Decongestant PE","s":"0153294d-7f52-4d92-8db8-daeca3e29a3b","d":"20260306","p":["Directions adults and children 12 years and over: take 1 tablet every 4 hours.","Do not take more than 6 tablets in 24 hours traindicated for children under 2 years of age (see WARNINGS - Black Box Warning and Use in Pediatric Patients ).","After initiation of treatment in children or adults, dosage should be adjusted to the smallest amount adequate to relieve symptoms.","For children, Promethazine HCl Rectal Suppositories, 12.5 to 25 mg, twice daily, may be administered."]},{"n":"propofol","a":"","c":"Anesthesia","b":"PROPOFOL","s":"28d7ba00-f824-4e55-139a-03f509c099db","d":"20260813","p":["2.2 Induction of General Anesthesia for Patients Greater than or Equal to 3 Years of Age Adult Patients Most adult patients under 65 years of age and classified as ASA-PS I or II require 2 mg/kg to 2.5 mg/kg of propofol injectable emulsion.","Elderly, Debilitated, or ASA-PS III or IV Patients Due to the reduced clearance and higher blood concentrations, most elderly, debilitated, or ASA-PS III or IV patients require approximately 1 mg/kg to 1.5 mg/kg of propofol injectable emulsion for induction of anesthesia.","Pediatric Patients Most patients aged 3 years through 16 years and classified ASA-PS I or II require 2.5 mg/kg to 3.5 mg/kg of propofol injectable emulsion for induction."]},{"n":"propranolol","a":"","c":"CVS/neuro","b":"Propranolol Hydrochloride","s":"013a485a-4227-46ae-b19f-c550302fcb96","d":"20240809","p":["Pediatric Use Safety and effectiveness of propranolol in pediatric patients have not been established.","Bronchospasm and congestive heart failure have been reported coincident with the administration of propranolol therapy in pediatric patients."]},{"n":"propranolol oral","a":"","c":"CVS","b":"Propranolol Hydrochloride","s":"013a485a-4227-46ae-b19f-c550302fcb96","d":"20240809","p":["Pediatric Use Safety and effectiveness of propranolol in pediatric patients have not been established.","Bronchospasm and congestive heart failure have been reported coincident with the administration of propranolol therapy in pediatric patients."]},{"n":"propylthiouracil","a":"","c":"Endocrine","b":"Propylt
