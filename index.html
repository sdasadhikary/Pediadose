<html lang="en"><head><meta charset="utf-8">

<title>Paeds Dose</title>

<style>#instb{position:fixed;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:30;background:#0f766e;color:#fff;border:0;border-radius:99px;padding:12px 16px;font:650 14px system-ui;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}</style>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e3e8ef;--ac:#0f766e;--ac2:#14b8a6;--acb:#e6f6f3;--wn:#b42318;--wb:#fef1f0;--am:#fff6e0;--amt:#8a5a00;--bl:#1e5bd8;--blb:#ecf2ff;--sh:0 1px 3px rgba(15,23,42,.06),0 1px 2px rgba(15,23,42,.04);--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--tx:#e6edf5;--mu:#93a1b3;--bd:#253040;--ac:#2dd4bf;--ac2:#5eead4;--acb:#0f2e2a;--wn:#ff8a80;--wb:#3a1c1a;--am:#33290f;--amt:#f2c75c;--bl:#93b4ff;--blb:#16213a;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
input,select,button,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;min-width:0}
input,select,textarea{width:100%}button{cursor:pointer}textarea{min-height:90px;font-size:12px;font-family:ui-monospace,monospace}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
/* header */
#pt{position:sticky;top:0;z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 12px 7px;border-bottom:1px solid var(--bd)}
.prow{display:grid;grid-template-columns:1.05fr .95fr 1.05fr 1.05fr;gap:6px;align-items:end;max-width:720px;margin:0 auto}
.lab{font-size:11px;font-weight:600;color:var(--mu);margin:0 0 3px 3px;letter-spacing:.2px}
#pt input,#pt select{height:42px;padding:8px 8px;font-size:16px;font-weight:600}#pt input::-webkit-inner-spin-button{display:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--card);height:42px}.seg button{border:0;border-radius:0;flex:1;padding:0 2px;background:none;font-weight:600;color:var(--mu)}.seg .on{background:var(--ac);color:#fff}
#wnote{font-size:12.5px;color:var(--mu);margin:6px auto 0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;max-width:720px}
#wnote b{color:var(--tx)}
main{padding:8px 12px 12px;max-width:720px;margin:0 auto}
/* cards & lists */
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin:10px 0;box-shadow:var(--sh)}
.list{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);margin:8px 0;box-shadow:var(--sh);overflow:hidden}
.row2{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--bd);min-height:58px}.row2:first-child{border-top:0}
.row2:active{background:var(--acb)}
.av{flex:0 0 36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--acb)}
.rmain{flex:1;min-width:0}.rt{font-weight:650;font-size:15.5px;line-height:1.25}.rs{font-size:12.5px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chev{color:var(--mu);font-size:20px;flex:0 0 auto;opacity:.6}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac2);margin-left:6px;vertical-align:2px}
.lhd{font-size:12px;font-weight:700;color:var(--mu);padding:8px 14px 4px;background:var(--bg);letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:8px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh);text-align:left;min-height:86px}
.tile .ti{font-size:22px}.tile .tn{font-weight:650;font-size:14px;line-height:1.2}.tile .tc{font-size:12px;color:var(--mu)}
.tile:active{border-color:var(--ac)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;white-space:nowrap;padding:7px 13px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mu)}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap;line-height:1.5}
.tag.ok{background:var(--acb);color:var(--ac);border-color:transparent}.tag.am{background:var(--am);color:var(--amt);border-color:transparent}.tag.wn{background:var(--wb);color:var(--wn);border-color:transparent}.tag.bl{background:var(--blb);color:var(--bl);border-color:transparent}
.h1{font-size:22px;font-weight:750;letter-spacing:-.3px;line-height:1.2}.h{font-size:18px;font-weight:700}.mu{color:var(--mu);font-size:13px}.sm{font-size:12px}
.sec{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.6px;margin:18px 4px 4px}
.search{position:relative}.search input{padding-left:40px;height:48px;border-radius:14px;font-size:16px;box-shadow:var(--sh)}.search:before{content:"⌕";position:absolute;left:14px;top:9px;font-size:22px;color:var(--mu)}
/* drug page */
.top{display:flex;align-items:center;gap:8px;margin:4px 0 2px}.back{background:none;border:0;color:var(--ac);padding:6px 2px;font-weight:650;font-size:15px}
.star{background:none;border:0;font-size:24px;padding:0 4px;color:#d4a017;margin-left:auto}
.ind{padding:10px 12px;border:1px solid var(--bd);border-radius:12px;margin:6px 0;background:var(--card);display:flex;gap:8px;align-items:center;font-size:14.5px}.ind>span:first-child{flex:1}.ind.sel{border-color:var(--ac);background:var(--acb);font-weight:650;box-shadow:inset 3px 0 0 var(--ac)}.ind.na{opacity:.5}
.hero{background:linear-gradient(135deg,var(--acb),var(--card));border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:var(--sh)}
.big{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.6px}.big small{font-size:15px;font-weight:650;letter-spacing:0;color:var(--mu)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.kv .tag{white-space:normal}
.warn{background:var(--wb);color:var(--wn);border-radius:12px;padding:9px 12px;margin:8px 0;font-weight:600;font-size:13.5px}
.note{background:var(--am);color:var(--amt);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:13px}
.info{background:var(--blb);color:var(--bl);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:13px}
.frm{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--bd);align-items:center}.frm:first-child{border-top:0}.frm b{font-size:18px}.frm>span:last-child{text-align:right}.frm>span:first-child{font-size:14px}
details{border-top:1px solid var(--bd);padding:4px 0}details>summary{cursor:pointer;color:var(--tx);font-size:14px;font-weight:600;padding:10px 0;list-style:none;display:flex;justify-content:space-between}details>summary::-webkit-details-marker{display:none}details>summary::after{content:"▾";color:var(--mu)}details[open]>summary::after{content:"▴"}
.src{font-size:12.5px;color:var(--mu);border-left:3px solid var(--bd);padding:2px 10px;margin:6px 0}
label.ck{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13.5px}label.ck input{width:20px;height:20px}
.rx{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;word-break:break-word}
.btn{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:650}.btn2{background:none;color:var(--ac);border-color:var(--ac);padding:7px 12px;font-size:13px;font-weight:650}
.lvl{display:flex;gap:6px;margin:10px 0 2px}.lvl button{flex:1;padding:8px 4px;border-radius:12px;font-size:13px;font-weight:650;color:var(--mu)}.lvl .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}.row>span:first-child{color:var(--mu);font-size:13.5px}.row>span:last-child{text-align:right;font-weight:700}
.ch{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}.ch b{font-size:15.5px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;border-radius:0;padding:8px 2px 9px;background:none;font-size:11px;font-weight:600;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px}nav button i{font-style:normal;font-size:20px;line-height:1.1;filter:grayscale(.6);opacity:.75}nav .on{color:var(--ac)}nav .on i{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}.toast.on{opacity:.95}
.empty{padding:20px;text-align:center;color:var(--mu)}
</style><style>/* v4.1: patient bar docked at bottom, above tab bar */
#pt{position:fixed;top:auto;left:0;right:0;bottom:var(--navh,58px);border-bottom:0;border-top:1px solid var(--bd);display:flex;flex-direction:column;padding:6px 12px 8px;background:color-mix(in srgb,var(--bg) 94%,transparent);box-shadow:0 -2px 8px rgba(15,23,42,.06)}
#pt .prow{width:100%}#wnote{order:-1;margin:0 auto 6px;width:100%}
#sbw{order:-2;margin:0 0 6px}#pt #sbw input{height:44px;padding-left:40px;border-radius:14px;font-weight:500}#pt #sbw:before{top:7px}#pt #sbw input::-webkit-search-cancel-button{-webkit-appearance:none;height:18px;width:18px;border-radius:9px;background:var(--mu);opacity:.5}
body.kb nav{display:none}body.kb #pt{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
.toast{bottom:calc(var(--stackh,150px) + 10px)}#instb{bottom:calc(var(--stackh,150px) + 10px)!important}
</style>

  const named=(x.ref||'R').split(',').filter(k=>k!='R');let okr=x.okr?x.okr.split(','):(x.ok?named.slice():[]);
