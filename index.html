A small number of neonates have been treated with 25 to 200 mg/kg/day of flucytosine, with and without the addition of amphotericin B, for systemic candidiasis."]},{"n":"fludrocortisone","a":"","c":"Steroid","b":"Fludrocortisone Acetate","s":"001e72ea-2c9e-468c-90cc-6c347234e2a9","d":"20250519","p":["Pediatric Use Safety and effectiveness in children have not been established.","Growth and development of infants and children on prolonged corticosteroid therapy should be carefully observed."]},{"n":"flumazenil","a":"","c":"Antidote","b":"Flumazenil","s":"2190e8d0-d7ca-4f53-b243-0d2c31979aa8","d":"20240614","p":["Pediatric Patients For the reversal of the sedative effects of benzodiazepines administered for conscious sedation in pediatric patients greater than 1 year of age, the recommended initial dose is 0.01 mg/kg (up to 0.2 mg) administered intravenously over 15 seconds.","If the desired level of consciousness is not obtained after waiting an additional 45 seconds, further injections of 0.01 mg/kg (up to 0.2 mg) can be administered and repeated at 60-second intervals where necessary (up to a maximum of 4 additional times) to a maximum total dose of 0.05 mg/kg or 1 mg,","The mean total dose administered in the pediatric clinical trial of flumazenil was 0.65 mg (range: 0.08 mg to 1.00 mg)."]},{"n":"fluoxetine","a":"","c":"Psych","b":"Fluoxetine","s":"02283de9-6087-45f7-a9ce-3b082ce860de","d":"20190201","p":["2 DOSAGE AND ADMINISTRATION Indication Adult Pediatric MDD ( 2.1 )","Safety of the coadministration of doses above 12 mg olanzapine with 50 mg fluoxetine has not been evaluated in children and adolescents ages 10 to 17 ( 2.5 )","Pediatric (children and adolescents) \u2014 Initiate Fluoxetine 10 or 20 mg/day."]},{"n":"fluticasone","a":"","c":"Respiratory/steroid","b":"Fluticasone Propionate","s":"0120296b-bebc-4a2d-8058-6caf41f96e52","d":"20230717","p":["DOSAGE AND ADMINISTRATION Fluticasone Propionate Cream, 0.05% may be used in adult and pediatric patients 3 months of age or older.","Safety and efficacy of Fluticasone Propionate Cream, 0.05% in pediatric patients for more than 4 weeks of use have not been established (see PRECAUTIONS - Pediatric Use ).","The safety and efficacy of Fluticasone Propionate Cream, 0.05% in pediatric patients below 3 months of age have not been established."]},{"n":"fluticasone nasal","a":"","c":"ENT","b":"Fluticasone Propionate","s":"0120296b-bebc-4a2d-8058-6caf41f96e52","d":"20230717","p":["DOSAGE AND ADMINISTRATION Fluticasone Propionate Cream, 0.05% may be used in adult and pediatric patients 3 months of age or older.","Safety and efficacy of Fluticasone Propionate Cream, 0.05% in pediatric patients for more than 4 weeks of use have not been established (see PRECAUTIONS - Pediatric Use ).","The safety and efficacy of Fluticasone Propionate Cream, 0.05% in pediatric patients below 3 months of age have not been established."]},{"n":"fluvoxamine","a":"","c":"Psych","b":"Fluvoxamine Maleate","s":"0a6836ab-bd0e-410b-82af-07720e386532","d":"20251104","p":["Pediatric patients na\u00efve to fluvoxamine maleate: The lowest available dose of fluvoxamine maleate extended-release capsules may not be appropriate ( 2.2 ) .","2.2 Pediatric Patients Na\u00efve to Fluvoxamine Maleate Physicians should consider that the lowest available dose of fluvoxamine maleate extended-release capsules may not be appropriate for pediatric patients na\u00efve to fluvoxamine maleate.","The risk of administering methylene blue by non-intravenous routes (such as oral tablets or by local injection) or in intravenous doses much lower than 1 mg/kg with fluvoxamine maleate extended-release is unclear."]},{"n":"folic acid","a":"","c":"Nutritional","b":"Folic Acid","s":"03b0aee4-804a-de63-e063-6394a90a6635","d":"20260713","p":["The usual therapeutic dosage in adults and children (regard less of age) is up to 1 mg daily.","When clinical symptoms have subsided and the blood picture has become normal, a daily maintenance level should be used, i.e., 0.1 mg for infants and up to 0.3 mg for children under 4 years of age, 0.4 mg for adults and children 4 or more years of age, and 0.8 mg for pregnant and lactating women, but"]},{"n":"fomepizole","a":"","c":"Toxicology","b":"Fomepizole","s":"1dea37fd-ec17-416e-b28e-980a87d49e1a","d":"20231026","p":["Dosing of Fomepizole Injection: A loading dose of 15 mg/kg should be administered, followed by doses of 10 mg/kg every 12 hours for 4 doses, then 15 mg/kg every 12 hours thereafter until ethylene glycol or methanol concentrations are undetectable or have been reduced below 20 mg/dL, and the patient ","Pediatric Use: Safety and effectiveness in pediatric patients have not been established."]},{"n":"fondaparinux","a":"","c":"Hematology","b":"Fondaparinux Sodium","s":"4b65f642-87f7-4da5-a9c9-02cd1f8d9d16","d":"20241215","p":["For patients undergoing hip fracture surgery, extended prophylaxis up to 24 additional days is recommended. ( 2.2 , 2.3 ) \u2022 Treatment of deep vein thrombosis and pulmonary embolism in adults: Fondaparinux sodium injection 5 mg (body weight less than 50 kg), 7.5 mg (50 kg to 100 kg), or 10 mg (greate","Treatment should continue for at least 5 days until INR 2 to 3 is achieved with warfarin sodium. ( 2.4 ) \u2022 Treatment of venous thromboembolism in pediatric patients weighing at least 10 kg: Fondaparinux sodium injection 0.1 mg/kg subcutaneously once daily. ( 2.5 )","2.4 Deep Vein Thrombosis and Pulmonary Embolism Treatment in Adults In adult patients with acute symptomatic DVT and in patients with acute symptomatic PE, the recommended dose of fondaparinux sodium injection is 5 mg (body weight less than 50 kg), 7.5 mg (body weight 50 kg to 100 kg), or 10 mg (bod"]},{"n":"formoterol","a":"","c":"Respiratory","b":"Formoterol fumarate","s":"0796acea-70d6-479f-af48-18723b1efd2a","d":"20240926","p":["8.4 Pediatric Use Formoterol fumarate inhalation solution is not indicated for use in children.","The safety and effectiveness of formoterol fumarate inhalation solution in pediatric patients have not been established.","The pharmacokinetics of formoterol fumarate has not been studied in pediatric patients."]},{"n":"fosfomycin","a":"","c":"Antibiotic","b":"Contepo","s":"855574f2-39f8-43bc-a3d2-79dbb578cb94","d":"20251104","p":["2 DOSAGE AND ADMINISTRATION Administer CONTEPO, 6 grams every 8 hours by intravenous (IV) infusion over 1 hour for up to 14 days, in patients 18 years of age or older with an estimated creatinine clearance (CLcr) greater than 50 mL/min. ( 2.1 )","The recommended dosage in patients 18 years of age and older with an estimated CLcr of 50 mL/min or less is presented in the table below. ( 2.2 ) a CLcr estimated using Cockcroft-Gault Equation. b All doses of CONTEPO are administered by intravenous infusion over 1 hour.","2.1 Recommended Dosage The recommended dosage of CONTEPO is 6 grams administered every 8 hours by intravenous (IV) infusion over 1 hour in patients 18 years of age or older with an estimated creatinine clearance (CLcr) greater than 50 mL/min."]},{"n":"fosphenytoin","a":"","c":"Neuro/anticonvulsant","b":"Fosphenytoin sodium","s":"49b08648-6a83-42c7-ae7b-80c29f2534fc","d":"20231017","p":["For Status Epilepticus: Adult loading dose is 15 to 20 mg PE/kg at a rate of 100 to 150 mg PE/min ( 2.3 )","Pediatric loading dose is 15 to 20 mg PE/kg at a rate of 2 mg PE/kg/min (or 150 mg PE/min, whichever is slower) ( 2.3 )","For Non-emergent Loading and Maintenance Dosing: Adult loading dose is 10 to 20 mg PE/kg given IV or IM; initial maintenance dose is 4 to 6 mg PE/kg/day in divided doses ( 2.4 )"]},{"n":"gabapentin","a":"","c":"Neuro/anticonvulsant","b":"Gabapentin","s":"01b810b7-f4c8-4412-bbc5-b9220d8770d8","d":"20240402","p":["Patients 12 years of age and older: starting dose is 300 mg three times daily; may be titrated up to 600 mg three times daily Patients 3 to 11 years of age: starting dose range is 10 to 15 mg/kg/day, given in three divided doses; recommended dose in patients 3 to 4 years of age is 40 mg/kg/day, give","In clinical studies, efficacy was demonstrated over a range of doses from 1800 mg/day to 3600 mg/day with comparable effects across the dose range; however, in these clinical studies, the additional benefit of using doses greater than 1800 mg/day was not demonstrated 2.2 Dosage for Epilepsy with Par","Pediatric Patients Age 3 to 11 years The starting dose range is 10 mg/kg/day to 15 mg/kg/day, given in three divided doses, and the recommended maintenance dose reached by upward titration over a period of approximately 3 days."]},{"n":"ganciclovir","a":"","c":"Antiviral","b":"Ganciclovir","s":"3059c2da-d4a7-4aea-828c-20e671cb875c","d":"20221221","p":["Induction: 5 mg/kg (given intravenously at a constant rate over 1 hour) every 12 hours for 14 to 21 days.","Maintenance: 5 mg/kg (given intravenously at a constant rate over 1 hour) once daily for 7 days per week, or 6 mg/kg once daily for 5 days per week.","Induction: 5 mg/kg (given intravenously at a constant rate over 1 hour) every 12 hours for 7 to 14 days."]},{"n":"glimepiride","a":"","c":"Endocrine","b":"Glimepiride","s":"0003458f-352a-46fa-9d99-230daa76ae29","d":"20241113","p":["8.4 Pediatric Use The pharmacokinetics, efficacy and safety of glimepiride have been evaluated in pediatric patients with type 2 diabetes as described below.","Glimepiride tablets are not recommended in pediatric patients because of its adverse effects on body weight and hypoglycemia.","The safety and efficacy of glimepiride in pediatric patients was evaluated in a single-blind, 24-week trial that randomized 272 patients (8 to 17 years of age) with type 2 diabetes to glimepiride (n=135) or metformin (n=137)."]},{"n":"glucagon","a":"","c":"Endocrine","b":"Glucagon","s":"15b49500-0aae-4e25-9a1d-709983233cc6","d":"20241215","p":["2 DOSAGE AND ADMINISTRATION Dosage in adult and pediatric patients to treat severe hypoglycemia ( 2.2 ) \u2022 Adults and Pediatric Patients Weighing 20 kg or More: \u25aa The recommended dosage is 1 mg (1 mL) injected subcutaneously or intramuscularly into the upper arm, thigh, or buttocks, or intravenously.","2.2 Dosage for Treatment of Severe Hypoglycemia Adults and Pediatric Patients Weighing 20 kg or More \u2022 The recommended dosage is 1 mg (1 mL) injected subcutaneously or intramuscularly into the upper arm, thigh, or buttocks.","Pediatric Patients Weighing Less Than 20 kg \u2022 The recommended dosage is 0.5 mg (0.5 mL) or dose equivalent to 20 mcg/kg to 30 mcg/kg injected subcutaneously or intramuscularly into the upper arm, thigh, or buttocks."]},{"n":"glucarpidase","a":"","c":"Toxicology","b":"Voraxaze","s":"acaef5a6-b740-40e3-8ffe-74a75c74745c","d":"20241127","p":["8.4 Pediatric Use The safety and effectiveness of VORAXAZE have been established in pediatric patients.","Use of VORAXAZE for this indication is supported by evidence from a single-arm, open-label study in adult and pediatric patients 5 years of age and older with additional safety data in pediatric patients 1 to 17 years of age as described below.","Of the 22 patients in the efficacy dataset in Study 1, 12 were pediatric patients with ages ranging from 5 years to 16 years."]},{"n":"glycerin","a":"","c":"GI","b":"Glycerin","s":"022dd494-cb3c-4fa7-be99-4c38fabdc612","d":"20251024","p":["Directions Single daily dosage children 2 to under 6 years 1 suppository or as directed by a doctor children under 2 years ask a doctor Insert suppository well up intorectum."]},{"n":"glycopyrrolate","a":"","c":"Anesthesia","b":"Glycopyrrolate","s":"02f914a8-2356-4525-91ff-cf0c9e41ba23","d":"20230112","p":["Adults PREANESTHETIC MEDICATION The recommended dose of glycopyrrolate injection is 0.004 mg/kg by intramuscular injection, given 30 to 60 minutes prior to the anticipated time of induction of anesthesia or at the time the preanesthetic narcotic and/or sedative are administered.","Glycopyrrolate injection is not recommended for the treatment of peptic ulcer in pediatric patients (see PRECAUTIONS, Pediatric Use ).","Pediatric Patients (see PRECAUTIONS, Pediatric Use )"]},{"n":"granisetron","a":"","c":"GI","b":"Granisol","s":"2758eb4d-2fe0-4f74-b3f5-b4903009e97c","d":"20250321","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established."]},{"n":"griseofulvin","a":"","c":"Antifungal","b":"GRISEOFULVIN MICROSIZE","s":"1c26d7a6-17d9-4a95-a4ee-cfc5fe6bb95d","d":"20251104","p":["PEDIATRIC PATIENTS (older than 2 years): A dosage of 10 mg/kg daily is usually adequate (pediatric patients from 30 to 50 lb, 125 mg to 250 mg daily; pediatric patients over 50 lb, 250 mg to 500 mg daily, in divided doses).","Pediatric Use Safety and effectiveness in pediatric patients 2 years of age and younger have not been established.","Safety in pediatric patients older than 2 years of age at dosages greater than 10 mg/kg daily has not been established."]},{"n":"guaifenesin","a":"","c":"Cough/cold","b":"Guaifenesin","s":"00c40e3b-6962-dfb4-e063-6294a90afec6","d":"20251219","p":["Directions \u25a0 do not crush, chew, or break tablet \u25a0 take with a full glass of water \u25a0 this product can be administered without regard for timing of meals \u25a0 adults and children 12 years of age and over: 1 tablet every 12 hours.","Do not exceed 2 tablets in 24 hours. \u25a0 children under 12 years of age: do not use"]},{"n":"guanfacine","a":"","c":"Psych","b":"Guanfacine extended-release","s":"07797c4a-a799-436b-a77c-a2861a811a99","d":"20230523","p":["2 DOSAGE AND ADMINISTRATION Recommended dose: 1 mg to 7 mg (0.05 to 0.12 mg/kg target weight based dose range) once daily in the morning or evening based on clinical response and tolerability ( 2.2 ).","To balance the exposure-related potential benefits and risks, the recommended target dose range depending on clinical response and tolerability for guanfacine extended-release tablets is 0.05 to 0.12 mg/kg/day (total daily dose between 1 to 7 mg) (see Table 1).","Table 1: Recommended Target Dose Range for Therapy with Guanfacine Extended-Release Tablets Weight Target dose range (0.05 - 0.12 mg/kg/day)"]},{"n":"haloperidol","a":"","c":"Psych","b":"Haloperidol","s":"051f3c99-7d16-4185-a857-c90440e1b1c5","d":"20260731","p":["Children, debilitated or geriatric patients, as well as those with a history of adverse reactions to antipsychotic drugs, may require less haloperidol.","Children The following recommendations apply to children between the ages of 3 and 12 years (weight range 15 kg to 40 kg).","Haloperidol is not intended for children under 3 years old."]},{"n":"heparin","a":"","c":"Hematology","b":"Heparin Sodium","s":"02fb700d-a28c-4d45-b78d-382dc0d5986c","d":"20250926","p":["Injection Initial dose 5,000 units by intravenous injection, followed by 10,000 to 20,000 units of a concentrated solution, subcutaneously A different site should be used for each injection to prevent the development of massive hematoma Every 8 hours or 8,000 to 10,000 units of a concentrated soluti","Use preservative-free Heparin Sodium Injection in neonates and infants [see Warnings and Precautions ( 5.4 )] .","There are no adequate and well controlled studies on heparin use in pediatric patients."]},{"n":"hepatitis B immune globulin","a":"","c":"Immunology","b":"Nabi-HB","s":"47fe1a99-5078-4b89-84fa-9e8387baec5c","d":"20250410","p":["An injection of 0.06 mL/kg of body weight should be administered intramuscularly as soon as possible after exposure and within 24 hours, if possible.","Table 2 Recommendations for Hepatitis B Prophylaxis Following Percutaneous or Permucosal Exposure 12 * Hepatitis B Immune Globulin (Human) dose of 0.06 mL/kg IM. \u2020 See manufacturer\u2019s recommendation for appropriate dose. \u2021 Less than 10 mIU/mL anti-HBs by radioimmunoassay, negative by enzyme immunoass","Known Source - Low Risk for HBsAg-positive Initiate HB vaccine series Nothing required Unknown Source Initiate HB vaccine series Nothing required Prophylaxis of Infants Born to
