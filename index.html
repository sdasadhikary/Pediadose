ck Adults An atracurium besylate dose of 0.4 to 0.5 mg/kg (1.7 to 2.2 times the ED 95 ), given as an intravenous bolus injection, is the recommended initial dose for most patients.","The same initial atracurium besylate dose of 0.4 to 0.5 mg/kg may be used for intubation prior to administration of these inhalation agents; however, if atracurium is first administered under steady-state of isoflurane or enflurane, the initial atracurium besylate dose should be reduced by approxima","Atracurium besylate doses of 0.08 to 0.1 mg/kg are recommended for maintenance of neuromuscular block during prolonged surgical procedures."]},{"n":"azathioprine","a":"","c":"Immunology","b":"Azathioprine","s":"040d010a-b1b2-4db7-905d-8aa7f1bab0cd","d":"20250519","p":["The initial dose is usually 3 to 5 mg/kg daily, beginning at the time of transplant.","Dose reduction to maintenance levels of 1 to 3 mg/kg daily is usually possible.","The initial dose should be approximately 1.0 mg/kg (50 to 100 mg) given as a single dose or on a twice-daily schedule."]},{"n":"azelastine","a":"","c":"ENT","b":"Azelastine Hydrochloride","s":"305c6dc8-8247-473d-9975-b02903af6d53","d":"20181214","p":["Seasonal allergic rhinitis: Pediatric patients 5 to 11 years of age: 1 spray per nostril twice daily ( 2.1 )","Adults and adolescents 12 years of age and older: 1 or 2 sprays per nostril twice daily ( 2.1 )","Vasomotor rhinitis: 2 sprays per nostril twice daily in adults and adolescents 12 years of age and older ( 2.2 )"]},{"n":"aztreonam","a":"","c":"Antibiotic","b":"Aztreonam","s":"302fd27d-0a22-44ea-91fb-1b1ffcf17a1f","d":"20220430","p":["Dosage in Pediatric Patients Aztreonam for injection should be administered intravenously to pediatric patients with normal renal function.","There are insufficient data regarding intramuscular administration to pediatric patients or dosing in pediatric patients with renal impairment. (See PRECAUTIONS: Pediatric Use . )","Table 3: Aztreonam for Injection Dosage Guidelines for Pediatric Patients* * Maximum recommended dose is 120 mg/kg/day."]},{"n":"bacitracin","a":"","c":"Antibiotic/topical","b":"BACITRACIN","s":"253e5b98-c64f-3226-e063-6294a90a9352","d":"20241112","p":["dosage and administration Clean the affected area and dry thoroughly Apply a thin layer of the cream over affected area twice daily (morning and night) or as directed by a doctor Supervise children in the use of this product For athlete's foot: Pay special attention to spaces between the toes; wear "]},{"n":"baclofen","a":"","c":"Neuro","b":"Gablofen","s":"00d3e846-dd92-448d-9ab8-6a07be823cc1","d":"20260507","p":["Pediatric Patients The starting screening dose for pediatric patients is the same as in adult patients, i.e., 50 mcg.","Pediatric Patients After the first 24 hours, the daily dose should be increased slowly by 5% to 15% only once every 24 hours, until the desired clinical effect is achieved.","8.4 Pediatric Use Children should be of sufficient body mass to accommodate the implantable pump for chronic infusion."]},{"n":"basiliximab","a":"","c":"Immunology","b":"Simulect","s":"1af01887-b69d-444b-91ed-ebfe12784440","d":"20261026","p":["Pediatric In pediatric patients weighing less than 35 kg, the recommended regimen is two doses of 10 mg each.","In pediatric patients weighing 35 kg or more, the recommended regimen is two doses of 20 mg each.","Pediatric Use No randomized, placebo-controlled studies have been completed in pediatric patients."]},{"n":"bedaquiline","a":"","c":"TB","b":"SIRTURO","s":"1534c9ae-4948-4cf4-9f66-222a99db6d0e","d":"20251017","p":["Recommended dosage in pediatric patients (2 years and older and weighing at least 8 kg) is based on body weight. ( 2.4 )","2.2 Required Testing Prior to Administration Prior to treatment with SIRTURO, obtain the following: Susceptibility information for the background regimen against M. tuberculosis isolate if possible [see Dosage and Administration (2.1) ] ECG [see Warnings and Precautions (5.1) ] Serum potassium, calc","2.4 Recommended Dosage in Pediatric Patients (2 years and older and weighing at least 8 kg)"]},{"n":"belimumab","a":"","c":"Rheum","b":"BENLYSTA","s":"2fa3c528-1777-4628-8a55-a69dae2381a3","d":"20261030","p":["2 DOSAGE AND ADMINISTRATION \u2022 See Full Prescribing Information for complete preparation and administration information. ( 2.1 , 2.2 , 2.3 ) \u2022 Intravenous dosage for active SLE or lupus nephritis: o 10 mg/kg at 2\u2011week intervals for the first 3 doses and at 4\u2011week intervals thereafter. o Reconstitute,","Pediatric Patients 5 Years of Age and Older (Weight \u2011 Based Dosing) (Autoinjector Only) a Active SLE 200 mg once weekly \u2022 \u226540 kg: 200 mg once weekly \u2022 15 kg to less than 40 kg: 200 mg once every 2 weeks Active Lupus Nephritis 400 mg b once weekly for 4 doses, followed by 200 mg once weekly \u2022 \u226540 kg:","Recommended Dosage and Administration The recommended intravenous BENLYSTA dosage in patients 5 years of age and older with active SLE or lupus nephritis is 10 mg/kg at 2\u2011week intervals for the first 3 doses and at 4\u2011week intervals thereafter."]},{"n":"benzoyl peroxide","a":"","c":"Topical","b":"BENZOYL PEROXIDE 5% Topical wash","s":"14bf3034-2fe8-44b9-9e26-e804b6046837","d":"20251022","p":["Directions adults and children 2 years and older apply externally to the affected area up to 3 to 4 times a day children under 2 years ask a doctor"]},{"n":"betamethasone","a":"","c":"Steroid","b":"Betaloan SUIK","s":"016a47f2-8524-4178-e063-6294a90ab36e","d":"20241231","p":["DOSAGE AND ADMINISTRATION Benzyl alcohol as a preservative has been associated with a fatal \u201cGasping Syndrome\u201d in premature infants and infants of low birth weight.","Solutions used for further dilution of this product should be preservative-free when used in the neonate, especially the premature infant.","In pediatric patients, the initial dose of betamethasone may vary depending on the specific disease entity being treated."]},{"n":"betamethasone topical","a":"","c":"Topical","b":"Betaloan SUIK","s":"016a47f2-8524-4178-e063-6294a90ab36e","d":"20241231","p":["DOSAGE AND ADMINISTRATION Benzyl alcohol as a preservative has been associated with a fatal \u201cGasping Syndrome\u201d in premature infants and infants of low birth weight.","Solutions used for further dilution of this product should be preservative-free when used in the neonate, especially the premature infant.","In pediatric patients, the initial dose of betamethasone may vary depending on the specific disease entity being treated."]},{"n":"bisacodyl","a":"","c":"GI","b":"Walgreens Gentle Laxative","s":"015e41d2-7543-4210-8345-626f5ae5f81d","d":"20260115","p":["Directions -detach one suppository from the strip -remove wrapper before inserting into the rectum adults and children 12 years of age and older 1 suppository once daily children 6 to under 12 years 1/2 suppository once daily children under 6 years do not use"]},{"n":"bivalirudin","a":"","c":"Hematology","b":"bivalirudin","s":"19a4afc5-151d-4d3c-bfef-48aa8797d695","d":"20250910","p":["2 DOSAGE AND ADMINISTRATION \u2022 The recommended dosage is a 0.75 mg/kg intravenous bolus dose followed immediately by a 1.75 mg/kg/h intravenous infusion for the duration of the procedure.","Five minutes after the bolus dose has been administered, an activated clotting time (ACT) should be performed and an additional bolus dose of 0.3 mg/kg should be given if needed. \u2022 Extending duration of infusion post-procedure up to 4 hours should be considered in patients with ST segment elevation ","The recommended dose of bivalirudin is an intravenous bolus dose of 0.75 mg/kg, followed immediately by an infusion of 1.75 mg/kg/h for the duration of the procedure."]},{"n":"bosentan","a":"","c":"CVS","b":"bosentan","s":"39b2a85f-4322-42d4-b420-1b1d52569143","d":"20251101","p":["2 DOSAGE AND ADMINISTRATION Patients older than 12 years of age: initiate at 62.5 mg orally twice daily; for patients weighing greater than 40 kg, increase to 125 mg orally twice daily after 4 weeks ( 2.2 ).","Patients 12 years of age and younger: dosage is based on weight, see Table 1 ( 2.2 ).","Patients >12 years of age and >40 kg 62.5 mg twice daily 125 mg twice daily Patients >12 years of age and <40 kg 62.5 mg twice daily 62.5 mg twice daily Patients \u226412 years of age \u22654 to 8 kg 16 mg twice daily 16 mg twice daily \u02c38 to 16 kg 32 mg twice daily 32 mg twice daily \u02c316 to 24 kg 48 mg twice d"]},{"n":"brivaracetam","a":"","c":"Neuro/anticonvulsant","b":"brivaracetam","s":"11ca0e1d-1c0d-4357-9ebd-ee1e87185dde","d":"20260814","p":["Pediatric Patients (1 Month to less than 16 Years): The recommended dosage is based on body weight and is administered orally twice daily (2.1)","In pediatric patients weighing less than 50 kg, the recommended dosing regimen is dependent upon body weight.","Table 1: Recommended Dosage for Patients 1 Month of Age and Older Age and Body Weight Initial Dosage Minimum and Maximum Maintenance Dosage Adults (16 years and older)"]},{"n":"bromocriptine","a":"","c":"Endocrine","b":"Bromocriptine mesylate","s":"0ee2da00-faf8-4c51-a696-9462fa4f6050","d":"20230531","p":["Based on limited data in children of age 11 to 15, (see Pediatric Use) the initial dose is half to one 2.5 mg scored tablet daily.","The therapeutic dosage ranged from 2.5-10 mg daily in children with prolactin-secreting pituitary adenomas.","Pediatric Use The safety and effectiveness of bromocriptine for the treatment of prolactin-secreting pituitary adenomas have been established in patients age 16 to adult."]},{"n":"budesonide","a":"","c":"Respiratory/steroid","b":"Budesonide","s":"10336e42-0e9d-45c4-80bc-5149d5ec9e1c","d":"20250619","p":["Pediatrics 8 to 17 years who weigh more than 25 kg: 9 mg once daily for up to 8 weeks, followed by 6 mg once daily in the morning for 2 weeks.","Hepatic Impairment: Consider reducing the dosage to 3 mg once daily in adult patients with moderate hepatic impairment (Child-Pugh Class B). ( 2.4 , 5.1 , 8.6 )","Pediatric patients 8 to 17 years who weigh more than 25 kg: 9 mg orally once daily for up to 8 weeks, followed by 6 mg once daily for 2 weeks."]},{"n":"bumetanide","a":"","c":"Diuretic","b":"Bumetanide","s":"056be255-5880-48e9-b160-bd5b3d82c24a","d":"20250108","p":["Pediatric Use Safety and effectiveness in pediatric patients below the age of 18 have not been established.","In vitro studies using pooled sera from critically ill neonates have shown bumetanide to be a potent displacer of bilirubin (see CLINICAL PHARMACOLOGY: Pediatric Pharmacology ) .","The administration of bumetanide could present a particular concern if given to critically ill or jaundiced neonates at risk for kernicterus."]},{"n":"bupivacaine","a":"","c":"Anesthesia","b":"EXPAREL","s":"bb5a9e59-0f51-11df-8a39-0800200c9a66","d":"20261109","p":["Local infiltration in pediatric patients aged 6 to less than 17 years is 4 mg/kg, up to a maximum of 266 mg ( 2.2 ).","Local Analgesia via Infiltration in Pediatric Patients The recommended dose of EXPAREL for one-time infiltration in pediatric patients, aged 6 to less than 17 years, is 4 mg/kg (up to a maximum of 266 mg), and is based upon two studies of pediatric patients undergoing either spine surgery or cardiac","8.4 Pediatric Use The safety and effectiveness of EXPAREL to produce postsurgical local analgesia via infiltration have been established in pediatric patients aged 6 years and older."]},{"n":"buprenorphine","a":"","c":"Analgesic/opioid","b":"Buprenorphine","s":"023c7816-21b1-4f85-be36-9e32d5935c19","d":"20250203","p":["Also consider prescribing naloxone if the patient has household members (including children) or other close contacts at risk for accidental ingestion or opioid overdose [see Warnings and Precautions (5.2)].","8.4 Pediatric Use The safety and effectiveness of buprenorphine sublingual tablet has not been established in pediatric patients."]},{"n":"buspirone","a":"","c":"Psych","b":"Buspirone Hydrochloride","s":"02628a0c-bfdb-4a58-8e48-bcd8ca12d53b","d":"20190503","p":["The risk of administering methylene blue by non-intravenous routes (such as oral tablets or by local injection) or in intravenous doses much lower than 1 mg per kg with buspirone hydrochloride tablets is unclear.","Pediatric Use The safety and effectiveness of buspirone were evaluated in two placebo-controlled 6- week trials involving a total of 559 pediatric patients (ranging from 6 to 17 years of age) with GAD.","Pharmacokinetic studies have shown that, for identical doses, plasma exposure to buspirone and its active metabolite, 1-PP, are equal to or higher in pediatric patients than adults."]},{"n":"cabergoline","a":"","c":"Endocrine","b":"Cabergoline","s":"275a6a25-c3c9-4258-a610-0b00752517f7","d":"20251208","p":["Pediatric Use: Safety and effectiveness of cabergoline in pediatric patients have not been established."]},{"n":"calcitriol","a":"","c":"Nutritional","b":"Calcitriol","s":"261398eb-80b8-4c3d-9d2b-3a8004347a75","d":"20251113","p":["Most adult patients and pediatric patients age 6 years and older have responded to dosages in the range of 0.5 mcg to 2 mcg daily.","Pediatric patients in the 1 to 5 year age group with hypoparathyroidism have usually been given 0.25 mcg to 0.75 mcg daily.","The number of treated patients with pseudohypoparathyroidism less than 6 years of age is too small to make dosage recommendations."]},{"n":"cannabidiol","a":"","c":"Neuro/anticonvulsant","b":"Epidiolex","s":"8bf27097-4870-43fb-94f0-f3d0871d1eec","d":"20260529","p":["Seizures Associated with Lennox-Gastaut Syndrome or Dravet Syndrome \u2022 The recommended starting dosage is 2.5 mg/kg by mouth twice daily (5 mg/kg/day).","After one week, the dosage can be increased to a maintenance dosage of 5 mg/kg twice daily (10 mg/kg/day). ( 2.2 ) \u2022 Based on individual clinical response and tolerability, EPIDIOLEX can be increased up to a maximum recommended maintenance dosage of 10 mg/kg twice daily (20 mg/kg/day). ( 2.2 )","Seizures Associated with Tuberous Sclerosis Complex \u2022 The recommended starting dosage is 2.5 mg/kg by mouth twice daily (5 mg/kg/day)."]},{"n":"captopril","a":"","c":"CVS","b":"captopril","s":"1395ba5b-2fc9-41ff-9c43-e0740d781dee","d":"20260914","p":["Pediatric Use Neonates with a History of In Utero Exposure to Captopril Tablets If oliguria or hypotension occurs, direct attention toward support of blood pressure and renal perfusion.","While captopril may be removed from the adult circulation by hemodialysis, there is inadequate data concerning the effectiveness of hemodialysis for removing it from the circulation of neonates or children.","Safety and effectiveness in pediatric patients have not been established."]},{"n":"carbamazepine","a":"","c":"Neuro/anticonvulsant","b":"Carbamazepine","s":"0526a054-3eda-49b4-b390-7d5d16e30af8","d":"20260830","p":["Since a given dose of carbamazepine suspension will produce higher peak levels than the same dose given as the tablet, it is recommended to start with low doses (children 6 to 12 years: \u00bd teaspoon four times a day) and to increase slowly to avoid unwanted side effects.","Adults and children over 12 years of age-Initial: Either 200 mg twice a day for tablets and extended-release tablets, or 1 teaspoon four times a day for suspension (400 mg/day).","Dosage generally should not exceed 1000 mg daily in children 12 to 15 years of age, and 1200 mg daily in patients above 15 years of age."]},{"n":"carboplatin","a":"","c":"Oncology","b":"Carboplatin","s":"47677091-fd20-49af-933c-c9dd2be21de9","d":"20240821","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established (see WARNINGS; \"Audiologic Toxicity\" )."]},{"n":"carvedilol","a":"","c":"CVS","b":"Carvedilol","s":"010290af-81f4-0037-e063-6394a90a4638","d":"20260511","p":["8.4 Pediatric Use Effectiveness of carvedilol tablets in patients younger than 18 years has not been established.","In a double-blind trial, 161 children (mean age: 6 years; range: 2 months to 17 years; 45% younger than 2 years) with chronic heart failure [NYHA class II-IV, left ventricular ejection fraction less than 40% for children with a systemic left ventricle (LV), and moderate-severe ventricular dysfunctio","Exposure appeared to be lower in pediatric subjects than adults."]},{"n":"caspofungin","a":"","c":"Antifungal","b":"Caspofungin Acetate","s":"08fb61ee-a05a-4ce1-934c-8cd26c5733db","d":"20260729","p":["Dosage in Adults [18 years of age and older] ( 2.2 ): Administer a single 70 mg loading dose on Day 1, followed by 50 mg once daily for all indications except esophageal candidiasis.","Dosage in Pediatric Patients [3 months to 17 years of age] ( 2.3 ): Dosing should be based on the patient's body surface area.","Pediatric patients receiving these same concomitant medications may also require an increase in dose to 70 mg/m 2 once daily (maximum daily dose not to exceed 70 mg)."]},{"n":"cefaclor","a":"","c":"Antibiotic","b":"Cefaclor","s":"224af904-38f3-4210-a750-e21006db4c66","d":"20221101","p":["Pediatric Patients -- The usual recommended daily dosage for pediatric patients is 20 mg/kg/day in divided doses every 8 hours.","In more serious infections, otitis media, and infections caused by less susceptible organisms, 40 mg/kg/day are recommended, with a maximum dosage of 1 g/day.","Table 1: Cefaclor for Oral Suspension, USP 20 mg/kg/day Weight 125 mg/5 mL 250 mg/5 mL 9 kg 1/2 tsp t.i.d."]},{"n":"cefadroxil","a":"","c":"Antibiotic","b":"Cefadroxil","s":"16f3dd01-650a-2426-e063-6394a90a1b4b","d":"20240425","p":["Children For urinary tract infections, the recommended daily dosage for children is 30 mg/kg/day in divided doses every 12 hours.","For pharyngitis, tonsillitis, and impetigo, the recommended daily dosage for children is 30 mg/kg/day in a single dose or in equally divided doses every 12 hours.","For other skin and skin structure infections, the recommended daily dosage is 30 mg/kg/day in equally divided doses every 12 hours."]},{"n":"cefazolin","a":"","c":"Antibiotic","b":"Cefazolin","s":"00dd6da7-50a8-44c9-b2dc-7948973df392","d":"20260107","p":["Pediatric Dosage: In pediatric patients, a total daily dosage of 25 to 50 mg per kg (approximately 10 to 20 mg per pound) of body weight, divided into 3 or 4 equal doses, is effective for most mild to moderately severe infections.","Total daily dosage may be increased to 100 mg per kg (45 mg per pound) of body weight for severe infections.","Since safety for use in premature infants and in neonates has not been established, the use of Cefazolin for Injection in these patients is not recommended."]},{"n":"cefdinir","a":"","c":"Antibiotic","b":"Cefdinir","s":"06fbdb63-d32f-4212-9962-f1de15597dda","d":"20240214","p":["The recommended dosage and duration of treatment for infections in pediatric patients are described in the following chart; the total daily dose for all infections is 14 mg/kg, up to a maximum dose of 600 mg per day.","Pediatric Patients (Age 6 Months Through 12 Years)","Type of Infection Dosage Duration Acute Bacterial Otitis Media 7 mg/kg q12h or 14 mg/kg q24h 5 to 10 days 10 days Acute Maxillary Sinusitis 7 mg/kg q12h or 14 mg/kg q24h 10 days 10 days Pharyngitis/Tonsillitis 7 mg/kg q12h or 14 mg/kg q24h 5 to 10 days 10 days Uncomplicated Skin and Skin Structure I"]},{"n":"cefepime","a":"","c":"Antibiotic","b":"Cefepime","s":"02aa374f-37b4-456a-b5de-cfd3bbb6ce6e","d":"20230510","p":["2 g IV Every 12 hours 7-10 Pediatric Patients (2 months to 16 years)","Recommended dosage in pediatric with CrCL greater than 60 mL/min. ( 2.2 ) \u2022 The usual recommended dosage in pediatric patients is 50 mg per kg per dose administered every 12 hours (every 8 hours for febrile neutropenia). ( 2.2 ) \u2022 Patients with Renal Impairment: Adjust dose in patients with CrCL les","2 g IV Every 8 to 12 hours 7 to 10 2.2 Pediatric Patients (2 months up to 16 years)"]},{"n":"cefprozil","a":"","c":"Antibiotic","b":"Cefprozil","s":"3391de8b-7bc9-4624-a5c4-836135b39d99","d":"20180831","p":["250 q12h or 500 q12h 10 LOWER RESPIRATORY TRACT Acute Bacterial Exacerbation of Chronic Bronchitis 500 q12h 10 SKIN AND SKIN STRUCTURE Uncomplicated Skin and Skin Structure Infections 250 q12h or 500 q24h or 500 q12h 10 CHILDREN (2 years to 12 years)","Pharyngitis/Tonsillitis 7.5 mg/kg q12h 10 SKIN AND SKIN STRUCTURE Uncomplicated Skin and Skin Structure Infections 20 mg/kg q24h 10 INFANTS & CHILDREN (6 months to 12 years)","15 mg/kg q12h 10 Acute Sinusitis (For moderate to severe infections, the higher dose should be used)"]},{"n":"ceftazidime","a":"","c":"Antibiotic","b":"Ceftazidime","s":"112c5457-8d71-49f5-b531-9761d7d38c93","d":"20260803","p":["Recommended Dosage Schedule *Although clinical improvement has been shown, bacteriologic cures cannot be expected in patients with chronic respiratory disease and cystic fibrosis. **The higher dose should be reserved for immunocompromised pediatric patients or pediatric patients with cystic fibrosis","Dose Frequency Adult Usual recommended dosage 1 gram intravenous or intramuscular every 8 to 12 hours Uncomplicated urinary tract infection 250 mg intravenous or intramuscular every 12 hours Bone and joint infections 2 grams intravenous every 12 hours Complicated urinary tract infections 500 mg intr","30 mg/kg intravenous every 12 hours Infants and children (1 month to 12 years)"]},{"n":"chloramphenicol","a":"","c":"Antibiotic","b":"Chloramphenicol Sodium Succinate","s":"aed29594-211d-49ef-813f-131975a8d0e3","d":"20241010","p":["Pediatric Use Precaution should be used in therapy of premature and full-term neonates and infants to avoid \u201cgray syndrome\u201d toxicity.","Due to immature metabolic processes in the neonate and infant, excessive blood levels may result from administration of the recommended dose.","See DOSAGE AND ADMINISTRATION for dosing information in the pediatric population."]},{"n":"chloroquine","a":"","c":"Antimalarial","b":"Chloroquine Phosphate","s":"0a342f72-45f9-3e12-e063-6394a90ae33e","d":"20260113","p":["In infants and children the dosage is preferably calculated by body weight.","Pediatric Dose: The dosage for prophylaxis is 5 mg calculated as base, per kg of body weight, administered once per week on exactly the same day of each week.","The pediatric dose should never exceed the adult dose regardless of weight."]},{"n":"chlorpromazine","a":"","c":"Psych","b":"chlorpromazine hydrochloride","s":"02c56c39-99bd-44a4-8d9d-9d867c323968","d":"20251016","p":["Pediatric Patients (6 Months To 12 Years of Age)","Chlorpromazine hydrochloride should generally not be used in pediatric patients under 6 months of age except where potentially lifesaving.","It should not be used in conditions for which specific pediatric dosages have not been established."]},{"n":"chlorthalidone","a":"","c":"Diuretic","b":"Chlorthalidone","s":"01065eda-7515-46bc-b858-a062c3aa35bd","d":"20221124","p":["Pediatric Use Safety and effectiveness in children have not been established."]},{"n":"ciclesonide","a":"","c":"Respiratory/steroid","b":"Omnaris","s":"15fefd46-ac7e-40d0-b635-e6c3d653c666","d":"20221108","p":["2.1 Seasonal Allergic Rhinitis Adults and Children (6 Years of Age and Older): The recommended dose of OMNARIS Nasal Spray is 2 sprays per nostril once daily (200 mcg).","2.2 Perennial Allergic Rhinitis Adults and Adolescents (12 Years of Age and Older): The recommended dose of OMNARIS Nasal Spray is 2 sprays per nostril once daily (200 mcg).","8.4 Pediatric Use The safety and effectiveness for seasonal and perennial allergic rhinitis in children 12 years of age and older have been established."]},{"n":"cinacalcet","a":"","c":"Endocrine","b":"CINACALCET","s":"02b8c11b-99e8-4039-b6fa-a9c38d2f48fa","d":"20251212","p":["8.4 Pediatric Use The safety and efficacy of cinacalcet tablets have not been established in pediatric patients.","The use of Cinacalcet for the treatment of secondary HPT in pediatric patients with CKD on dialysis was evaluated in two randomized, controlled studies (Pediatric Study 1 and Study 2) where 47 pediatric patients aged 6 years to less than 18 years received at least one dose of Cinacalcet and in one s","Dosing with cinacalcet in a Pediatric Study 1 was stopped because of a fatality in a cinacalcet-treated individual."]},{"n":"ciprofloxacin","a":"","c":"Antibiotic","b":"ciprofloxacin","s":"0c355077-7361-41d0-9e82-eb31beaf5daa","d":"20250306","p":["Pediatric Oral Dosage Guidelines Infection Dose Frequency Duration Complicated UTI and Pyelonephritis (1 to 17 years of age)","10-20 mg/kg (maximum 750 mg per dose)","15 mg/kg (maximum 500 mg per dose)"]},{"n":"ciprofloxacin and dexamethasone otic","a":"","c":"ENT","b":"Ciprofloxacin and Dexamethasone","s":"130deaf4-ced5-abcb-2a01-205c640ddf96","d":"20241101","p":["2.2 Dosage For the Treatment of Acute Otitis Media in Pediatric Patients (age 6 months and older)","8.4 Pediatric Use The safety and efficacy of ciprofloxacin 0.3% and dexamethasone 0.1% otic suspension have been established in pediatric patients 6 months and older (937 patients) in adequate and well-controlled clinical trials.","No clinically relevant changes in hearing function were observed in 69 pediatric patients (age 4 to 12 years) treated with ciprofloxacin 0.3% and dexamethasone 0.1% otic suspension and tested for audiometric parameters."]},{"n":"ciprofloxacin otic","a":"","c":"ENT","b":"ciprofloxacin","s":"0c355077-7361-41d0-9e82-eb31beaf5daa","d":"20250306","p":["Pediatric Oral Dosage Guidelines Infection Dose Frequency Duration Complicated UTI and Pyelonephritis (1 to 17 years of age)","10-20 mg/kg (maximum 750 mg per dose)","15 mg/kg (maximum 500 mg per dose)"]},{"n":"cisatracurium","a":"","c":"Anesthesia","b":"Cisatracurium besylate","s":"0bacc37a-5e7f-4f05-9206-56fc8041c1ad","d":"20250404","p":["See the Full Prescribing Information for: o Dosage and administration instructions in adults, pediatric patients, geriatric patients, patients with neuromuscular disease, burns, end-stage renal disease, and patients undergoing coronary artery bypass graft surgery with induced hypothermia (2.2, 2.3, ","In conjunction with a propofol/nitrous oxide/oxygen induction-intubation technique or a thiopental/nitrous oxide/oxygen induction-intubation technique, the recommended starting weight-based dose of cisatracurium besylate injection is between 0.15 mg/kg and 0.2 mg/kg administered by bolus intravenous","Doses up to 0.4 mg/kg have been safely administered by bolus intravenous injection to healthy patients and patients with serious cardiovascular disease [ see Clinical Pharmacology (12.2) ]."]},{"n":"cisplatin","a":"","c":"Oncology","b":"Cisplatin","s":"00396546-6a80-4b9f-a5f8-c22c1d1bb173","d":"20240120","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established.","All children should have audiometric monitoring performed prior to initiation of therapy, prior to each subsequent dose, and for several years post therapy.","Advanced testing methods may allow for earlier detection of hearing loss in an attempt to facilitate the rapid initiation of interventions that can limit the potential adverse impact of hearing impairment on a child's cognitive and social development."]},{"n":"clindamycin","a":"","c":"Antibiotic","b":"Cleocin Phosphate","s":"05a75685-0af5-407c-ac57-e380c882b49d","d":"20260729","p":["Alternatively, drug may be administered in the form of a single rapid infusion of the first dose followed by continuous IV infusion as follows: Table 2: Serum Clindamycin Levels Maintained, Rapid Infusion Rate and Maintenance Infusion Rate To maintain serum clindamycin levels Rapid infusion rate Mai","Administration: 20 to 40 mg/kg/day in 3 or 4 equal doses.","Clindamycin should be dosed based on total body weight regardless of obesity."]},{"n":"clobazam","a":"","c":"Neuro/anticonvulsant","b":"Clobazam","s":"07e0ae51-cc71-427f-83cb-311b7fcc5993","d":"20260709","p":["Patients \u226430 kg body weight: Initiate at 5 mg daily and titrate as tolerated up to 20 mg daily ( 2.1 )","Patients greater than 30 kg body weight: Initiate at 10 mg daily and titrate as tolerated up to 40 mg daily ( 2.1 )","Dose patients according to body weight."]},{"n":"clobetasol","a":"","c":"Topical","b":"Clobetasol Propionate","s":"032f1f4e-1f1c-409a-8fac-6449ee543caa","d":"20260807","p":["Geriatric Use : In studies where geriatric patients (65 years of age or older, see PRECAUTIONS ) have been treated with clobetasol propionate ointment, safety did not differ from that in younger patients; therefore, no dosage adjustment is recommended.","Pediatric Use: Safety and effectiveness of clobetasol propionate ointment in pediatric patients have not been established.","Use in pediatric patients under 12 years of age is not recommended."]},{"n":"clofazimine","a":"","c":"Leprosy","b":"Lamprene","s":"2e07448f-f888-4747-80ab-570c1b621250","d":"20260817","p":["8.4 Pediatric Use Safety and effectiveness of LAMPRENE in pediatric patients have not been established."]},{"n":"clonazepam","a":"","c":"Neuro/anticonvulsant","b":"Clonazepam","s":"08d0a109-3307-47b5-8ff2-c0ad83e66f08","d":"20261027","p":["Pediatric Patients: Clonazepam is administered orally.","In order to minimize drowsiness, the initial dose for infants and children (up to 10 years of age or 30 kg of body weight) should be between 0.01 and 0.03 mg/kg/day but not to exceed 0.05 mg/kg/day given in two or three divided doses.","Dosage should be increased by no more than 0.25 to 0.5 mg every third day until a daily maintenance dose of 0.1 to 0.2 mg/kg of body weight has been reached, unless seizures are controlled or side effects preclude further increase."]},{"n":"clonidine","a":"","c":"CVS","b":"Clonidine Hydrochloride","s":"00c6d67a-bb11-4884-9eeb-4e1b8701a08b","d":"20260908","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established in adequate and well-controlled trials (see WARNINGS, Withdrawal )."]},{"n":"clotrimazole","a":"","c":"Antifungal","b":"Clotrimazole","s":"0052992a-819c-4c55-bd88-201a09a3573a","d":"20250221","p":["Directions \u2022 Wash the affected area and dry thoroughly. \u25cf Apply a thin layer of this product over affected area twice daily (morning and night), or as directed by a doctor. \u25cf Supervise children in the use of this product. \u25cf For athlete\u2019s foot, pay special attention to the spaces between the toes; we"]},{"n":"codeine","a":"","c":"Analgesic/opioid","b":"Codeine sulfate","s":"010905f9-3bcb-4b50-9fe8-a3ad0010f14c","d":"20251222","p":["Discuss the importance of having access to an opioid overdose reversal agent, especially if the patient has risk factors for overdose (e.g., concomitant use of CNS depressants, a history of opioid use disorder, or prior opioid overdose) or if there are household members (including children) or other","8.4 Pediatric Use The safety and effectiveness of Codeine Sulfate Tablets in pediatric patients have not been established.","Life-threatening respiratory depression and death have occurred in children who received codeine [see Warnings and Precautions ( 5.6 )] ."]},{"n":"colchicine","a":"","c":"Rheum","b":"colchicine","s":"0f69b9c6-8c00-45e2-b950-34dc5ae62352","d":"20250701","p":["Colchicine tablets are not an analgesic medication and should not be used to treat pain from other causes. \u2022 Gout Flares: Prophylaxis of Gout Flares: 0.6 mg once or twice daily in adults and adolescents older than 16 years of age ( Error! Hyperlink reference not valid. ).","Treatment of Gout Flares: 1.2 mg (two tablets) at the first sign of a gout flare followed by 0.6 mg (one tablet) one hour later ( Error! Hyperlink reference not valid. ). \u2022 FMF: Adults and children older than 12 years 1.2 - 2.4 mg; children 6 to 12 years 0.9 - 1.8 mg; children 4 to 6 years 0.3 - 1.8","2.1 Gout Flares Prophylaxis of Gout Flares The recommended dosage of colchicine tablets for prophylaxis of gout flares for adults and adolescents older than 16 years of age is 0.6 mg once or twice daily."]},{"n":"colistimethate","a":"colistin","c":"Antibiotic","b":"Colistimethate","s":"13dc3525-1879-4bd8-a922-81bc1397d5af","d":"20240829","p":["Dosage Adults and Pediatric Patients - Intravenous or Intramuscular Administration The dose of Colistimethate for Injection, USP should be 2.5 to 5 mg/kg per day of colistin base in 2 to 4 divided doses for patients with normal renal function, depending on the severity of the infection.","In obese individuals, dosage should be based on ideal body weight.","Creatinine Clearance (mL/min) \u226580 50-79 30-49 10-29 Dosage Schedule 2.5 to 5 mg/kg, divided into 2 to 4 doses per day 2.5 to 3.8 mg/kg, divided into 2 doses per day 2.5 mg/kg, once daily or divided into 2 doses per day 1.5 mg/kg every 36 hours INTRAVENOUS ADMINISTRATION Direct Intermittent Administr"]},{"n":"cromolyn","a":"","c":"Respiratory","b":"Gastrocrom","s":"00623958-a8fe-47d1-a0d2-0aa4e2f7966e","d":"20240626","p":["Children 2-12 Years One ampule four times daily, taken one-half hour before meals and at bedtime.","Pediatric Patients Under 2 Years Not recommended.","If satisfactory control of symptoms is not achieved within two to three weeks, the dosage may be increased but should not exceed 40 mg/kg/day."]},{"n":"cyanocobalamin","a":"","c":"Nutritional","b":"Cyanocobalamin","s":"064c6841-3ed2-417f-a77c-a730785b6036","d":"20250612","p":["Pediatric Use Intake in children should be in the amount (0.5 to 3 mcg daily) recommended by the Food and Nutrition Board, National Academy of Science-National Research Council."]},{"n":"cyclopentolate","a":"","c":"Ophthalmic","b":"Cyclogyl","s":"1d008c76-7210-4ace-90fa-7cd22762e12e","d":"20240625","p":["Children: Instill one or two drops of 0.5%, 1% or 2% solution in the eye which may be repeated five to ten minutes later by a second application of 0.5% or 1% solution if necessary.","Small Infants: A single instillation of one drop of 0.5% in the eye.","Observe infant closely for at least 30 minutes following instillation."]},{"n":"cyclophosphamide","a":"","c":"Oncology","b":"Cyclophosphamide","s":"34dbffee-80e0-49c3-90e8-95713a0b7fbe","d":"20240410","p":["2 DOSAGE AND ADMINISTRATION Malignant Diseases: Adult and Pediatric Patients ( 2.2 ) \u2022 Intravenous: Initial course for patients with no hematologic deficiency: 40 mg/kg to 50 mg/kg in divided doses over 2 to 5 days.","2.2 Recommended Dosage for Malignant Diseases Adults and Pediatric Patients Intravenous When used as the only oncolytic drug therapy, the initial course of Cyclophosphamide Injection for patients with no hematologic deficiency usually consists of 40 mg/kg to 50 mg/kg given intravenously in divided d","Other intravenous regimens include 10 mg/kg to 15 mg/kg given every 7 to 10 days or 3 mg/kg to 5 mg/kg twice weekly."]},{"n":"cyclosporine","a":"","c":"Immunology","b":"CYCLOSPORINE","s":"1952d4c7-a40e-4924-b669-c41400774cb9","d":"20261105","p":["The mean \u00b1 SD initial doses were 9 \u00b1 3 mg/kg/day for renal transplant patients (75 centers), 8 \u00b1 4 mg/kg/day for liver transplant patients (30 centers), and 7 \u00b1 3 mg/kg/day for heart transplant patients (24 centers).","A representative dosage schedule based on the patient's weight started with 2.0 mg/kg/day for the first 4 days tapered to 1.0 mg/kg/day by 1 week, 0.6 mg/kg/day by 2 weeks, 0.3 mg/kg/day by 1 month, and 0.15 mg/kg/day by 2 months and thereafter as a maintenance dose.","Particular caution should be exercised when converting patients to cyclosporine capsules (modified) at doses greater than 10 mg/kg/day."]},{"n":"cyproheptadine","a":"","c":"Antihistamine","b":"Cyproheptadine Hydrochloride","s":"03e69414-8a25-4ed8-b7ac-16445b879b1f","d":"20260216","p":["Pediatric Patients Age 2 to 6 years The total daily dosage for pediatric patients may be calculated on the basis of body weight or body area using approximately 0.25 mg/kg/day or 8 mg per square meter of body surface (8 mg/m 2 ).","Adults The total daily dose for adults should not exceed 0.5 mg/kg/day.","Pediatric Use Safety and effectiveness in pediatric patients below the age of two have not been established (see CONTRAINDICATIONS , Newborn or Premature Infants , and WARNINGS , Pediatric Patients )."]},{"n":"cysteamine","a":"","c":"Metabolic","b":"PROCYSBI","s":"d3a3ec28-f746-463a-bb92-3bc8826db09e","d":"20260625","p":["Patients 6 years of age and older : Gradually increase the dosage over 4 to 6 weeks until the maintenance dosage is achieved.","Table 1 shows the recommended starting and maintenance dosages of PROCYSBI, converted from body-surface area to body weight.","Table 1: Starting and Maintenance Dosage of PROCYSBI by Body Weight in Cysteamine-Na\u00efve Patients 1 Year of Age and Older (Dosage Rounded Using Available Strengths of Capsules or Packets of Oral Granules)"]},{"n":"cytarabine","a":"","c":"Oncology","b":"Cytarabine","s":"1be2668b-d76f-4c65-aea9-86c5c40889a2","d":"20220706","p":["Necrotizing leukoencephalopathy occurred in 5 children; these patients had also been treated with intrathecal methotrexate and hydrocortisone, as well as by central nervous system radiation.","Pediatric use See INDICATIONS AND USAGE ."]},{"n":"dactinomycin","a":"","c":"Oncology","b":"Dactinomycin","s":"2aaca42a-3b79-4151-a727-83253556a540","d":"20201113","p":["2 DOSAGE AND ADMINISTRATION Wilms Tumor: The recommended dose is 45 mcg/kg intravenously once every 3 to 6 weeks for up to 26 weeks, as part of a multi-agent combination chemotherapy regimen. ( 2.1 )","Rhabdomyosarcoma: The recommended dose is 15 mcg/kg intravenously once daily for 5 days every 3 to 9 weeks for up to 112 weeks, as part of a multi-agent combination chemotherapy regimen. ( 2.2 )","Gestational Trophoblastic Neoplasia: Non-metastatic and Low-risk Metastatic Disease: The recommended dose is 12 mcg/kg intravenously daily for 5 days, as a single agent. ( 2.5 )"]},{"n":"dalteparin","a":"","c":"Hematology","b":"Fragmin","s":"23527b8b-9b28-4e6d-9751-33b143975ac7","d":"20250930","p":["2 DOSAGE AND ADMINISTRATION Indication Dosing Regimen Unstable angina and non-Q-wave MI 120 units/kg subcutaneous every 12 hours (with aspirin) ( 2.1 )","Extended treatment of VTE in adult patients with cancer Month 1: 200 units/kg subcutaneous once daily ( 2.3 )","Months 2 to 6: 150 units/kg subcutaneous once daily ( 2.3 )"]},{"n":"dapagliflozin","a":"","c":"Endocrine","b":"FARXIGA","s":"01f90c94-71cb-4a1f-81ff-8004b850529b","d":"20260710","p":["2.2 Recommended Dosage for Glycemic Control in Adults and Pediatric Patients Aged 10 Years and Older with Type 2 Diabetes Mellitus In adults and pediatric patients aged 10 years and older with type 2 diabetes mellitus, the recommended starting dosage of FARXIGA is 5 mg orally once daily to improve g","For Adult and Pediatric Patients with Type 2 Diabetes Mellitus and Renal Impairment: \u2022 The recommended dosage for FARXIGA in patients with an eGFR greater than or equal to 45 mL/min/1.73 m 2 is the same as the recommended dosage in patients with normal renal function. \u2022 FARXIGA is not recommended fo","8.4 Pediatric Use The safety and effectiveness of FARXIGA as an adjunct to diet and exercise to improve glycemic control in type 2 diabetes mellitus have been established in pediatric patients aged 10 years and older."]},{"n":"dapsone","a":"","c":"Antibiotic/leprosy","b":"Dapsone","s":"13002250-b4c5-5890-e063-6394a90a2036","d":"20260113","p":["DOSAGE AND ADMINISTRATION Dermatitis herpetiformis The dosage should be individually titrated starting in adults with 50 mg daily and correspondingly smaller doses in children.","In the multidrug program Dapsone should be maintained at the full dosage of 100 mg daily without interruption (with corresponding smaller doses for children) and provided to all patients who have sensitive organisms with new or recrudescent disease or who have not yet completed a two year course of ","Pediatric Use Pediatric patients are treated on the same schedule as adults but with correspondingly smaller doses."]},{"n":"daptomycin","a":"","c":"Antibiotic","b":"Daptomycin","s":"01f3f32a-fac1-4a8f-b205-4601046f0b5c","d":"20230419","p":["Dosage Regimen cSSSI For 7 to 14 days S.aureus Bacteremia For 2 to 6 weeks \u226530 mL/min 4 mg/kg once every 24 hours 6 mg/kg once every 24 hours <30 mL/min, including hemodialysis and CAPD 4 mg/kg once every 48 hours* 6 mg/kg once every 48 hours* *Administered following hemodialysis on hemodialysis day","Pediatric Patients \u2022 Unlike in adults, do NOT administer by injection over a two (2) minute period to pediatric patients . ( 2.1 , 2.7 ) \u2022 Administer to pediatric patients intravenously in 0.9% sodium chloride, by infusion over a 30-or 60-minute period, based on age. ( 2.1 , 2.7 ) \u2022 Recommended dosa","Dosage adjustment for pediatric patients with renal impairment has not been established."]},{"n":"darunavir","a":"","c":"Antiretroviral","b":"Darunavir","s":"04a542b3-15ad-4a8a-aab4-ace8e08732f3","d":"20240429","p":["Pediatric patients (3 to less than 18 years of age and weighing at least 10 kg): dosage of darunavir and ritonavir is based on body weight and should not exceed the adult dose.","2.5 Recommended Dosage in Pediatric Patients (age 3 to less than 18 years)","Prescribers should select the appropriate dose of darunavir/ritonavir for each individual child based on body weight (kg) and should not exceed the recommended dose for adults."]},{"n":"dasatinib","a":"","c":"Oncology","b":"dasatinib","s":"11703145-29ea-480a-9810-bc70663b783f","d":"20240910","p":["Pediatric use information is approved for Bristol-Myers Squibb Company's Sprycel (dasatinib) tablets.","However, due to Bristol-Myers Squibb Company's marketing exclusivity rights, this drug product is not labeled with that pediatric information.","1 Pediatric use information is approved for Bristol-Myers Squibb Company's Sprycel (dasatinib) tablets."]},{"n":"daunorubicin","a":"","c":"Oncology","b":"Daunorubicin Hydrochloride","s":"227784a8-ce68-4dd4-8ac5-a65265969677","d":"20240215","p":["For patients 60 years of age and above, daunorubicin hydrochloride 30 mg/m 2 /day IV on days 1, 2, and 3 of the first course and on days 1, 2 of subsequent courses AND cytosine arabinoside 100 mg/m 2 /day IV infusion daily for 7 days for the first course and for 5 days for subsequent courses.","Representative Dose Schedule and Combination for the Approved Indication of Remission Induction in Pediatric Acute Lymphocytic Leukemia In Combination Daunorubicin hydrochloride 25 mg/m 2 IV on day 1 every week, vincristine 1.5 mg/m 2 IV on day 1 every week, prednisone 40 mg/m 2 PO daily.","In children less than 2 years of age or below 0.5 m 2 body surface area, it has been recommended that the daunorubicin hydrochloride dosage calculation should be based on weight (1 mg/kg) instead of body surface area."]},{"n":"deferasirox","a":"","c":"Hematology","b":"Deferasirox","s":"0354cbc7-9b32-4513-976a-2ef2da39b6b3","d":"20210108","p":["2 DOSAGE AND ADMINISTRATION Transfusional Iron Overload: Initial dose for patients with estimated glomerular filtration rate (eGFR) greater than 60 mL/min/1.73 m 2 is 14 mg per kg (calculated to nearest whole tablet ) once daily. ( 2.1 )","NTDT Syndromes: Initial dose for patients with eGFR greater than 60 mL/min/1.73 m 2 is 7 mg per kg (calculated to nearest whole tablet) once daily. ( 2.2 )","The evidence should include the transfusion of at least 100 mL/kg of packed red blood cells (e.g., at least 20 units of packed red blood cells for a 40 kg person or more in individuals weighing more than 40 kg), and a serum ferritin consistently greater than 1,000 mcg/L."]},{"n":"deferiprone","a":"","c":"Hematology","b":"Deferiprone","s":"58dd1370-5042-833f-e063-6394a90a0777","d":"20260812","p":["Deferiprone tablets (three times a day), 1,000 mg: Starting oral dosage: 75 mg/kg/day (actual body weight) in three divided doses ( 2.3 )","Maximum oral dosage: 99 mg/kg/day (actual body weight) in three divided doses ( 2.3 )","Deferiprone tablets (three times a day), 500 mg: Starting oral dosage: 75 mg/kg/day (actual body weight) in three divided doses ( 2.4 )"]},{"n":"deferoxamine","a":"","c":"Hematology/antidote","b":"Deferoxamine mesylate","s":"598fba68-f46e-4b6e-894c-63c2940b2063","d":"20260306","p":["2 DOSAGE AND ADMINISTRATION The dosage (based on body weight in mg/kg/day), rates of administration, and mode of administration for both adults and pediatric patients are individually determined and adapted during the course of therapy based on the severity of the patient\u2019s iron overload.","The minimum daily dose of deferoxamine mesylate for injection is 20 mg/kg/day for both adults and pediatric patients.","The maximum daily dose is 40 mg/kg/day for pediatric patients and 60 mg/kg/day for adults."]},{"n":"deflazacort","a":"","c":"Steroid","b":"Deflazacort","s":"00df3169-b8e3-4584-823b-91b71807d1a6","d":"20261007","p":["2 DOSAGE AND ADMINISTRATION \u2022 The recommended once-daily dosage is approximately 0.9 mg/kg/day administered orally ( 2.2 ) \u2022 Discontinue gradually when administered for more than a few days ( 2.3 )","2.2 Dosing Information The recommended oral dosage of deflazacort tablets is approximately 0.9 mg/kg/day once daily.","8.4 Pediatric Use The safety and effectiveness of deflazacort tablets for the treatment of DMD have been established in patients 2 years of age and older."]},{"n":"desloratadine","a":"","c":"Antihistamine","b":"Desloratadine","s":"0fe374d0-c14b-4102-b568-eb79165fc7ef","d":"20250710","p":["Dosage (by age): Adults and Adolescents 12 Years of Age and Over: \u2022 Desloratadine Tablets - one 5 mg tablet once daily ( 2 )","2.1 Adults and Adolescents 12 Years of Age and Over The recommended dose of Desloratadine Tablets is one 5-mg tablet once daily.","Dosing recommendation for children with liver or renal impairment cannot be made due to lack of data [ see Clinical Pharmacology (12.3) ]."]},{"n":"desmopressin","a":"","c":"Hematology/endocrine","b":"Desmopressin Acetate","s":"0d447b48-3f4b-430e-9e68-d8b9401c002e","d":"20251113","p":["Fluid restriction should be observed. (See WARNINGS , PRECAUTIONS, Pediatric Use and Geriatric Use .)","Adults and Children It is recommended that patients be started on doses of 0.05 mg (1/2 of the 0.1 mg tablet) two times a day and individually adjusted to their optimum therapeutic dose.","See Pediatric Use subsection for special considerations when administering desmopressin acetate to pediatric diabetes insipidus patients."]},{"n":"dexmedetomidine","a":"","c":"Sedative","b":"Dexmedetomidine Hydrochloride","s":"1896a96e-25f8-494e-9a96-6463b52fb102","d":"20260123","p":["2 DOSAGE AND ADMINISTRATION \u2022 Individualize and titrate dexmedetomidine injection dosing to desired clinical effect. ( 2.1 ) \u2022 Administer dexmedetomidine injection using a controlled infusion device. ( 2.1 ) \u2022 Dilute the 200 mcg/ 2mL (100 mcg/mL) vial contents in 0.9% sodium chloride solution to ach","2.2 Recommended Dosage Table 1: Recommended Dosage in Adult Patients INDICATION DOSAGE AND ADMINISTRATION Initiation of Intensive Care Unit Sedation For adult patients : a loading infusion of one mcg/kg over 10 minutes .","For patients over 65 years of age : Consider a dose reduction [see Use in Specific Populations ( 8.5 )] ."]},{"n":"dexrazoxane","a":"","c":"Oncology","b":"Dexrazoxane","s":"68089182-d4a2-4053-8d0d-fc97a901515d","d":"20250122","p":["8.4 Pediatric Use The safety and effectiveness of dexrazoxane in pediatric patients have not been established [see Warnings and Precautions (5.4)] ."]},{"n":"dextromethorphan","a":"","c":"Cough/cold","b":"Dextromethorphan HBr 15 mg","s":"028b025e-2dde-4bef-ba7b-61774e855b4b","d":"20241121","p":["Directions do not take more than 8 capsules in any 24-hour period this adult product is not intended for use in children under 12 years of age adults and children 12 years of age and over take 2 capsules every 6 to 8 hours, as needed children under 12 years of age do not use"]},{"n":"dextrose","a":"","c":"Electrolyte/critical","b":"Dextrose","s":"672264e3-9709-4bba-2a9d-12bf70c7396a","d":"20260624","p":["Do not administer subcutaneously or intramuscularly. ( 2.1 ) \u2022 The recommended initial dose is 250 mg/kg to 500 mg/kg (1 mL/kg to 2 mL/kg).","If clinically indicated, additional single doses of 250 mg/kg to 500 mg/kg (1 mL/kg to 2 mL/kg) may be administered. ( 2.2 ) \u2022 Infusion rate depends on the age, weight, and clinical and metabolic conditions of the patient and concomitant therapy. ( 2.2 ) \u2022 See full prescribing information for more i","2.2 Recommended Dosage The recommended initial dose of Dextrose Injection (25%) is 250 mg/kg to 500 mg/kg (1 mL/kg to 2 mL/kg)."]},{"n":"diazoxide","a":"","c":"Endocrine","b":"Diazoxide","s":"abe317a5-6c63-469c-89c8-9fedfe859c3d","d":"20260807","p":["Take special care to ensure the accuracy of the dosage in infants and young children.","Adults and children : The recommended starting dosage is 3 mg/kg/day, administered orally, divided into 3 equal doses every 8 hours or 2 equal doses every 12 hours.","The dosage may be titrated to a maximum of 8 mg/kg/day."]},{"n":"diclofenac","a":"","c":"Analgesic/antipyretic","b":"diclofenac potassium","s":"2184805c-b9b3-4be8-8726-4ce1b1197477","d":"20260629","p":["For treatment of mild to moderate acute pain in adult and pediatric patients 12 years of age and older, the dosage is 25 mg four times a day."]},{"n":"dicloxacillin","a":"","c":"Antibiotic","b":"Dicloxacillin Sodium","s":"24e821aa-85b8-4f5a-aa13-83ff132952ca","d":"20261109","p":["RECOMMENDED DOSAGES FOR DICLOXACILLIN SODIUM IN MILD TO MODERATE AND SEVERE INFECTIONS DRUG ADULTS CHILDREN Mild to Moderate Severe Mild to Moderate Severe Dicloxacillin 125 mg every 6 hours 250 mg every 6 hours 12.5 mg/kg/day 1 in equally divided doses every 6 hours 25 mg/kg/day 1 in equally divide","Pediatric Use Because of incompletely developed renal function in newborns, penicillinase-resistant penicillins (especially methicillin) may not be completely excreted, with abnormally high blood levels resulting.","All newborns treated with penicillins should be monitored closely for clinical and laboratory evidence of toxic or adverse effects (see DOSAGE AND ADMINISTRATION )."]},{"n":"dicyclomine","a":"","c":"GI","b":"Dicyclomine hydrochloride","s":"01413a77-48f8-1a8a-e063-6394a90ae494","d":"20230724","p":["8.4 Pediatric Use Safety and effectiveness in pediatric patients have not been established.","Dicyclomine hydrochloride is contraindicated in infants less than 6 months of age [see Contraindications (4) ] .","There are published cases reporting that the administration of dicyclomine hydrochloride to infants has been followed by serious respiratory symptoms (dyspnea, shortness of breath, breathlessness, respiratory collapse, apnea and asphyxia), seizures, syncope, pulse rate fluctuations, muscular hypoton"]},{"n":"digoxin","a":"","c":"CVS","b":"Digoxin","s":"0a88434e-4a1b-4ade-a51e-38145e22a232","d":"20230814","p":["2 DOSAGE AND ADMINISTRATION Digoxin dose is based on patient-specific factors (age, lean body weight, renal function, etc.).","2.1 Important Dosing and Administration Information In selecting a digoxin dosing regimen, it is important to consider factors that affect digoxin blood levels (e.g., body weight, age, renal function, concomitant drugs) since toxic levels of digoxin are only slightly higher than therapeutic levels.","Use digoxin solution to obtain the appropriate dose in infants, young pediatric patients, or patients with very low body weight."]},{"n":"diltiazem","a":"","c":"CVS","b":"diltiazem hydrochloride","s":"0089fc7a-a7aa-4873-b699-39a1b21616ca","d":"20250820","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established."]},{"n":"diphenhydramine","a":"","c":"Antihistamine","b":"Diphenhydramine","s":"00f862aa-6917-45c7-b6aa-1bebb0a45e14","d":"20250516","p":["Pediatric Patients, Other Than Premature Infants and Neonates 5 mg/kg/24 hours or 150 mg/m 2 /24 hours.","Pediatric Use Diphenhydramine should not be used in neonates and premature infants (see CONTRAINDICATIONS ).","Diphenhydramine may diminish mental alertness, or in the young pediatric patient, cause excitation."]},{"n":"dobutamine","a":"","c":"Critical/emergency","b":"Dobutamine Hydrochloride in Dextrose","s":"6b17b98b-e06d-42ed-925f-69aa2699dead","d":"20230908","p":["Infusion of dobutamine should be started at a low rate (0.5-1.0 mcg/kg/min) and titrated at intervals of a few minutes, guided by the patient\u2019s response, including systemic blood pressure, urine flow, frequency of ectopic activity, heart rate, and (whenever possible) measurements of cardiac output, ","In reported trials, the optimal infusion rates have varied from patient to patient, usually 2-20 mcg/kg/min but sometimes slightly outside of this range.","On rare occasions, infusion rates up to 40 mcg/kg/min have been required to obtain the desired effect."]},{"n":"dolutegravir","a":"","c":"Antiretroviral","b":"Tivicay","s":"485bc9db-8665-9f5a-e063-6394a90a7921","d":"20260522","p":["50 mg twice daily Pediatric Patients: Treatment-na\u00efve or treatment-experienced INSTI-na\u00efve patients aged at least 4 weeks and weighing at least 3 kg.","See Tables 2 , 3 , and 4 for complete pediatric dosing recommendations. ( 2.3 , 2.4 , 2.5 ).","Pediatric Population Body Weight Recommended Dose a TIVICAY PD Tablets for Oral Suspension 3 kg to less than 6 kg 5 mg once daily 6 kg to less than 10 kg 15 mg once daily 10 kg to less than 14 kg 20 mg once daily 14 kg to less than 20 kg 25 mg once daily 20 kg and greater 30 mg once daily Alternativ"]},{"n":"dopamine","a":"","c":"Critical/emergency","b":"Dopamine Hydrochloride in Dextrose","s":"08f23f6e-150d-45ea-098e-f2edf64c21a1","d":"20261021","p":["2 DOSAGE AND ADMINISTRATION \u2022 Correct hypovolemia, acidosis, and hypoxia prior to use. ( 2.1 ) \u2022 Administer in a large vein with an infusion pump preferably in an intensive care setting. ( 2.1 ) \u2022 Recommended starting dosage in adults and pediatric patients is 2 to 5 mcg/kg/minute as a continuous in","Titrate in 5 to 10 mcg/kg/minute increments based on hemodynamic response and tolerability, up to not more than 50 mcg/kg/minute. ( 2.2 ) \u2022 See the Full Prescribing Information for important preparation instructions and drug incompatibilities. ( 2.3 )","2.2 Recommended Dosage The recommended starting dosage in adults and pediatric patients is 2 to 5 mcg/kg/minute as a continuous intravenous infusion [see Dosage and Administration (2.3) ] ."]},{"n":"dornase alfa","a":"","c":"Respiratory","b":"Pulmozyme","s":"d8c78a7e-ff99-48f3-8952-643ec2ea0f86","d":"20251217","p":["The eRapid Nebulizer System should only be used by adults and pediatric patients who can use a mouthpiece, and not by younger patients who need a mask to inhale PULMOZYME.","8.4 Pediatric Use The safety and effectiveness of PULMOZYME in conjunction with standard therapies for cystic fibrosis have been established in pediatric patients.","Use of PULMOZYME in pediatric patients is supported by evidence in the following age groups: Patients 5 to 17 years of age: Use of PULMOZYME in patients 5 to 17 years of age is supported by evidence from a randomized, placebo-controlled trial of 303 of clinically stable cystic fibrosis patients 5 to"]},{"n":"doxorubicin","a":"","c":"Oncology","b":"Doxorubicin Hydrochloride","s":"00634b2b-4e48-4178-8877-28582af894ad","d":"20260430","p":["2.4 Dosage Modifications for Hepatic Impairment Doxorubicin Hydrochloride Injection is contraindicated in patients with severe hepatic impairment (Child-Pugh Class C or serum bilirubin greater than 5 mg/dL) [see Contraindications (4) ].","8.4 Pediatric Use Based on postmarketing reports, pediatric patients treated with doxorubicin hydrochloride are at risk for developing late cardiovascular dysfunction.","Long-term periodic cardiovascular monitoring is recommended for all pediatric patients who have received doxorubicin hydrochloride."]},{"n":"dupilumab","a":"","c":"Allergy","b":"Dupixent","s":"595f437d-2729-40bb-9c62-c8ece1f82780","d":"20260422","p":["Dosage in Pediatric Patients 6 Months to 5 Years of Age ( 2.3 ): Body Weight Recommended Dosage For pediatric patients 6 months to 5 years of age, no initial loading dose is recommended 5 to less than 15 kg 200 mg (one 200 mg injection) every 4 weeks (Q4W)","Dosage in Pediatric Patients 6 Years to 17 Years of Age ( 2.3 ): Body Weight Initial Loading Dose Subsequent Dosage Q2W \u2013 every 2 weeks; Q4W \u2013 every 4 weeks 15 to less than 30 kg 600 mg (two 300 mg injections)","300 mg Q2W Asthma Dosage in Adult and Pediatric Patients 12 Years and Older ( 2.4 ): Initial Loading Dose Subsequent Dosage 400 mg (two 200 mg injections)"]},{"n":"eculizumab","a":"","c":"Nephro","b":"SOLIRIS","s":"ebcd67fa-b4d1-4a22-b33d-ee8bf6b9c722","d":"20260708","p":["2 DOSAGE AND ADMINISTRATION For intravenous infusion only; recommended dosage for: PNH: ( 2.2 ) aHUS, gMG, and NMOSD in adults: ( 2.3 ) aHUS and gMG in pediatric patients: ( 2.4 )","2.2 Recommended Dosage for Adults \u2013 PNH The recommended dosage of SOLIRIS for the treatment of PNH in patients 18 years of age and older is administered as an intravenous infusion [see Dosage and Administration (2.7) ] as follows: 600 mg weekly for the first 4 weeks, followed by 900 mg for the fifth","2.3 Recommended Dosage for Adults \u2013 aHUS, gMG, and NMOSD The recommended dosage of SOLIRIS for the treatment of aHUS, gMG, or NMOSD in patients 18 years of age and older is administered as an intravenous infusion [see Dosage and Administration (2.7) ] as follows: 900 mg weekly for the first 4 weeks,"]},{"n":"edetate calcium disodium","a":"","c":"Toxicology","b":"Edetate Calcium Disodium","s":"710a2c8c-3620-4f6f-b8fc-fb19ab9e9f22","d":"20250213","p":["The recommended dose of edetate calcium disodium for asymptomatic adults and pediatric patients whose blood lead level is < 70 mcg/dL but > 20 mcg/dL (World Health Organization recommended upper allowable level) is 1,000 mg/m 2 /day whether given via intravenous infusion or intramuscularly (see Surf","14-18 Therapy of lead poisoning in adults and pediatric patients with edetate calcium disodium is continued over a period of five days.","The intramuscular route is used for all patients with overt lead encephalopathy and this route is preferred by some for young pediatric patients."]},{"n":"efavirenz","a":"","c":"Antiretroviral","b":"Efavirenz","s":"13ca3456-e5bf-4bb1-af95-b1378658a358","d":"20240628","p":["2 DOSAGE & ADMINISTRATION \u2022 Efavirenz should be taken orally once daily on an empty stomach, preferably at bedtime. ( 2 ) \u2022 Recommended adult dose: 600 mg. ( 2.2 ) \u2022 With rifampin, increase efavirenz dose to 800 mg once daily for patients weighing 50 kg or more. ( 2.2 ) \u2022 Pediatric dosing is based o","Efavirenz is not recommended in patients with moderate or severe hepatic impairment (Child Pugh B or C) [ see Warnings and Precautions ( 5.9 ) and Use in Specific Populations ( 8.6 ) ].","2.3 Pediatric Patients It is recommended that efavirenz be taken on an empty stomach, preferably at bedtime."]},{"n":"eltrombopag","a":"","c":"Hematology","b":"Eltrombopag Olamine","s":"05acf38e-7870-4809-a045-fc38e66b1110","d":"20250912","p":["Persistent or Chronic ITP: Initiate eltrombopag tablets at 50 mg orally once daily for most adult and pediatric patients 6 years and older, and at 25 mg orally once daily for pediatric patients aged 1 to 5 years.","First-line Severe Aplastic Anemia: Initiate eltrombopag tablets orally once daily at 2.5 mg/kg (in pediatric patients aged 2 to 5 years old), 75 mg (pediatric patients aged 6 to 11 years old) or 150 mg for patients aged 12 years and older concurrently with standard immunosuppressive therapy.","Initial Dose Regimen Adult and Pediatric Patients 6 Years and Older with ITP Initiate eltrombopag tablets at a dose of 50 mg orally once daily, except in patients who are of East-/Southeast-Asian ancestry or who have mild to severe hepatic impairment (Child-Pugh class A, B, C)."]},{"n":"emicizumab","a":"","c":"Hematology","b":"Hemlibra","s":"2483adba-fab6-4d1b-96c5-c195577ed071","d":"20250711","p":["2 DOSAGE AND ADMINISTRATION Recommended loading dose is 3 mg/kg by subcutaneous injection once weekly for the first 4 weeks, followed by a maintenance dose of: 1.5 mg/kg once every week, or 3 mg/kg once every two weeks, or 6 mg/kg once every four weeks. ( 2.1 )","The recommended loading dose is 3 mg/kg by subcutaneous injection once weekly for the first 4 weeks, followed by a maintenance dose of: 1.5 mg/kg once every week, or 3 mg/kg once every two weeks, or 6 mg/kg once every four weeks.","Self-administration is not recommended for children less than 7 years of age."]},{"n":"empagliflozin","a":"","c":"Endocrine","b":"Jardiance","s":"334f1b3d-5670-6685-e063-6294a90a7e47","d":"20260617","p":["2.2 Recommended Dosage Table 1 presents the recommended dosage of JARDIANCE in adult and pediatric patients aged 10 years and older.","Pediatric patients aged 10 years and older Glycemic control in type 2 diabetes mellitus 10 mg orally once daily in the morning, taken with or without food.","8.4 Pediatric Use The safety and effectiveness of JARDIANCE as an adjunct to diet and exercise to improve glycemic control in type 2 diabetes mellitus have been established in pediatric patients aged 10 years and older."]},{"n":"emtricitabine","a":"","c":"Antiretroviral","b":"Emtriva","s":"d6599395-3944-44f9-97f2-e0424c6b6a1f","d":"20261106","p":["Adult Patients (18 years of age and older) ( 2.3 ): EMTRIVA capsules: One 200 mg capsule administered once daily orally.","Pediatric Patients (0\u20133 months of age) ( 2.4 ): EMTRIVA oral solution: 3 mg/kg administered once daily orally.","Pediatric Patients (3 months through 17 years of age) ( 2.5 ): EMTRIVA capsules: For children weighing more than 33 kg who can swallow an intact capsule, one 200 mg capsule administered once daily orally."]},{"n":"enalapril","a":"","c":"CVS","b":"Enalapril Maleate","s":"074fe718-88d8-365c-e063-6394a90a299d","d":"20260728","p":["Pediatric Hypertensive Patients The usual recommended starting dose is 0.08 mg/kg (up to 5 mg) once daily.","Doses above 0.58 mg/kg (or in excess of 40 mg) have not been studied in pediatric patients (see CLINICAL PHARMACOLOGY, Clinical Pharmacology in Pediatric Patients ).","Enalapril maleate is not recommended in neonates and in pediatric patients with glomerular filtration rate less than 30 mL/min/1.73 m 2 , as no data are available."]},{"n":"enoxaparin","a":"","c":"Hematology","b":"Enoxaparin Sodium","s":"066f27ec-352c-4051-ba29-248e292690db","d":"20260204","p":["Treatment of Deep Vein Thrombosis with or without Pulmonary Embolism The recommended dose of enoxaparin sodium is 1 mg/kg every 12 hours administered subcutaneously in patients with acute deep vein thrombosis without pulmonary embolism, who can be treated at home in an outpatient setting.","The recommended dose of enoxaparin sodium is 1 mg/kg every 12 hours administered subcutaneously or 1.5 mg/kg once a day administered subcutaneously at the same time every day for inpatient (hospital) treatment of patients with acute deep vein thrombosis with pulmonary embolism or patients with acute","Unstable Angina and Non\u2013Q-Wave Myocardial Infarction The recommended dose of enoxaparin sodium is 1 mg/kg administered subcutaneously every 12 hours in conjunction with oral aspirin therapy (100 to 325 mg once daily) in patients with unstable angina or non\u2013Q-wave myocardial infarction."]},{"n":"entecavir","a":"","c":"Antiviral/HBV","b":"Entecavir","s":"007a6ad8-4d23-4543-ae48-c651cac7dd7b","d":"20191124","p":["Nucleoside-inhibitor-treatment-na\u00efve and lamivudine-experienced pediatric patients at least 2 years of age and weighing at least 10 kg: dosing is based on weight. ( 2.3 )","2.2 Recommended Dosage in Adults Compensated Liver Disease The recommended dose of entecavir tablets for chronic hepatitis B virus infection in nucleoside-inhibitor-treatment-na\u00efve adults and adolescents 16 years of age and older is 0.5 mg once daily.","The recommended dose of entecavir tablets in adults and adolescents (at least 16 years of age) with a history of hepatitis B viremia while receiving lamivudine or known lamivudine or telbivudine resistance substitutions rtM204I/V with or without rtL180M, rtL80I/V, or rtV173L is 1 mg once daily."]},{"n":"ergocalciferol","a":"","c":"Nutritional","b":"Ergocalciferol","s":"0d230fd8-2ea7-4dd6-a506-5f7804e539fc","d":"20260520","p":["Pediatric Use Pediatric doses must be individualized (see DOSAGE AND ADMINISTRATION )."]},{"n":"ertapenem","a":"","c":"Antibiotic","b":"Ertapenem","s":"124775ed-1271-4581-be52-b7a08c91283d","d":"20260109","p":["Treatment regimen: Adults and pediatric patients 13 years of age and older.","Patients 3 months to 12 years of age should be administered 15 mg/kg twice daily (not to exceed 1 gram/day intravenously or intramuscularly). ( 2.2 )","Intravenous infusion may be administered in adults and pediatrics for up to 14 days or intramuscular injection for up to 7 days. ( 2.1 )"]},{"n":"erythromycin","a":"","c":"Antibiotic","b":"Erythromycin","s":"0277341c-8513-4317-9334-c242f97630c1","d":"20240320","p":["Children Age, weight and severity of the infection are important factors in determining the proper dosage.","The usual dosage is 30 mg/kg/day to 50 mg/kg/day, in equally divided doses.","1 Conjunctivitis of the Newborn Caused by Chlamydia trachomatis Oral erythromycin suspension 50 mg/kg/day in 4 divided doses for at least 2 weeks."]},{"n":"escitalopram","a":"","c":"Psych","b":"Escitalopram","s":"16a07596-2a89-4897-a829-529452ceb1e8","d":"20230204","p":["The risk of administering methylene blue by non-intravenous routes (such as oral tablets or by local injection) or in intravenous doses much lower than 1 mg/kg with escitalopram tablet is unclear.","8.4 Pediatric Use The safety and effectiveness of escitalopram oxalate have been established in adolescents (12 to 17 years of age) for the treatment of major depressive disorder [see Clinical Studies ( 14.1 )].","The safety and effectiveness of escitalopram oxalate have not been established in pediatric (younger than 12 years of age) patients with major depressive disorder."]},{"n":"esmolol","a":"","c":"CVS","b":"Esmolol Hydrochloride in Water","s":"60b10020-f802-4fef-a487-0f11eca246c5","d":"20240531","p":["Optional loading dose: 500 mcg/kg infused over one minute Then 50 mcg/kg/min for the next 4 minutes Titrate as needed to a maximum of 200 mcg/kg/min Additional loading doses may be administered \u2022 Perioperative tachycardia and hypertension ( 2.2 )","Loading dose: 500 mcg/kg over 1 minute for gradual control (1 mg/kg over 30 seconds for immediate control)","Then 50 mcg/kg/min for gradual control (150 mcg/kg/min for immediate control) adjusted to a maximum of 200 (tachycardia) or 300 (hypertension) mcg/kg/min 2.1 Dosing for the Treatment of Supraventricular Tachycardia or Noncompensatory Sinus Tachycardia Esmolol hydrochloride is administered by continu"]},{"n":"esomeprazole","a":"","c":"GI","b":"Esomeprazole Magnesium","s":"009794ae-8199-4176-9dc6-4c5e752d845c","d":"20240709","p":["2 DOSAGE AND ADMINISTRATION 1 A maximum dosage of 20 mg once daily is recommended for patients with severe liver impairment (Child-Pugh Class C).","4 A starting dosage of 20 mg twice daily is recommended for patients with severe liver impairment (Child-Pugh Class C).","Population Recommended Adult ( 2.1 ) and Pediatric Dosage ( 2.2 )"]},{"n":"estradiol","a":"","c":"Endocrine","b":"Estradiol Vaginal","s":"0137d491-6917-4060-9b32-e0cd7b0badbb","d":"20260413","p":["Pediatric Use Estradiol Vaginal Cream, 0.01% is not indicated in children.","Clinical studies have not been conducted in the pediatric population."]},{"n":"etanercept","a":"","c":"Immunology/rheum","b":"ENBREL","s":"a002b40c-097d-47a5-957f-7a7b1807af7f","d":"20260511","p":["50 mg twice weekly for 3 months, followed by 50 mg once weekly pJIA, Pediatric PsO and JPsA ( 2.4 )","0.8 mg/kg weekly, with a maximum of 50 mg per week 2.1 Testing and Procedures Prior to Treatment Initiation Perform the following evaluations and procedures prior to initiating treatment with Enbrel: Prior to initiating Enbrel and periodically during therapy, evaluate patients for active tuberculosi","2.4 Recommended Dosage for Pediatric Patients with Polyarticular Juvenile Idiopathic Arthritis, Plaque Psoriasis, and Juvenile Psoriatic Arthritis The recommended weight-based dosage for pediatric patients is administered by subcutaneous injection (Table 2)."]},{"n":"ethambutol","a":"","c":"TB","b":"ETHAMBUTOL HYDROCHLORIDE","s":"08decdf3-a397-42e7-8ac3-e489c0cc7085","d":"20231108","p":["Ethambutol hydrochloride is not recommended for use in pediatric patients under 13 years of age since safe conditions for use have not been established.","Initial Treatment In patients who have not received previous antituberculous therapy, administer ethambutol hydrochloride 15 mg/kg (7 mg/lb) of body weight, as a single oral dose once every 24 hours.","Retreatment In patients who have received previous antituberculous therapy, administer ethambutol hydrochloride 25 mg/kg (11 mg/lb) of body weight, as a single oral dose once every 24 hours."]},{"n":"ethosuximide","a":"","c":"Neuro/anticonvulsant","b":"Zarontin","s":"0e008f33-70a1-4bc6-b3a0-d45214418ab6","d":"20260525","p":["The initial dose for patients 3 to 6 years of age is one capsule (250 mg) per day; for patients 6 years of age and older, 2 capsules (500 mg) per day.","The optimal dose for most pediatric patients is 20 mg/kg/day.","Pediatric Use: Safety and effectiveness in pediatric patients below the age of 3 years have not been established. (See DOSAGE AND ADMINISTRATION section.)"]},{"n":"etomidate","a":"","c":"Anesthesia","b":"Etomidate","s":"4312e3c3-34de-4cb3-8abd-c24d24a4bea1","d":"20231120","p":["The dose for induction of anesthesia in adult patients and in pediatric patients above the age of ten (10) years will vary between 0.2 mg/kg and 0.6 mg/kg of body weight, and it must be individualized in each case.","The usual dose for induction in these patients is 0.3 mg/kg, injected over a period of 30 to 60 seconds.","There are insufficient data to support this use of etomidate for longer adult procedures or for any procedures in pediatric patients; therefore, such use is not recommended."]},{"n":"etoposide","a":"","c":"Oncology","b":"Etoposide","s":"0dddbe44-b4f4-431f-9011-8a54abbd4cbf","d":"20260520","p":["Pediatric Use Safety and effectiveness in pediatric patients have not been established.","In premature infants, a life-threatening syndrome consisting of liver and renal failure, pulmonary deterioration, thrombocytopenia, and ascites has been associated with an injectable vitamin E product containing polysorbate 80.","Anaphylactic reactions have been reported in pediatric patients (see WARNINGS section)."]},{"n":"famotidine","a":"","c":"GI","b":"Famotidine","s":"04aaf296-f136-29d7-e063-6294a90affe1","d":"20230907","p":["2 DOSAGE & ADMINISTRATION Recommended adult dosage by indication (2.1): Active DU 40 mg once daily; or 20 mg twice daily Active GU 40 mg once daily Symptomatic Nonerosive GERD 20 mg twice daily Erosive Esophagitis due to GERD 20 mg twice daily; or 40 mg twice daily Pathological Hypersecretory Condit","2.2 Recommended Dosage in Pediatric Patients The recommended dosage and duration of famotidine for oral suspension in pediatric patients with normal renal function is shown in Table 2.","Table 2: Recommended Dosage and Duration of Famotidine for Oral Suspension a in Pediatric Patients with Normal Renal Function Indication Pediatric Age Range Recommended Dosage a Duration Peptic Ulcer Disease 1 year to less than 17 years Starting dosage 0.5 mg/kg once daily; or 0.25 mg/kg twice daily"]},{"n":"fentanyl","a":"","c":"Analgesic/opioid","b":"FENTANYL CITRATE","s":"1ed25b2c-334e-4021-ada1-3396f07630dc","d":"20260407","p":["2 DOSAGE AND ADMINISTRATION \u2022 Fentanyl Citrate Injection should be administered only by persons specifically trained in the use of intravenous anesthetics and management of the respiratory effects of potent opioids. ( 2.1 ) \u2022 Ensure that an opioid overdose reversal agent, resuscitative and intubatio","2.1 Important Dosage and Administration Instructions Fentanyl Citrate Injection should be administered only by persons specifically trained in the use of intravenous anesthetics and management of the respiratory effects of potent opioids. \u2022 Ensure that an opioid overdose reversal agent (e.g., naloxo","Low Dose \u2013 Moderate Dose \u2013 High Dose \u2013 2 mcg/kg (0.002 mg/kg) (0.04 mL/kg)."]},{"n":"ferric carboxymaltose","a":"","c":"Nutritional","b":"Injectafer","s":"517b4a19-45b3-4286-9f6a-ced4e10447de","d":"20260819","p":["For adult patients weighing 50 kg or more, an alternative dose of Injectafer 15 mg/kg body weight up to a maximum of 1,000 mg intravenously may be administered as a single-dose per course. ( 2.2 )","For patients weighing less than 50 kg, the recommended dosage is Injectafer 15 mg/kg body weight intravenously in two doses separated by at least 7 days per course. ( 2.2 )","In adult patients, Injectafer 15 mg/kg body weight up to a maximum of 1,000 mg intravenously may be administered as a single-dose per course."]},{"n":"ferrous sulfate","a":"iron","c":"Nutritional","b":"FERRUM SULPHURICUM","s":"3a749d62-0e20-0c15-e063-6394a90ac1a8","d":"20250721","p":["Adults and children: At the onset of symptoms, dissolve 5 pellets under the tongue 3 times a day until symptoms are relieved or as directed by a doctor."]},{"n":"fexofenadine","a":"","c":"Antihistamine","b":"Fexofenadine HCL","s":"00ef8467-30a0-7579-e063-6294a90a75af","d":"20251219","p":["Directions adults and chil
